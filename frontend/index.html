<!doctype html>
<html lang="zh-CN" spellcheck="false">
  <head>
    <meta charset="UTF-8" />
    <!-- SEC-ELECTRON-01-E3.4: CSP — 保留严格默认策略，补齐 nowen-note 实际资源来源 -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval';
      style-src 'self' 'unsafe-inline';
      img-src 'self' file: data: blob: http: https:;
      font-src 'self' data: blob: http: https:;
      connect-src 'self' http: https: ws: wss:;
      frame-src 'self' blob: data: http: https:;
      media-src 'self' blob: data: http: https:;
      worker-src 'self' blob:;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    " />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="alternate icon" type="image/svg+xml" href="./nowen-note-icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.svg" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>nowen-note</title>
    <script>
      (function () {
        var root = document.documentElement;
        try {
          if (localStorage.getItem("nowen-note-skin") === "macos") root.setAttribute("data-skin", "macos");
          // Match ThemeProvider before React mounts, including its light default.
          var theme = localStorage.getItem("nowen-note-theme");
          var dark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          root.classList.add(dark ? "dark" : "light");
        } catch (e) {}
      })();
    </script>
    <style>
      /* Fall back to the matching app theme palette until index.css loads. */
      :root {
        --app-boot-bg: #ffffff;
        --app-boot-ink: #111827;
        --app-boot-muted: #6b7280;
        --app-boot-paper: #f9fafb;
        --app-boot-cover: #e0e7ff;
        --app-boot-rule: #9ca3af;
        --app-boot-bookmark: #3b82f6;
      }
      :root.dark {
        --app-boot-bg: #0d1117;
        --app-boot-ink: #e6edf3;
        --app-boot-muted: #8b949e;
        --app-boot-paper: #161b22;
        --app-boot-cover: #253040;
        --app-boot-rule: #6e7681;
        --app-boot-bookmark: #58a6ff;
      }
      :root[data-skin="macos"] {
        --app-boot-bg: #ececec;
        --app-boot-ink: #000000;
        --app-boot-muted: rgba(0, 0, 0, 0.60);
        --app-boot-paper: #ffffff;
        --app-boot-cover: #b4d8ff;
        --app-boot-rule: rgba(0, 0, 0, 0.40);
        --app-boot-bookmark: #007aff;
      }
      :root[data-skin="macos"].dark {
        --app-boot-bg: #1e1e1e;
        --app-boot-ink: #ffffff;
        --app-boot-muted: rgba(255, 255, 255, 0.60);
        --app-boot-paper: #2e2e2e;
        --app-boot-cover: rgba(10, 132, 255, 0.30);
        --app-boot-rule: rgba(255, 255, 255, 0.40);
        --app-boot-bookmark: #0a84ff;
      }
      html, body { margin: 0; width: 100%; height: 100%; background: var(--color-bg, var(--app-boot-bg)); }
      .app-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        overflow: auto;
        padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        box-sizing: border-box;
        background: var(--color-bg, var(--app-boot-bg));
        color: var(--color-text-primary, var(--app-boot-ink));
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        text-align: center;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.18s ease;
      }
      .app-boot-splash--visible { opacity: 1; visibility: visible; pointer-events: auto; }
      .app-boot-splash--leaving { opacity: 0; visibility: visible; pointer-events: none; }
      .app-boot-content { width: 100%; max-width: 320px; margin: auto; }
      .app-boot-title { font-size: 17px; font-weight: 650; line-height: 1.4; }
      .app-boot-subtitle { margin-top: 4px; font-size: 13px; line-height: 1.6; color: var(--color-text-secondary, var(--app-boot-muted)); }
      .app-boot-spinner { position: relative; width: 82px; height: 76px; margin: 0 auto 14px; }
      .app-boot-spinner::before, .app-boot-notebook {
        position: absolute;
        top: 9px;
        width: 48px;
        height: 58px;
        box-sizing: border-box;
        border: 1px solid var(--color-text-tertiary, var(--app-boot-rule));
        border-radius: 5px 8px 8px 5px;
      }
      .app-boot-spinner::before {
        content: "";
        left: 24px;
        background: var(--color-active, var(--app-boot-cover));
        transform: rotate(11deg);
      }
      .app-boot-notebook {
        left: 13px;
        background: var(--color-surface, var(--app-boot-paper));
        box-shadow: inset 5px 0 var(--color-active, var(--app-boot-cover)), 0 3px 6px rgba(0, 0, 0, 0.1);
        transform: rotate(-9deg);
        transform-origin: 10% 90%;
      }
      .app-boot-notebook::before {
        content: "";
        position: absolute;
        inset: 21px 9px auto 12px;
        height: 2px;
        border-radius: 2px;
        background: var(--color-text-tertiary, var(--app-boot-rule));
        box-shadow: 0 8px var(--color-text-tertiary, var(--app-boot-rule)), 0 16px var(--color-text-tertiary, var(--app-boot-rule));
      }
      .app-boot-notebook::after {
        content: "";
        position: absolute;
        top: -1px;
        right: 8px;
        width: 8px;
        height: 13px;
        background: var(--color-accent-primary, var(--app-boot-bookmark));
        clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 75%, 0 100%);
      }
      @keyframes appBootLiftPage {
        0%, 65%, 100% { transform: rotate(-9deg); }
        30% { transform: translate(-2px, -6px) rotate(-16deg); }
        52% { transform: translateY(1px) rotate(-7deg); }
      }
      @media (prefers-reduced-motion: no-preference) {
        .app-boot-splash--visible .app-boot-notebook,
        .app-boot-splash--leaving .app-boot-notebook { animation: appBootLiftPage 1.9s ease-in-out infinite; }
      }
      @media (prefers-reduced-motion: reduce) { .app-boot-splash { transition: none; } }
      .app-boot-actions { display: flex; flex-wrap: wrap; justify-content: center; column-gap: 8px; }
      .app-boot-reload, .app-boot-copy { display: none; align-items: center; justify-content: center; margin-top: 12px; padding: 8px 14px; border-radius: 8px; font: inherit; font-size: 13px; cursor: pointer; }
      .app-boot-reload { border: 1px solid transparent; background: var(--color-text-primary, var(--app-boot-ink)); color: var(--color-bg, var(--app-boot-bg)); }
      .app-boot-copy { border: 1px solid var(--color-text-tertiary, var(--app-boot-rule)); background: transparent; color: inherit; }
      .app-boot-actions button:focus-visible { outline: 2px solid var(--color-accent-primary, var(--app-boot-bookmark)); outline-offset: 2px; }
      .app-boot-code { display: none; width: 100%; max-height: 108px; overflow: auto; margin: 12px 0 0; padding: 8px; border-radius: 8px; background: var(--color-surface, var(--app-boot-paper)); box-sizing: border-box; color: var(--color-text-secondary, var(--app-boot-muted)); font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word; text-align: left; }

      /* Issue #145 UI guard styles */
      .fixed.inset-0.z-\[10000\] > [role="dialog"][aria-modal="true"] { background: var(--color-bg, #fff) !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
      .fixed.inset-0.z-\[10000\] > .absolute.inset-0 { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
      [class*="bg-app-surface/60"][class*="backdrop-blur-sm"][class*="rounded-2xl"] { isolation: isolate; z-index: 80 !important; }
      [class*="w-[220px]"][class*="bg-app-elevated"][class*="shadow-lg"] { z-index: 9999 !important; }
      [data-radix-scroll-area-viewport] { overflow-x: hidden !important; }
      .nowen-md-editor-status { min-height: 28px; white-space: nowrap; overflow: hidden; }

      /* 移动端键盘打开时，EditorPane 会隐藏文档路径 Header，并把“返回 / 文档更多”
         通过共享 slot 注入唯一的紧凑编辑工具栏。不要再用全局 CSS 强制恢复旧的双行 Header。 */
      @media (max-width: 767px) {
        /* 展开的格式工具栏本身会换行并纵向溢出，但组件基础类带有 touch-pan-x，
           会阻止手机端纵向拖动。展开态统一交回纵向滚动，同时禁止 flex 把面板
           压到内容高度以下，确保被 max-height 收起的按钮仍可通过滚动访问。 */
        [data-mobile-editor-toolbar="expanded"],
        [data-markdown-mobile-toolbar="expanded"] {
          flex-shrink: 0 !important;
          touch-action: pan-y !important;
          overscroll-behavior: contain;
          -webkit-overflow-scrolling: touch;
          align-content: flex-start;
        }

        /* adjustNothing + Keyboard.resize:none 下 CSS 视口仍是全屏高度，因此键盘打开时
           不能继续只用 vh 判断展开面板。减去原生上报的键盘高度和顶部区域预算，
           让面板始终停留在输入法上方；空间不足时由面板自身纵向滚动。 */
        html[data-keyboard="open"] [data-mobile-editor-toolbar="expanded"],
        html[data-keyboard="open"] [data-markdown-mobile-toolbar="expanded"] {
          max-height: max(8rem, calc(100dvh - var(--keyboard-height, 0px) - var(--safe-area-top, 0px) - 10rem)) !important;
          overflow-y: auto !important;
          overflow-x: hidden !important;
        }
      }
    </style>
    <script>
      (function () {
        // This classic-script prelude executes before Vite's module entry and every dependency
        // chunk. Keep it ES5-syntax-friendly so older Safari/WKWebView can reach the app at all.
        var nativeFeatures = {
          promiseFinally: typeof Promise !== "undefined" && typeof Promise.prototype.finally === "function",
          arrayFindLast: typeof Array !== "undefined" && typeof Array.prototype.findLast === "function",
          arrayFindLastIndex: typeof Array !== "undefined" && typeof Array.prototype.findLastIndex === "function",
          queueMicrotask: typeof window.queueMicrotask === "function"
        };

        function defineBootMethod(target, name, value) {
          if (!target || typeof target[name] === "function") return;
          try {
            Object.defineProperty(target, name, {
              configurable: true,
              writable: true,
              enumerable: false,
              value: value
            });
          } catch (e) {
            try { target[name] = value; } catch (ignored) {}
          }
        }

        function bootLength(value) {
          var numeric = Number(value);
          if (!isFinite(numeric) || numeric <= 0) return numeric === Infinity ? 9007199254740991 : 0;
          return Math.min(Math.floor(numeric), 9007199254740991);
        }

        if (typeof Array !== "undefined") {
          defineBootMethod(Array.prototype, "findLast", function (predicate, thisArg) {
            if (this == null) throw new TypeError("Array.prototype.findLast called on null or undefined");
            if (typeof predicate !== "function") throw new TypeError("predicate must be a function");
            var target = Object(this);
            for (var index = bootLength(target.length) - 1; index >= 0; index -= 1) {
              var value = target[index];
              if (predicate.call(thisArg, value, index, target)) return value;
            }
            return undefined;
          });
          defineBootMethod(Array.prototype, "findLastIndex", function (predicate, thisArg) {
            if (this == null) throw new TypeError("Array.prototype.findLastIndex called on null or undefined");
            if (typeof predicate !== "function") throw new TypeError("predicate must be a function");
            var target = Object(this);
            for (var index = bootLength(target.length) - 1; index >= 0; index -= 1) {
              if (predicate.call(thisArg, target[index], index, target)) return index;
            }
            return -1;
          });
          defineBootMethod(Array.prototype, "toSorted", function (compareFn) {
            if (this == null) throw new TypeError("Array.prototype.toSorted called on null or undefined");
            return Array.prototype.slice.call(this).sort(compareFn);
          });
          defineBootMethod(Array.prototype, "toReversed", function () {
            if (this == null) throw new TypeError("Array.prototype.toReversed called on null or undefined");
            return Array.prototype.slice.call(this).reverse();
          });
        }

        if (typeof Promise !== "undefined" && typeof Promise.prototype.finally !== "function") {
          defineBootMethod(Promise.prototype, "finally", function (onFinally) {
            var promise = this;
            var handler = typeof onFinally === "function" ? onFinally : function () {};
            return promise.then(
              function (value) { return Promise.resolve(handler()).then(function () { return value; }); },
              function (reason) {
                return Promise.resolve(handler()).then(function () { throw reason; });
              }
            );
          });
        }

        if (typeof window.queueMicrotask !== "function" && typeof Promise !== "undefined") {
          window.queueMicrotask = function (callback) {
            Promise.resolve().then(callback).catch(function (error) {
              window.setTimeout(function () { throw error; }, 0);
            });
          };
        }

        function safePathname(pathname) {
          return String(pathname || "/")
            .replace(/\/(public|share)\/[^/]+/gi, "/$1/<redacted>");
        }

        function safeUrl(value) {
          try {
            var parsed = new URL(String(value), window.location.href);
            return parsed.origin + safePathname(parsed.pathname);
          } catch (e) {
            return String(value || "").split("?")[0].split("#")[0];
          }
        }

        function errorText(error) {
          if (!error) return "unknown";
          if (typeof error === "string") return error;
          try {
            return String(error.stack || error.message || error);
          } catch (e) {
            return "unserializable error";
          }
        }

        var diagnostics = {
          startedAt: new Date().toISOString(),
          stage: "resources",
          origin: window.location.origin || "",
          pathname: safePathname(window.location.pathname),
          userAgent: navigator.userAgent || "",
          platform: navigator.platform || "",
          secureContext: window.isSecureContext === true,
          nativeFeatures: nativeFeatures,
          features: {
            promiseFinally: typeof Promise !== "undefined" && typeof Promise.prototype.finally === "function",
            arrayFindLast: typeof Array.prototype.findLast === "function",
            queueMicrotask: typeof window.queueMicrotask === "function",
            fetch: typeof window.fetch === "function",
            mutationObserver: typeof window.MutationObserver === "function"
          },
          errors: []
        };
        window.__NOWEN_BOOT_DIAGNOSTICS__ = diagnostics;
        window.__NOWEN_BOOT_READY__ = false;
        window.__NOWEN_BOOT_FAILED__ = false;

        var bootLanguage = navigator.language || "zh-CN";
        try { bootLanguage = localStorage.getItem("i18nextLng") || bootLanguage; } catch (e) {}
        var bootEnglish = /^en/i.test(bootLanguage);

        window.__NOWEN_REPORT_BOOT_STAGE__ = function (stage) {
          if (window.__NOWEN_BOOT_READY__ && stage !== "ready") return;
          diagnostics.stage = stage;
          diagnostics.stageChangedAt = new Date().toISOString();
        };

        function diagnosticText() {
          diagnostics.elapsedMs = Date.now() - Date.parse(diagnostics.startedAt);
          // Record only script/style resource timings, never API URLs or credentials.
          try {
            diagnostics.resources = window.performance.getEntriesByType("resource")
              .filter(function (entry) { return /\.(js|css)(\?|$)/.test(entry.name); })
              .slice(-20).map(function (entry) {
                return {
                  url: safeUrl(entry.name),
                  durationMs: Math.round(entry.duration),
                  transferSize: entry.transferSize,
                  responseStatus: entry.responseStatus
                };
              });
          } catch (e) {}
          try { return JSON.stringify(diagnostics, null, 2); }
          catch (e) { return "Nowen Note boot diagnostics unavailable"; }
        }

        function fallbackCopy(text) {
          try {
            var area = document.createElement("textarea");
            area.value = text;
            area.setAttribute("readonly", "");
            area.style.position = "fixed";
            area.style.opacity = "0";
            document.body.appendChild(area);
            area.select();
            document.execCommand("copy");
            document.body.removeChild(area);
            return true;
          } catch (e) {
            return false;
          }
        }

        function copyDiagnostics() {
          var text = diagnosticText();
          var button = document.getElementById("app-boot-copy");
          var done = function (ok) {
            if (button) button.textContent = ok ? "诊断信息已复制" : "复制失败，请截图";
          };
          try {
            if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
              var result = navigator.clipboard.writeText(text);
              if (result && typeof result.then === "function") {
                result.then(function () { done(true); }, function () { done(fallbackCopy(text)); });
                return;
              }
            }
          } catch (e) {}
          done(fallbackCopy(text));
        }

        function showBootFailure(code, error) {
          if (window.__NOWEN_BOOT_READY__) return;
          window.__NOWEN_BOOT_FAILED__ = true;
          var render = function () {
            var splash = document.getElementById("app-boot-splash");
            if (!splash) return false;
            var title = splash.querySelector(".app-boot-title");
            var subtitle = splash.querySelector(".app-boot-subtitle");
            var spinner = splash.querySelector(".app-boot-spinner");
            var reload = document.getElementById("app-boot-reload");
            var copy = document.getElementById("app-boot-copy");
            var detail = document.getElementById("app-boot-code");
            window.__NOWEN_BOOT_VISIBLE_AT__ = window.__NOWEN_BOOT_VISIBLE_AT__ || Date.now();
            splash.classList.remove("app-boot-splash--leaving");
            splash.classList.add("app-boot-splash--visible");
            if (title) title.textContent = "应用启动失败";
            if (subtitle) {
              subtitle.textContent = code === "BOOT_TIMEOUT"
                ? "应用未能在预期时间内完成启动。这可能是浏览器兼容性或启动阶段异常，并不等同于网络故障。"
                : "检测到启动阶段异常。你可以重新加载，或复制诊断信息反馈给开发者。";
            }
            if (spinner) spinner.style.display = "none";
            if (reload) {
              reload.style.display = "inline-flex";
              reload.onclick = function () { window.location.reload(); };
            }
            if (copy) {
              copy.style.display = "inline-flex";
              copy.onclick = copyDiagnostics;
            }
            if (detail) {
              detail.style.display = "block";
              detail.textContent = code + (error ? "\n" + errorText(error).slice(0, 600) : "");
            }
            return true;
          };
          if (!render()) {
            window.addEventListener("DOMContentLoaded", render, { once: true });
          }
        }

        function showSlowBoot() {
          if (window.__NOWEN_BOOT_READY__ || window.__NOWEN_BOOT_FAILED__) return;
          diagnostics.slowAt = new Date().toISOString();
          var splash = document.getElementById("app-boot-splash");
          if (!splash) return;
          var title = splash.querySelector(".app-boot-title");
          var subtitle = splash.querySelector(".app-boot-subtitle");
          var reload = document.getElementById("app-boot-reload");
          var copy = document.getElementById("app-boot-copy");
          if (title) title.textContent = bootEnglish ? "Still loading" : "仍在加载";
          if (subtitle) subtitle.textContent = bootEnglish
            ? "Remote access may take longer. The app will open automatically when ready."
            : "远程访问可能需要更长时间，加载完成后会自动进入。";
          if (reload) {
            reload.style.display = "inline-flex";
            reload.textContent = bootEnglish ? "Reload" : "刷新重试";
            reload.onclick = function () { window.location.reload(); };
          }
          if (copy) {
            copy.style.display = "inline-flex";
            copy.textContent = bootEnglish ? "Copy diagnostics" : "复制诊断信息";
            copy.onclick = copyDiagnostics;
          }
        }

        window.__NOWEN_REPORT_BOOT_ERROR__ = function (source, error, fatal) {
          diagnostics.errors.push({
            at: new Date().toISOString(),
            source: String(source || "unknown"),
            message: errorText(error).slice(0, 1200)
          });
          if (fatal !== false) showBootFailure("BOOT_RUNTIME_ERROR", error);
        };

        window.__NOWEN_MARK_BOOT_READY__ = function () {
          window.__NOWEN_BOOT_READY__ = true;
          window.__NOWEN_BOOT_FAILED__ = false;
          window.__NOWEN_REPORT_BOOT_STAGE__("ready");
        };

        window.addEventListener("error", function (event) {
          var target = event && event.target;
          if (target && target.tagName === "SCRIPT") {
            window.__NOWEN_REPORT_BOOT_ERROR__("script-resource:" + safeUrl(target.src), "JavaScript resource failed to load", true);
            return;
          }
          if (event && (event.error || event.message)) {
            window.__NOWEN_REPORT_BOOT_ERROR__("window.error:" + safeUrl(event.filename || ""), event.error || event.message, true);
          }
        }, true);

        window.addEventListener("unhandledrejection", function (event) {
          window.__NOWEN_REPORT_BOOT_ERROR__("unhandledrejection", event && event.reason, true);
        });

        // Fast starts should not flash a splash. Reveal it only after 260ms, then let
        // bootSplash.ts keep it visible for at least 600ms once it has appeared.
        window.__NOWEN_BOOT_REVEAL_TIMER__ = window.setTimeout(function () {
          var splash = document.getElementById("app-boot-splash");
          if (!splash) return;
          window.__NOWEN_BOOT_VISIBLE_AT__ = Date.now();
          splash.classList.add("app-boot-splash--visible");
        }, 260);

        // NAS relays can still be downloading modules at 12s. Keep the loading surface
        // alive, with recovery actions, and reserve failure for a bounded 60s deadline.
        window.__NOWEN_BOOT_SLOW_TIMER__ = window.setTimeout(showSlowBoot, 12000);
        window.__NOWEN_BOOT_TIMER__ = window.setTimeout(function () {
          if (window.__NOWEN_BOOT_READY__ || window.__NOWEN_BOOT_FAILED__) return;
          diagnostics.errors.push({
            at: new Date().toISOString(),
            source: "boot-timeout",
            message: "Application did not become ready within 60 seconds (stage: " + diagnostics.stage + ")"
          });
          showBootFailure("BOOT_TIMEOUT");
        }, 60000);
      })();
    </script>
  </head>
  <body>
    <div id="app-boot-splash" class="app-boot-splash" role="status" aria-live="polite" aria-label="正在恢复工作区">
      <div class="app-boot-content">
        <div class="app-boot-spinner" aria-hidden="true"><span class="app-boot-notebook"></span></div>
        <div class="app-boot-title">Nowen Note</div>
        <div class="app-boot-subtitle">正在恢复你的工作区…</div>
        <div class="app-boot-actions">
          <button id="app-boot-reload" class="app-boot-reload" type="button">刷新重试</button>
          <button id="app-boot-copy" class="app-boot-copy" type="button">复制诊断信息</button>
        </div>
        <pre id="app-boot-code" class="app-boot-code" aria-live="off"></pre>
      </div>
    </div>
    <div id="root" style="height:100vh;width:100vw;overflow:hidden;"></div>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
