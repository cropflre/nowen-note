<!doctype html>
<html lang="zh-CN" class="dark" spellcheck="false">
  <head>
    <meta charset="UTF-8" />
    <!-- SEC-ELECTRON-01-E3.4: CSP — 保留严格默认策略，补齐 nowen-note 实际资源来源 -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval';
      style-src 'self' 'unsafe-inline';
      img-src 'self' file: data: blob: http: https:;
      font-src 'self' data: blob: http: https:;
      connect-src 'self' http: https: ws: wss:;
      frame-src 'self' blob: data: http: https:;
      media-src 'self' blob: data: http: https:;
      worker-src 'self' blob:;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    " />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="alternate icon" type="image/svg+xml" href="./nowen-note-icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.svg" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>nowen-note</title>
    <script>
      (function () {
        try {
          var s = localStorage.getItem("nowen-note-skin");
          if (s === "macos") document.documentElement.setAttribute("data-skin", "macos");
        } catch (e) {}
      })();
    </script>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: #f8fafc; }
      .app-boot-splash { position: fixed; inset: 0; z-index: 999999; display: flex; align-items: center; justify-content: center; padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); box-sizing: border-box; background: radial-gradient(circle at 50% 30%, rgba(37, 99, 235, 0.08), transparent 32%), #f8fafc; color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.18s ease; }
      .app-boot-splash--visible { opacity: 1; visibility: visible; pointer-events: auto; }
      .app-boot-splash--leaving { opacity: 0; visibility: visible; pointer-events: none; }
      .app-boot-card { display: flex; flex-direction: column; align-items: center; gap: 10px; width: min(280px, 100%); padding: 28px 32px; border: 1px solid rgba(148, 163, 184, 0.24); border-radius: 20px; background: rgba(255, 255, 255, 0.86); box-shadow: 0 24px 80px rgba(15, 23, 42, 0.08); box-sizing: border-box; backdrop-filter: blur(16px); }
      .app-boot-logo { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 14px; background: linear-gradient(135deg, #2563eb, #6366f1); color: #ffffff; font-size: 22px; font-weight: 800; box-shadow: 0 10px 30px rgba(37, 99, 235, 0.28); }
      .app-boot-title { font-size: 16px; font-weight: 700; }
      .app-boot-subtitle { font-size: 13px; color: #64748b; text-align: center; }
      .app-boot-spinner { width: 22px; height: 22px; margin-top: 4px; border: 2px solid rgba(37, 99, 235, 0.18); border-top-color: #2563eb; border-radius: 999px; animation: appBootSpin 0.8s linear infinite; }
      .app-boot-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 8px; }
      .app-boot-reload, .app-boot-copy { display: none; align-items: center; justify-content: center; padding: 8px 14px; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer; }
      .app-boot-reload { border: 0; background: #2563eb; color: #ffffff; }
      .app-boot-copy { border: 1px solid rgba(100, 116, 139, 0.35); background: transparent; color: inherit; }
      .app-boot-code { display: none; width: 100%; max-height: 108px; overflow: auto; margin: 2px 0 0; padding: 8px; border-radius: 8px; background: rgba(100, 116, 139, 0.10); box-sizing: border-box; color: #64748b; font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word; text-align: left; }

      /* Issue #145 UI guard styles */
      .fixed.inset-0.z-\[10000\] > [role="dialog"][aria-modal="true"] { background: var(--color-bg, #fff) !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
      .fixed.inset-0.z-\[10000\] > .absolute.inset-0 { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
      [class*="bg-app-surface/60"][class*="backdrop-blur-sm"][class*="rounded-2xl"] { isolation: isolate; z-index: 80 !important; }
      [class*="w-[220px]"][class*="bg-app-elevated"][class*="shadow-lg"] { z-index: 9999 !important; }
      [data-radix-scroll-area-viewport] { overflow-x: hidden !important; }
      .nowen-md-editor-status { min-height: 28px; white-space: nowrap; overflow: hidden; }

      /* 移动端键盘打开时保持文档顶部布局稳定。
         键盘高度仍由 --keyboard-height 负责正文避让；这里只撤销旧的 compact Header
         视觉折叠，避免小屏设备在输入法弹出时把标题栏/格式工具栏挤成另一套布局。 */
      @media (max-width: 767px) {
        html[data-keyboard="open"] header[data-mobile-editor-compact="true"] > div:first-of-type {
          display: flex !important;
        }
        html[data-keyboard="open"] header[data-mobile-editor-compact="true"] > div:nth-of-type(2) {
          padding: 0.125rem 0.75rem 0.5rem !important;
        }
        html[data-keyboard="open"] header[data-mobile-editor-compact="true"] > div:nth-of-type(2) > button:first-child {
          display: none !important;
        }
        html[data-keyboard="open"] header[data-mobile-editor-compact="true"] > div:nth-of-type(2) > button.hidden {
          display: inline-flex !important;
        }

        /* 展开的格式工具栏本身会换行并纵向溢出，但组件基础类带有 touch-pan-x，
           会阻止手机端纵向拖动。展开态统一交回纵向滚动，同时禁止 flex 把面板
           压到内容高度以下，确保被 max-height 收起的按钮仍可通过滚动访问。 */
        [data-mobile-editor-toolbar="expanded"],
        [data-markdown-mobile-toolbar="expanded"] {
          flex-shrink: 0 !important;
          touch-action: pan-y !important;
          overscroll-behavior: contain;
          -webkit-overflow-scrolling: touch;
          align-content: flex-start;
        }

        /* adjustNothing + Keyboard.resize:none 下 CSS 视口仍是全屏高度，因此键盘打开时
           不能继续只用 vh 判断展开面板。减去原生上报的键盘高度和顶部区域预算，
           让面板始终停留在输入法上方；空间不足时由面板自身纵向滚动。 */
        html[data-keyboard="open"] [data-mobile-editor-toolbar="expanded"],
        html[data-keyboard="open"] [data-markdown-mobile-toolbar="expanded"] {
          max-height: max(8rem, calc(100dvh - var(--keyboard-height, 0px) - var(--safe-area-top, 0px) - 10rem)) !important;
          overflow-y: auto !important;
          overflow-x: hidden !important;
        }
      }

      @keyframes appBootSpin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .app-boot-spinner { animation: none; } .app-boot-splash { transition: none; } }
      @media (prefers-color-scheme: dark) { html, body { background: #0f172a; } .app-boot-splash { background: radial-gradient(circle at 50% 30%, rgba(99, 102, 241, 0.16), transparent 34%), #0f172a; color: #e5e7eb; } .app-boot-card { border-color: rgba(148, 163, 184, 0.22); background: rgba(15, 23, 42, 0.78); box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28); } .app-boot-subtitle { color: #94a3b8; } }
    </style>
    <script>
      (function () {
        // This classic-script prelude executes before Vite's module entry and every dependency
        // chunk. Keep it ES5-syntax-friendly so older Safari/WKWebView can reach the app at all.
        var nativeFeatures = {
          promiseFinally: typeof Promise !== "undefined" && typeof Promise.prototype.finally === "function",
          arrayFindLast: typeof Array !== "undefined" && typeof Array.prototype.findLast === "function",
          arrayFindLastIndex: typeof Array !== "undefined" && typeof Array.prototype.findLastIndex === "function",
          queueMicrotask: typeof window.queueMicrotask === "function"
        };

        function defineBootMethod(target, name, value) {
          if (!target || typeof target[name] === "function") return;
          try {
            Object.defineProperty(target, name, {
              configurable: true,
              writable: true,
              enumerable: false,
              value: value
            });
          } catch (e) {
            try { target[name] = value; } catch (ignored) {}
          }
        }

        function bootLength(value) {
          var numeric = Number(value);
          if (!isFinite(numeric) || numeric <= 0) return numeric === Infinity ? 9007199254740991 : 0;
          return Math.min(Math.floor(numeric), 9007199254740991);
        }

        if (typeof Array !== "undefined") {
          defineBootMethod(Array.prototype, "findLast", function (predicate, thisArg) {
            if (this == null) throw new TypeError("Array.prototype.findLast called on null or undefined");
            if (typeof predicate !== "function") throw new TypeError("predicate must be a function");
            var target = Object(this);
            for (var index = bootLength(target.length) - 1; index >= 0; index -= 1) {
              var value = target[index];
              if (predicate.call(thisArg, value, index, target)) return value;
            }
            return undefined;
          });
          defineBootMethod(Array.prototype, "findLastIndex", function (predicate, thisArg) {
            if (this == null) throw new TypeError("Array.prototype.findLastIndex called on null or undefined");
            if (typeof predicate !== "function") throw new TypeError("predicate must be a function");
            var target = Object(this);
            for (var index = bootLength(target.length) - 1; index >= 0; index -= 1) {
              if (predicate.call(thisArg, target[index], index, target)) return index;
            }
            return -1;
          });
          defineBootMethod(Array.prototype, "toSorted", function (compareFn) {
            if (this == null) throw new TypeError("Array.prototype.toSorted called on null or undefined");
            return Array.prototype.slice.call(this).sort(compareFn);
          });
          defineBootMethod(Array.prototype, "toReversed", function () {
            if (this == null) throw new TypeError("Array.prototype.toReversed called on null or undefined");
            return Array.prototype.slice.call(this).reverse();
          });
        }

        if (typeof Promise !== "undefined" && typeof Promise.prototype.finally !== "function") {
          defineBootMethod(Promise.prototype, "finally", function (onFinally) {
            var promise = this;
            var handler = typeof onFinally === "function" ? onFinally : function () {};
            return promise.then(
              function (value) { return Promise.resolve(handler()).then(function () { return value; }); },
              function (reason) {
                return Promise.resolve(handler()).then(function () { throw reason; });
              }
            );
          });
        }

        if (typeof window.queueMicrotask !== "function" && typeof Promise !== "undefined") {
          window.queueMicrotask = function (callback) {
            Promise.resolve().then(callback).catch(function (error) {
              window.setTimeout(function () { throw error; }, 0);
            });
          };
        }

        function safePathname(pathname) {
          return String(pathname || "/")
            .replace(/\/(public|share)\/[^/]+/gi, "/$1/<redacted>");
        }

        function safeUrl(value) {
          try {
            var parsed = new URL(String(value), window.location.href);
            return parsed.origin + safePathname(parsed.pathname);
          } catch (e) {
            return String(value || "").split("?")[0].split("#")[0];
          }
        }

        function errorText(error) {
          if (!error) return "unknown";
          if (typeof error === "string") return error;
          try {
            return String(error.stack || error.message || error);
          } catch (e) {
            return "unserializable error";
          }
        }

        var diagnostics = {
          startedAt: new Date().toISOString(),
          origin: window.location.origin || "",
          pathname: safePathname(window.location.pathname),
          userAgent: navigator.userAgent || "",
          platform: navigator.platform || "",
          secureContext: window.isSecureContext === true,
          nativeFeatures: nativeFeatures,
          features: {
            promiseFinally: typeof Promise !== "undefined" && typeof Promise.prototype.finally === "function",
            arrayFindLast: typeof Array.prototype.findLast === "function",
            queueMicrotask: typeof window.queueMicrotask === "function",
            fetch: typeof window.fetch === "function",
            mutationObserver: typeof window.MutationObserver === "function"
          },
          errors: []
        };
        window.__NOWEN_BOOT_DIAGNOSTICS__ = diagnostics;
        window.__NOWEN_BOOT_READY__ = false;
        window.__NOWEN_BOOT_FAILED__ = false;

        function diagnosticText() {
          try { return JSON.stringify(diagnostics, null, 2); }
          catch (e) { return "Nowen Note boot diagnostics unavailable"; }
        }

        function fallbackCopy(text) {
          try {
            var area = document.createElement("textarea");
            area.value = text;
            area.setAttribute("readonly", "");
            area.style.position = "fixed";
            area.style.opacity = "0";
            document.body.appendChild(area);
            area.select();
            document.execCommand("copy");
            document.body.removeChild(area);
            return true;
          } catch (e) {
            return false;
          }
        }

        function copyDiagnostics() {
          var text = diagnosticText();
          var button = document.getElementById("app-boot-copy");
          var done = function (ok) {
            if (button) button.textContent = ok ? "诊断信息已复制" : "复制失败，请截图";
          };
          try {
            if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
              var result = navigator.clipboard.writeText(text);
              if (result && typeof result.then === "function") {
                result.then(function () { done(true); }, function () { done(fallbackCopy(text)); });
                return;
              }
            }
          } catch (e) {}
          done(fallbackCopy(text));
        }

        function showBootFailure(code, error) {
          if (window.__NOWEN_BOOT_READY__) return;
          window.__NOWEN_BOOT_FAILED__ = true;
          var render = function () {
            var splash = document.getElementById("app-boot-splash");
            if (!splash) return false;
            var title = splash.querySelector(".app-boot-title");
            var subtitle = splash.querySelector(".app-boot-subtitle");
            var spinner = splash.querySelector(".app-boot-spinner");
            var reload = document.getElementById("app-boot-reload");
            var copy = document.getElementById("app-boot-copy");
            var detail = document.getElementById("app-boot-code");
            window.__NOWEN_BOOT_VISIBLE_AT__ = window.__NOWEN_BOOT_VISIBLE_AT__ || Date.now();
            splash.classList.remove("app-boot-splash--leaving");
            splash.classList.add("app-boot-splash--visible");
            if (title) title.textContent = "应用启动失败";
            if (subtitle) {
              subtitle.textContent = code === "BOOT_TIMEOUT"
                ? "应用未能在预期时间内完成启动。这可能是浏览器兼容性或启动阶段异常，并不等同于网络故障。"
                : "检测到启动阶段异常。你可以重新加载，或复制诊断信息反馈给开发者。";
            }
            if (spinner) spinner.style.display = "none";
            if (reload) {
              reload.style.display = "inline-flex";
              reload.onclick = function () { window.location.reload(); };
            }
            if (copy) {
              copy.style.display = "inline-flex";
              copy.onclick = copyDiagnostics;
            }
            if (detail) {
              detail.style.display = "block";
              detail.textContent = code + (error ? "\n" + errorText(error).slice(0, 600) : "");
            }
            return true;
          };
          if (!render()) {
            window.addEventListener("DOMContentLoaded", render, { once: true });
          }
        }

        window.__NOWEN_REPORT_BOOT_ERROR__ = function (source, error, fatal) {
          diagnostics.errors.push({
            at: new Date().toISOString(),
            source: String(source || "unknown"),
            message: errorText(error).slice(0, 1200)
          });
          if (fatal !== false) showBootFailure("BOOT_RUNTIME_ERROR", error);
        };

        window.__NOWEN_MARK_BOOT_READY__ = function () {
          window.__NOWEN_BOOT_READY__ = true;
          window.__NOWEN_BOOT_FAILED__ = false;
        };

        window.addEventListener("error", function (event) {
          var target = event && event.target;
          if (target && target.tagName === "SCRIPT") {
            window.__NOWEN_REPORT_BOOT_ERROR__("script-resource:" + safeUrl(target.src), "JavaScript resource failed to load", true);
            return;
          }
          if (event && (event.error || event.message)) {
            window.__NOWEN_REPORT_BOOT_ERROR__("window.error:" + safeUrl(event.filename || ""), event.error || event.message, true);
          }
        }, true);

        window.addEventListener("unhandledrejection", function (event) {
          window.__NOWEN_REPORT_BOOT_ERROR__("unhandledrejection", event && event.reason, true);
        });

        // Fast starts should not flash a splash card. Reveal it only after 260ms, then let
        // bootSplash.ts keep it visible for at least 600ms once the card has appeared.
        window.__NOWEN_BOOT_REVEAL_TIMER__ = window.setTimeout(function () {
          var splash = document.getElementById("app-boot-splash");
          if (!splash) return;
          window.__NOWEN_BOOT_VISIBLE_AT__ = Date.now();
          splash.classList.add("app-boot-splash--visible");
        }, 260);

        window.__NOWEN_BOOT_TIMER__ = window.setTimeout(function () {
          if (window.__NOWEN_BOOT_READY__) return;
          diagnostics.errors.push({
            at: new Date().toISOString(),
            source: "boot-timeout",
            message: "Application did not become ready within 12 seconds"
          });
          showBootFailure("BOOT_TIMEOUT");
        }, 12000);
      })();
    </script>
  </head>
  <body>
    <div id="app-boot-splash" class="app-boot-splash" role="status" aria-live="polite" aria-label="正在恢复工作区">
      <div class="app-boot-card">
        <div class="app-boot-logo" aria-hidden="true">N</div>
        <div class="app-boot-title">nowen-note</div>
        <div class="app-boot-subtitle">正在恢复你的工作区…</div>
        <div class="app-boot-spinner" aria-hidden="true"></div>
        <div class="app-boot-actions">
          <button id="app-boot-reload" class="app-boot-reload" type="button">刷新重试</button>
          <button id="app-boot-copy" class="app-boot-copy" type="button">复制诊断信息</button>
        </div>
        <pre id="app-boot-code" class="app-boot-code" aria-live="off"></pre>
      </div>
    </div>
    <div id="root" style="height:100vh;width:100vw;overflow:hidden;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
