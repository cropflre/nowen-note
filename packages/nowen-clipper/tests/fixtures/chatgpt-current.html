<!doctype html><html><head><title>Fixture 当前布局 - ChatGPT</title></head><body>
<!-- Mirrors the structure ChatGPT used in November 2026 (attribute names reported from a real page; values and text are invented). -->
<main>
  <div data-rail-chat-transcript="true" data-thread-find-target="conversation">
    <div data-turn-key="turn-1" data-talvt-turn-state="complete">
      <div data-spacing="activity">
        <h4 data-conversation-role="user">你说：</h4>
        <div data-chatgpt-search-unit-key="unit-u1" data-chatgpt-search-message-ids="u-0001">
          <div data-content-search-unit-key="unit-u1">
            <div data-user-message-bubble="true" data-user-message-has-prompt="true"><p>帮我整理今天的 AI 热点。</p><button data-state="closed">编辑消息</button></div>
          </div>
        </div>
        <span data-chatgpt-agent-turn-start=""><button data-turn-disclosure-button="">已思考 8 秒</button></span>
        <div data-content-search-unit-key="unit-a1" data-chatgpt-search-unit-key="unit-a1" data-chatgpt-search-message-ids="t-0001,a-0001">
          <h4 data-conversation-role="assistant">ChatGPT 说：</h4>
          <div data-response-body="a-0001">
            <div data-chatgpt-selection-conversation-id="conv-1" data-chatgpt-selection-message-id="a-0001">
              <div data-selected-text-overlay-target="target" data-markdown-text-style="assistant-message">
                <div data-dil-source-message-id="a-0001" data-chatgpt-copy-reference="1" data-markdown-copy="contents">
                  <div data-theme="light">
                    <div data-dil-response="" data-d-direction="col" data-dil-message-id="a-0001">
                      <h3>1. 模型更新</h3>
                      <p><span data-d-stream-run="" data-d-text-flow="">Qwen4-Max 发布。</span><span data-markdown-copy="exclude"><a href="https://example.test/news">IT之家 +1</a></span></p>
                      <table><thead><tr><th>优先级</th><th>建议</th></tr></thead><tbody><tr><td>高</td><td>测试工具调用</td></tr></tbody></table>
                      <pre><code class="language-python">print("ok")</code></pre>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <button data-state="closed">复制回复</button>
      </div>
    </div>
    <div data-turn-key="turn-2" data-talvt-turn-state="streaming">
      <div data-spacing="activity">
        <h4 data-conversation-role="user">你说：</h4>
        <div data-chatgpt-search-unit-key="unit-u2" data-chatgpt-search-message-ids="u-0002">
          <div data-user-message-bubble="true"><p>再补充一条。</p></div>
        </div>
        <div data-chatgpt-search-unit-key="unit-a2" data-chatgpt-search-message-ids="a-0002">
          <h4 data-conversation-role="assistant">ChatGPT 说：</h4>
          <div data-response-body=""><div data-markdown-copy="contents"><p>正在生成的回</p></div></div>
        </div>
      </div>
    </div>
  </div>
</main></body></html>
