<!doctype html><html lang="zh-CN"><head><title>Personal Dashboard</title><link rel="stylesheet" href="style.css"></head><body><main><header><h1>Personal Dashboard</h1><p>个人事项 · 分组 · 状态 · 笔记与任务关联 / Personal items, groups and links</p></header><p id="status" role="status">Loading…</p><section id="create"><label>Title / 标题<input id="title" required maxlength="120"></label><label>Group / 分组<input id="group" value="Personal" maxlength="40"></label><label>Linked note / 关联笔记<select id="note"><option value="">—</option></select></label><label>Linked task / 关联任务<select id="task"><option value="">—</option></select></label><button id="add-item" type="button">Add item</button></section><section><label>Filter group / 筛选分组<input id="filter" maxlength="40"></label><button id="reload">Refresh</button><p id="summary"></p><ul id="items"></ul><nav><button id="previous">Previous</button><span id="page"></span><button id="next">Next</button></nav></section><footer><button id="notes">Back to notes</button><button id="tasks">Open Nowen tasks</button></footer></main><script src="app.js"></script></body></html>
