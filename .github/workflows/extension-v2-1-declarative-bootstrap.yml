name: Extension V2.1 Declarative Bootstrap

on:
  push:
    branches: [release/v1.5.0]
    paths: [".github/workflows/extension-v2-1-declarative-bootstrap.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finish declarative lifecycle integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lifecycle = Path("backend/src/plugins/pluginLifecycle.ts")
          s = lifecycle.read_text()
          old = 'import type { PluginLifecycleState, PluginManifest, PluginRegistryRecord, PluginUpdateStage, PluginVersionRecord } from "./types.js";'
          new = 'import { pluginManifestMain, type PluginLifecycleState, type PluginManifest, type PluginRegistryRecord, type PluginUpdateStage, type PluginVersionRecord } from "./types.js";'
          if old not in s:
              raise SystemExit("pluginLifecycle import fragment missing")
          s = s.replace(old, new, 1)
          count = s.count("manifest.main,")
          if count != 2:
              raise SystemExit(f"expected 2 manifest.main persistence writes, found {count}")
          s = s.replace("manifest.main,", "pluginManifestMain(manifest),")
          lifecycle.write_text(s)

          service = Path("backend/src/plugins/pluginService.ts")
          s = service.read_text()
          old = '    const previousPermissions = new Set(previousManifest?.permissions || []);\n    return {'
          new = '    const previousPermissions = new Set(previousManifest?.permissions || []);\n    const currentPermissions = new Set(manifest.permissions);\n    return {'
          if old not in s:
              raise SystemExit("PluginService permission set insertion fragment missing")
          s = s.replace(old, new, 1)
          old = '        removed: previousManifest.permissions.filter((permission) => !manifest.permissions.includes(permission)),'
          new = '        removed: previousManifest.permissions.filter((permission) => !currentPermissions.has(permission)),'
          if old not in s:
              raise SystemExit("PluginService permission diff fragment missing")
          s = s.replace(old, new, 1)
          service.write_text(s)

          manifest = Path("backend/src/plugins/manifest.ts")
          s = manifest.read_text()
          old = '''}).strict().superRefine((contributes, ctx) => {\n  if (!(contributes.settings?.length || contributes.automationTemplates?.length)) {\n    ctx.addIssue({ code: z.ZodIssueCode.custom, message: "声明式插件必须至少提供一个静态 Contribution" });\n  }\n});'''
          new = '''}).strict().superRefine((contributes, ctx) => {\n  if (!(contributes.settings?.length || contributes.automationTemplates?.length)) {\n    ctx.addIssue({ code: z.ZodIssueCode.custom, message: "声明式插件必须至少提供一个静态 Contribution" });\n  }\n  if (contributes.settings?.some((setting) => setting.secret)) {\n    ctx.addIssue({ code: z.ZodIssueCode.custom, path: ["settings"], message: "声明式插件不能声明 Secret Setting" });\n  }\n});'''
          if old not in s:
              raise SystemExit("declarative contributes refine fragment missing")
          s = s.replace(old, new, 1)
          old = '''  if (manifest.runtime === "declarative") return;\n  if (new Set(manifest.actions.map((action) => action.id)).size !== manifest.actions.length)'''
          new = '''  if (manifest.runtime === "declarative") {\n    if (manifest.permissionConfig) ctx.addIssue({ code: z.ZodIssueCode.custom, path: ["permissionConfig"], message: "声明式插件不能声明权限配置" });\n    return;\n  }\n  if (new Set(manifest.actions.map((action) => action.id)).size !== manifest.actions.length)'''
          if old not in s:
              raise SystemExit("declarative permissionConfig refine fragment missing")
          s = s.replace(old, new, 1)
          manifest.write_text(s)
          PY
      - name: Commit lifecycle fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/plugins/pluginLifecycle.ts backend/src/plugins/pluginService.ts backend/src/plugins/manifest.ts
          git commit -m "fix(extensions): enforce declarative zero-code lifecycle"
          git push origin HEAD:release/v1.5.0
