name: PostgreSQL Note Transfer Orchestration Lifecycle Fix 20260805

on:
  push:
    branches: [feat/pg-note-transfer-orchestration-20260805]
    paths:
      - ".github/workflows/pg-note-transfer-orchestration-lifecycle-fix-20260805.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pg-note-transfer-orchestration-20260805
          fetch-depth: 0
      - name: Preserve status compatibility and close test workers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          route = Path("backend/src/routes/note-transfers-runtime.ts")
          text = route.read_text()
          old = '''      return c.json(await orchestrationRuntime.getStatus({
                actorUserId: c.req.header("X-User-Id") || "",
                idempotencyKey: c.req.param("idempotencyKey"),
              }));'''
          new = '''      const snapshot = await orchestrationRuntime.getStatus({
                actorUserId: c.req.header("X-User-Id") || "",
                idempotencyKey: c.req.param("idempotencyKey"),
              });
              return c.json({
                ...snapshot.operation,
                ...snapshot,
              });'''
          if text.count(old) != 1:
            raise SystemExit("status route anchor mismatch")
          route.write_text(text.replace(old, new, 1))

          test = Path("backend/tests/note-transfer-orchestration-runtime-pg.test.ts")
          test_text = test.read_text()
          test_text = test_text.replace(
            "function createDeterministicRuntime(adapter: PostgresAdapter) {",
            "function createDeterministicRuntime(\n  adapter: PostgresAdapter,\n  shutdowns: Array<() => Promise<void>>,\n) {",
            1,
          )
          old_return = '''  return createNoteTransferOrchestrationRuntime(adapter, {
              repository,
              effects,
              moveDeletion,
              retryBaseSeconds: 0,
              maxTransitions: 4,
            });'''
          new_return = '''  const orchestration = createNoteTransferOrchestrationRuntime(adapter, {
              repository,
              effects,
              moveDeletion,
              retryBaseSeconds: 0,
              maxTransitions: 4,
            });
            shutdowns.push(async () => {
              await orchestration.shutdown();
              await effectsBase.shutdown();
              await moveBase.shutdown();
            });
            return orchestration;'''
          if test_text.count(old_return) != 1:
            raise SystemExit("runtime return anchor mismatch")
          test_text = test_text.replace(old_return, new_return, 1)
          test_text = test_text.replace(
            "    const adapter = new PostgresAdapter(pool);\n    const orchestration = createDeterministicRuntime(adapter);",
            "    const adapter = new PostgresAdapter(pool);\n    const shutdowns: Array<() => Promise<void>> = [];\n    const orchestration = createDeterministicRuntime(adapter, shutdowns);",
            1,
          )
          test_text = test_text.replace(
            "    const restartedRuntime = createDeterministicRuntime(adapter);",
            "    const restartedRuntime = createDeterministicRuntime(adapter, shutdowns);",
            1,
          )
          test_text = test_text.replace(
            "  } finally {\n    await closePgPool(pool);\n  }",
            "  } finally {\n    const pendingShutdowns = (globalThis as any).__noteTransferOrchestrationShutdowns as Array<() => Promise<void>> | undefined;\n    if (pendingShutdowns) await Promise.allSettled(pendingShutdowns.map((shutdown) => shutdown()));\n    await closePgPool(pool);\n  }",
            1,
          )
          # Keep shutdowns reachable from the outer finally without changing the test's broad structure.
          test_text = test_text.replace(
            "    const shutdowns: Array<() => Promise<void>> = [];\n    const orchestration",
            "    const shutdowns: Array<() => Promise<void>> = [];\n    (globalThis as any).__noteTransferOrchestrationShutdowns = shutdowns;\n    const orchestration",
            1,
          )
          test.write_text(test_text)
          PY
          git diff --check
      - name: Commit lifecycle fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/routes/note-transfers-runtime.ts backend/tests/note-transfer-orchestration-runtime-pg.test.ts
          git commit -m "fix(pg): preserve orchestration status compatibility"
          git push origin HEAD:feat/pg-note-transfer-orchestration-20260805
