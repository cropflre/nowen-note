name: PostgreSQL Main Conflict Audit

on:
  push:
    branches: [pg-migration-unified]
    paths:
      - ".github/pg-main-conflict-audit-trigger"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit merge conflicts
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          {
            echo "main=$(git rev-parse origin/main)"
            echo "branch_before=$(git rev-parse HEAD)"
            echo "merge_status=$merge_status"
            echo "conflicts:"
            git diff --name-only --diff-filter=U | sort
          } > .github/pg-main-conflict-audit-report.txt
          if [ -f .git/MERGE_HEAD ]; then
            git merge --abort
          fi

      - name: Commit audit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/pg-main-conflict-audit-report.txt
          git commit -m "chore(sync): record latest main conflicts"
          git push origin HEAD:pg-migration-unified
