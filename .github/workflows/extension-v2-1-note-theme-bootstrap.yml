name: Extension V2.1 Note Theme Bootstrap

on:
  push:
    branches:
      - release/v1.5.0
    paths:
      - ".github/workflows/extension-v2-1-note-theme-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Harmonize Note Theme contract
        run: python3 scripts/_tmp_note_theme_harmonize.py
      - name: Generate extension contract artifacts
        run: node scripts/generate-plugin-host-api.mjs
      - name: Verify generator is clean
        run: node scripts/generate-plugin-host-api.mjs --check
      - name: Commit generated contract
        run: |
          git config user.name "Drug"
          git config user.email "cropflre2333@gmail.com"
          git add backend/src/plugins/types.ts backend/src/plugins/manifest.ts frontend/src/lib/pluginApi.ts
          git add backend/src/plugins/hostApiContract.generated.ts backend/src/plugins/capabilityCatalog.generated.ts
          git add packages/nowen-plugin-sdk/src/hostApi.generated.ts packages/nowen-plugin-sdk/src/contributions.generated.ts
          git add packages/nowen-plugin-sdk/src/errors.generated.ts packages/nowen-plugin-sdk/src/mock.generated.ts
          git add packages/nowen-plugin-sdk/capability-catalog.json docs/plugin-platform/host-api.generated.md docs/plugin-platform/contributions.generated.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(extensions): 对齐笔记主题引擎合同"
          git push origin HEAD:release/v1.5.0
