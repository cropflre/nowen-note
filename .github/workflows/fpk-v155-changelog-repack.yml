name: FPK v1.5.5 Changelog Hotfix
run-name: Build fnOS v1.5.5 changelog-corrected package

on:
  push:
    branches: [release/v1.5.5]
    paths:
      - '.github/workflows/fpk-v155-changelog-repack.yml'

permissions:
  contents: read

concurrency:
  group: fpk-v155-changelog-r1
  cancel-in-progress: false

jobs:
  build-fpk-hotfix:
    if: >-
      github.repository == 'cropflre/nowen-note' &&
      github.ref == 'refs/heads/release/v1.5.5' &&
      github.event.head_commit.message == 'ci(fpk): build published v1.5.5 changelog hotfix'
    environment: release-docker
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      IMAGE_REF: cropflre/nowen-note:v1.5.5-fpk-r1
      FPK_FILE: nowen-note-1.5.5-fpk-r1.fpk
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Guard original published Release, source, and curated changelog
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(node -p "require('./package.json').version")" = '1.5.5'
          test "$(node -p "require('./backend/package.json').version")" = '1.5.5'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --test scripts/tests/in-app-changelog.test.mjs scripts/tests/fpk-hotfix-contract.test.mjs
          node scripts/verify-in-app-changelog.mjs
          release="$(gh api repos/cropflre/nowen-note/releases/tags/v1.5.5)"
          test "$(jq -r '.id' <<< "$release")" = '438836675'
          test "$(jq -r '.draft' <<< "$release")" = 'false'
          test "$(jq -r '.prerelease' <<< "$release")" = 'false'
          test "$(jq -r '.target_commitish' <<< "$release")" = '41177ba40f56eecaddb03d7b2f2b30d8ceb4c9ee'
          test "$(jq -r '.assets[] | select(.name == "nowen-note-1.5.5.fpk") | .digest' <<< "$release")" = 'sha256:22877e1079700f6a41d0dd45dc51c525c1f11ef9714253381853eddd937afeff'
      - name: Generate pinned official registry trust roots
        env:
          NOWEN_OFFICIAL_REGISTRY_TRUST_ROOTS_JSON: ${{ vars.NOWEN_OFFICIAL_REGISTRY_TRUST_ROOTS_JSON }}
        run: node scripts/release-cloud-ci.mjs prepare
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Check immutable Docker hotfix tag and build only if absent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          status="$(curl -sS --retry 3 --retry-all-errors --connect-timeout 15 --max-time 45 -o "$RUNNER_TEMP/dockerhub-tag.json" -w '%{http_code}' \
            'https://hub.docker.com/v2/repositories/cropflre/nowen-note/tags/v1.5.5-fpk-r1/')"
          if [ "$status" = '200' ]; then
            docker pull "$IMAGE_REF"
          elif [ "$status" = '404' ]; then
            docker buildx build --platform linux/amd64 --load \
              --secret id=github_token,env=GH_TOKEN \
              --build-arg APP_VERSION=1.5.5 \
              --build-arg VCS_REF="$GITHUB_SHA" \
              --tag "$IMAGE_REF" .
          else
            echo "Docker Hub lookup failed with HTTP $status; refusing to replace or guess a tag" >&2
            exit 1
          fi
          test "$(docker image inspect "$IMAGE_REF" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = '1.5.5'
          test "$(docker image inspect "$IMAGE_REF" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          test "$(docker image inspect "$IMAGE_REF" --format '{{.Architecture}}')" = 'amd64'
          docker run --rm --entrypoint node "$IMAGE_REF" -e '
            const fs=require("fs");
            const p="/app/frontend/dist/changelog.json";
            const a=JSON.parse(fs.readFileSync(p,"utf8"));
            const v=a.entries.map(e=>e.version);
            if(v[0]!=="1.5.5"||v[1]!=="1.5.4"||v[2]!=="1.5.3"||!a.entries[0].body.includes("双向同步")) throw Error("Docker runtime still contains stale in-app changelog: "+v.join(","));
            if(require("/app/package.json").version!=="1.5.5") throw Error("Runtime version mismatch");
            console.log("[FPK] container v1.5.5 has reviewed 1.5.5 / 1.5.4 / 1.5.3 notes");
          '
          if [ "$status" = '404' ]; then
            docker push "$IMAGE_REF"
          fi
          docker buildx imagetools inspect "$IMAGE_REF" > "$RUNNER_TEMP/published-image.txt"
          echo "Hotfix image verified: $IMAGE_REF (${GITHUB_SHA})" >> "$GITHUB_STEP_SUMMARY"
      - name: Download version-pinned fnpack and build fnOS package
        env:
          FNPACK_URL: ${{ vars.FNPACK_URL }}
          FNPACK_SHA256: ${{ vars.FNPACK_SHA256 }}
          DOCKERHUB_REPO: cropflre/nowen-note
          FPK_VERSION: '1.5.5'
          FPK_IMAGE_TAG: v1.5.5-fpk-r1
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$FNPACK_URL" != '' && [[ "$FNPACK_URL" == https://* ]]
          [[ "$FNPACK_SHA256" =~ ^[0-9a-f]{64}$ ]]
          curl -fL --retry 5 --retry-all-errors --connect-timeout 15 --max-time 180 "$FNPACK_URL" -o "$RUNNER_TEMP/fnpack"
          echo "$FNPACK_SHA256  $RUNNER_TEMP/fnpack" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/fnpack"
          npm ci --no-audit --no-fund
          FNPACK_BIN="$RUNNER_TEMP/fnpack" node scripts/fpk/build-fpk.mjs
          test -f dist-fpk/nowen-note-1.5.5.fpk
          test -f dist-fpk/nowen-note-1.5.5/manifest
          test -f dist-fpk/nowen-note-1.5.5/app/docker/docker-compose.yaml
          grep -Eq '^version[[:space:]]+=[[:space:]]+1\.5\.5$' dist-fpk/nowen-note-1.5.5/manifest
          grep -Fq '修复应用内更新日志' dist-fpk/nowen-note-1.5.5/manifest
          grep -Fq 'cropflre/nowen-note:v1.5.5-fpk-r1' dist-fpk/nowen-note-1.5.5/app/docker/docker-compose.yaml
          mkdir -p fpk-hotfix-artifacts
          cp dist-fpk/nowen-note-1.5.5.fpk "fpk-hotfix-artifacts/$FPK_FILE"
          cd fpk-hotfix-artifacts
          sha256sum "$FPK_FILE" > "$FPK_FILE.sha256"
          jq -n --arg sha "$GITHUB_SHA" --arg image "$IMAGE_REF" --arg name "$FPK_FILE" \
            '{source_sha:$sha, image:$image, asset_name:$name, release:"v1.5.5", app_version:"1.5.5", architecture:"amd64", purpose:"in-app-changelog-hotfix"}' > metadata.json
          cat "$FPK_FILE.sha256" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: fpk-v1.5.5-changelog-r1
          path: fpk-hotfix-artifacts/*
          if-no-files-found: error
          retention-days: 30

  publish-fpk-hotfix:
    needs: build-fpk-hotfix
    if: needs.build-fpk-hotfix.result == 'success'
    environment: release-github
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FPK_FILE: nowen-note-1.5.5-fpk-r1.fpk
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fpk-v1.5.5-changelog-r1
          path: fpk-hotfix-artifacts
      - name: Verify artifact provenance and upload revision without replacing originals
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd fpk-hotfix-artifacts
          sha256sum -c "$FPK_FILE.sha256"
          test "$(jq -r .source_sha metadata.json)" = "$GITHUB_SHA"
          test "$(jq -r .image metadata.json)" = 'cropflre/nowen-note:v1.5.5-fpk-r1'
          test "$(jq -r .asset_name metadata.json)" = "$FPK_FILE"
          release="$(gh api repos/cropflre/nowen-note/releases/tags/v1.5.5)"
          test "$(jq -r .id <<< "$release")" = '438836675'
          test "$(jq -r .draft <<< "$release")" = false
          test "$(jq -r .prerelease <<< "$release")" = false
          test "$(jq -r .target_commitish <<< "$release")" = '41177ba40f56eecaddb03d7b2f2b30d8ceb4c9ee'
          test "$(jq -r '.assets[] | select(.name=="nowen-note-1.5.5.fpk") | .digest' <<< "$release")" = 'sha256:22877e1079700f6a41d0dd45dc51c525c1f11ef9714253381853eddd937afeff'
          expected="sha256:$(cut -d ' ' -f1 "$FPK_FILE.sha256")"
          existing="$(jq -r --arg name "$FPK_FILE" '.assets[] | select(.name==$name) | .digest' <<< "$release")"
          if [ -n "$existing" ]; then
            test "$existing" = "$expected" || { echo 'Different asset already exists; refusing overwrite' >&2; exit 1; }
          else
            gh release upload v1.5.5 "$FPK_FILE" --repo cropflre/nowen-note
          fi
          updated="$(gh api repos/cropflre/nowen-note/releases/tags/v1.5.5)"
          test "$(jq -r --arg name "$FPK_FILE" '.assets[] | select(.name==$name) | .digest' <<< "$updated")" = "$expected"
          test "$(jq -r '.assets[] | select(.name=="nowen-note-1.5.5.fpk") | .digest' <<< "$updated")" = 'sha256:22877e1079700f6a41d0dd45dc51c525c1f11ef9714253381853eddd937afeff'
          marker='## 飞牛 FPK 更新日志修订包（v1.5.5-fpk-r1）'
          body="$(jq -r '.body' <<< "$updated")"
          if [[ "$body" != *"$marker"* ]]; then
            test "$(head -n1 <<< "$body")" = '<!-- nowen-cloud:42576386477:1:41177ba40f56eecaddb03d7b2f2b30d8ceb4c9ee -->'
            {
              printf '%s\n\n' "$body"
              printf '%s\n' "$marker"
              printf '\n- **修复**：飞牛版应用内「更新日志」补齐 v1.5.5、v1.5.4，精简 v1.5.3 英文提交记录。\n'
              printf '%s\n' '- **新版 FPK**：`nowen-note-1.5.5-fpk-r1.fpk`，镜像 `cropflre/nowen-note:v1.5.5-fpk-r1`（仅 fnOS x86_64）。'
              printf '%s\n' '- **保留原版**：旧 `nowen-note-1.5.5.fpk` 与正式 Docker `v1.5.5` 不变，修订包需要手动选择下载。'
              printf '%s\n' '- **升级提示**：升级前备份数据库、附件与部署配置；镜像回退不会回滚数据库。fnOS 对同版本覆盖安装的处理以应用中心支持为准。'
              printf '\n- 修订来源：`%s`；并未重新发布其他平台安装包。\n' "$GITHUB_SHA"
            } > "$RUNNER_TEMP/release-notes.md"
            gh release edit v1.5.5 --repo cropflre/nowen-note --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          final="$(gh api repos/cropflre/nowen-note/releases/tags/v1.5.5)"
          test "$(jq -r '.draft' <<< "$final")" = false
          test "$(jq -r '.prerelease' <<< "$final")" = false
          test "$(jq -r --arg name "$FPK_FILE" '.assets[] | select(.name==$name) | .digest' <<< "$final")" = "$expected"
          echo "FPK hotfix published: https://github.com/cropflre/nowen-note/releases/download/v1.5.5/$FPK_FILE" >> "$GITHUB_STEP_SUMMARY"
