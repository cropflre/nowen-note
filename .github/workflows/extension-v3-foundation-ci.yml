name: Extension Platform V3 Foundation

on:
  push:
    branches: ["release/v1.5.3"]
    paths:
      - "backend/src/plugins/**"
      - "backend/src/db/pluginRetainedStorageMigration.ts"
      - "backend/src/db/nowenStudioMigration.ts"
      - "backend/src/db/nowenStudioHistoryMigration.ts"
      - "backend/tests/personal-studio-ai.test.ts"
      - "backend/tests/personal-studio-provider-contract.test.ts"
      - "backend/tests/personal-studio-backup-restore.test.ts"
      - "backend/tests/personal-studio-apps.test.ts"
      - "backend/src/routes/plugins.ts"
      - "backend/src/index.ts"
      - "backend/tests/application-v3-*.ts"
      - "frontend/src/**"
      - "frontend/e2e/plugin-apps.spec.ts"
      - "frontend/e2e/plugin-inspectors.spec.ts"
      - "frontend/playwright.plugin-apps.config.ts"
      - "packages/nowen-plugin-*/**"
      - "examples/plugins/hello-nowen-app/**"
      - "examples/plugins/personal-dashboard/**"
      - "examples/plugins/resource-inspector/**"
      - "package*.json"
      - "backend/package*.json"
      - ".github/workflows/extension-v3-foundation-ci.yml"
  pull_request:
    paths:
      - "backend/src/plugins/applicationV3.ts"
      - "backend/src/plugins/manifest.ts"
      - "backend/src/plugins/types.ts"
      - "backend/src/plugins/packageValidator.ts"
      - "backend/src/plugins/packageInstaller.ts"
      - "backend/src/plugins/extensionCompatibility.ts"
      - "backend/src/plugins/pluginService.ts"
      - "backend/src/plugins/registry.ts"
      - "backend/src/plugins/pluginLifecycle.ts"
      - "backend/src/plugins/permissions.ts"
      - "backend/src/routes/plugins.ts"
      - "backend/src/index.ts"
      - "electron/main.js"
      - "backend/src/plugins/appBridgeV3.ts"
      - "backend/src/plugins/appDocumentV3.ts"
      - "backend/src/plugins/appRuntimeV3.ts"
      - "backend/src/plugins/dashboardV3.ts"
      - "backend/src/plugins/pluginDataV3.ts"
      - "backend/src/db/pluginRetainedStorageMigration.ts"
      - "backend/src/plugins/hostApiBroker.ts"
      - "backend/src/plugins/personalStudioAI.ts"
      - "backend/src/plugins/personalStudioHistory.ts"
      - "backend/tests/personal-studio-provider-contract.test.ts"
      - "backend/tests/personal-studio-backup-restore.test.ts"
      - "backend/tests/application-v3-foundation.test.ts"
      - "backend/tests/application-v3-*.ts"
      - "frontend/src/components/PluginApps.tsx"
      - "frontend/src/components/PluginManagementPanel.tsx"
      - "frontend/src/components/__tests__/SettingsModalSiteIdentity.test.tsx"
      - "frontend/src/components/settings/plugins/**"
      - "frontend/src/components/PluginDashboard.tsx"
      - "frontend/src/components/PluginDataActions.tsx"
      - "frontend/src/components/PluginInspector.tsx"
      - "frontend/src/components/EditorPane.tsx"
      - "frontend/src/components/tasks/TaskDetailPanel.tsx"
      - "frontend/src/components/attachmentDetail/AttachmentDetailDrawer.tsx"
      - "backend/src/plugins/inspectorV3.ts"
      - "frontend/src/lib/__tests__/pluginInspector.test.tsx"
      - "frontend/src/lib/__tests__/pluginManagement.test.tsx"
      - "frontend/e2e/plugin-inspectors.spec.ts"
      - "frontend/src/components/NavRail.tsx"
      - "frontend/src/components/SettingsModal.tsx"
      - "frontend/src/components/settings/plugins/PluginSettingsTab.tsx"
      - "frontend/src/App.tsx"
      - "frontend/src/hooks/usePluginApps.ts"
      - "frontend/src/lib/pluginApp*.ts"
      - "frontend/src/lib/pluginApi.ts"
      - "frontend/src/lib/serverUrl.ts"
      - "frontend/src/lib/pluginRuntimePresentation.ts"
      - "frontend/src/lib/__tests__/pluginApps.test.ts"
      - "frontend/src/lib/__tests__/pluginDashboard.test.ts"
      - "frontend/src/lib/__tests__/pluginRuntimePresentation.test.ts"
      - "frontend/src/lib/__tests__/appPathNavigation.test.ts"
      - "frontend/src/i18n/pluginAppTranslations.ts"
      - "frontend/e2e/plugin-apps.spec.ts"
      - "frontend/playwright.plugin-apps.config.ts"
      - "packages/nowen-plugin-cli/**"
      - "packages/nowen-plugin-sdk/**"
      - "examples/plugins/hello-nowen-app/**"
      - "examples/plugins/personal-dashboard/**"
      - "examples/plugins/resource-inspector/**"
      - "docs/plugin-platform/extension-platform-v3-phase0.md"
      - "docs/plugin-platform/extension-platform-v3-app-runtime.md"
      - ".github/workflows/extension-v3-foundation-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: V3 foundation tests
        working-directory: backend
        run: node --import tsx --import ./tests/setup-db-isolation.ts --test tests/application-v3-foundation.test.ts
      - name: V3 1.5.3 runtime and isolation contracts
        working-directory: backend
        run: |
          node --import tsx --import ./tests/setup-db-isolation.ts --test tests/application-v3-runtime.test.ts
          node --import tsx --import ./tests/setup-db-isolation.ts --test tests/application-v3-dashboard-data.test.ts
          node --import tsx --import ./tests/setup-db-isolation.ts --test tests/application-v3-inspector.test.ts
          node --import tsx --import ./tests/setup-db-isolation.ts --test tests/personal-studio-apps.test.ts
          node --import tsx --import ./tests/setup-db-isolation.ts --test tests/personal-studio-ai.test.ts
          node --import tsx --import ./tests/setup-db-isolation.ts --test tests/personal-studio-provider-contract.test.ts
          node --import tsx --import ./tests/setup-db-isolation.ts --test tests/personal-studio-backup-restore.test.ts
      - name: V2.1 compatibility regression
        working-directory: backend
        run: node --import tsx --import ./tests/setup-db-isolation.ts --test tests/extension-v2-1-feature-gates.test.ts tests/ui-contribution.test.ts
      - name: Typecheck
        working-directory: backend
        run: npm run build:tsc

  browser-app-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            packages/nowen-plugin-cli/package-lock.json
      - run: npm ci --prefer-offline || (sleep 5 && npm ci --prefer-offline) || (sleep 10 && npm ci --prefer-offline)
        working-directory: backend
      - run: npm ci --prefer-offline || (sleep 5 && npm ci --prefer-offline) || (sleep 10 && npm ci --prefer-offline)
        working-directory: frontend
      - run: npm ci --prefer-offline || (sleep 5 && npm ci --prefer-offline) || (sleep 10 && npm ci --prefer-offline)
        working-directory: packages/nowen-plugin-cli
      - name: Build SDK and verify existing contracts
        run: |
          node frontend/node_modules/typescript/bin/tsc -p packages/nowen-plugin-sdk/tsconfig.json
          node packages/nowen-plugin-sdk/tests/generated-contract.test.mjs
      - name: Pack the example with the existing CLI
        working-directory: examples/plugins/hello-nowen-app
        run: node ../../../packages/nowen-plugin-cli/bin/nowen-plugin.mjs pack
      - name: Pack Personal Dashboard
        working-directory: examples/plugins/personal-dashboard
        run: node ../../../packages/nowen-plugin-cli/bin/nowen-plugin.mjs pack
      - name: Pack Resource Inspector
        working-directory: examples/plugins/resource-inspector
        run: node ../../../packages/nowen-plugin-cli/bin/nowen-plugin.mjs pack
      - name: Navigation and MessageChannel contracts
        working-directory: frontend
        run: npx vitest run src/lib/__tests__/pluginManagement.test.tsx src/components/__tests__/SettingsModalSiteIdentity.test.tsx src/lib/__tests__/pluginInspector.test.tsx src/lib/__tests__/pluginDataActions.test.tsx src/lib/__tests__/pluginApps.test.ts src/lib/__tests__/pluginDashboard.test.ts src/lib/__tests__/personalApps.test.ts src/lib/__tests__/appPathNavigation.test.ts src/lib/__tests__/serverUrl.test.ts src/lib/__tests__/pluginRuntimePresentation.test.ts src/i18n/__tests__/releaseI18nCoverage.test.ts
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: 1.5.3 host browser acceptance
        working-directory: frontend
        run: npx playwright test --config playwright.plugin-apps.config.ts --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-app-browser-evidence
          path: frontend/node_modules/.cache/plugin-app-results
