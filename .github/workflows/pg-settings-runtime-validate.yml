name: Validate PostgreSQL settings runtime

on:
  push:
    branches: [pg-validation-runtime-batch]
    paths:
      - ".github/workflows/pg-settings-runtime-validate.yml"

permissions:
  contents: write

jobs:
  settings:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nowen
          POSTGRES_PASSWORD: nowen_ci_password
          POSTGRES_DB: nowen_note_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nowen -d nowen_note_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_PG_DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test
      DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test
      DB_DRIVER: postgres
      JWT_SECRET: pg-settings-runtime-test-secret-please-change
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pg-migration-unified
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: TypeScript before mount
        working-directory: backend
        run: npm run build:tsc -- --noEmit
      - name: Real PostgreSQL settings lifecycle
        working-directory: backend
        run: node --import tsx --test --test-concurrency=1 tests/settings-runtime-pg.test.ts
      - name: Mount validated settings runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("backend/src/index.postgres-runtime.ts")
          text = path.read_text()

          import_marker = 'import createAuthRuntimeRouter from "./routes/auth-runtime";\n'
          import_line = 'import createSettingsRuntimeRouter from "./routes/settings-runtime";\n'
          if import_line not in text:
              if import_marker not in text:
                  raise SystemExit("auth runtime import marker missing")
              text = text.replace(import_marker, import_marker + import_line, 1)

          route_marker = 'app.route("/api/auth", createAuthRuntimeRouter(adapter));\n\n'
          route_line = 'app.route("/api/settings", createSettingsRuntimeRouter(adapter));\n\n'
          if route_line not in text:
              if route_marker not in text:
                  raise SystemExit("auth route marker missing")
              text = text.replace(route_marker, route_marker + route_line, 1)

          migrated_marker = '        "DELETE /api/auth/sessions",\n'
          migrated_lines = migrated_marker + '        "GET /api/settings (public site bootstrap)",\n        "PUT /api/settings (authenticated; admin guard for system settings)",\n'
          if '"GET /api/settings (public site bootstrap)"' not in text:
              if migrated_marker not in text:
                  raise SystemExit("auth migrated route marker missing")
              text = text.replace(migrated_marker, migrated_lines, 1)

          path.write_text(text)
          PY
      - name: TypeScript after mount
        working-directory: backend
        run: npm run build:tsc -- --noEmit
      - name: Auth and settings regression
        working-directory: backend
        run: |
          node --import tsx --test --test-concurrency=1 tests/auth-runtime-pg.test.ts
          node --import tsx --test --test-concurrency=1 tests/settings-runtime-pg.test.ts
      - name: Build production bundle
        working-directory: backend
        run: npm run build
      - name: Commit validated settings mount
        shell: bash
        run: |
          if git diff --quiet -- backend/src/index.postgres-runtime.ts; then
            echo "settings runtime already mounted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/index.postgres-runtime.ts
          git commit -m "feat(pg): mount PostgreSQL settings runtime"
          git push origin HEAD:pg-migration-unified
