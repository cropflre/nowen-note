name: Issue 693 Single Note Image Export CI

on:
  push:
    branches:
      - main
      - release/v1.4.6
    paths:
      - "frontend/src/lib/exportService.ts"
      - "frontend/src/lib/exportServiceCore.ts"
      - "frontend/src/lib/contentFormat.ts"
      - "frontend/src/lib/__tests__/exportSingleNoteImageFallback.test.ts"
      - "frontend/src/lib/__tests__/exportServiceSingleMarkdown.test.ts"
      - "frontend/src/lib/__tests__/exportService.test.ts"
      - ".github/workflows/issue-693-single-note-image-export-ci.yml"
  pull_request:
    paths:
      - "frontend/src/lib/exportService.ts"
      - "frontend/src/lib/exportServiceCore.ts"
      - "frontend/src/lib/contentFormat.ts"
      - "frontend/src/lib/__tests__/exportSingleNoteImageFallback.test.ts"
      - "frontend/src/lib/__tests__/exportServiceSingleMarkdown.test.ts"
      - "frontend/src/lib/__tests__/exportService.test.ts"
      - ".github/workflows/issue-693-single-note-image-export-ci.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Single note image Markdown export regressions
        run: npm run test:run -- src/lib/__tests__/exportSingleNoteImageFallback.test.ts src/lib/__tests__/exportServiceSingleMarkdown.test.ts src/lib/__tests__/exportService.test.ts
      - name: TypeScript
        run: npx tsc -b
