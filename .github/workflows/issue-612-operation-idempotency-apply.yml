name: Apply Issue 612 operation idempotency

on:
  pull_request:
    paths:
      - ".github/workflows/issue-612-operation-idempotency-apply.yml"
      - ".github/scripts/issue612_operation_idempotency_patch.py"

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.pull_request.head.ref == 'fix/issue-612-data-protection' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Apply operation idempotency patch
        run: python .github/scripts/issue612_operation_idempotency_patch.py
      - name: Persist the initial Yjs seed baseline
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/src/services/yjs.ts")
          text = path.read_text(encoding="utf-8")

          initial_old = '''      if (seed) {
                const ytext = doc.getText("content");
                ytext.insert(0, seed);
              }
          '''
          initial_new = '''      if (seed) {
                const ytext = doc.getText("content");
                ytext.insert(0, seed);
                // The first client diff is causally based on these exact Yjs structs.
                // Persist them before any client can edit; otherwise a restart can replay
                // the incremental update without its seed and fall back to stale notes.content.
                noteYsnapshotsRepository.upsert(
                  noteId,
                  Buffer.from(Y.encodeStateAsUpdate(doc)),
                  0,
                );
              }
          '''
          if text.count(initial_old) != 1:
              raise SystemExit(f"initial seed block matches: {text.count(initial_old)}")
          text = text.replace(initial_old, initial_new, 1)

          fallback_old = '''        if (seed) {
                    ytext.insert(0, seed);
                    console.log(`[yjs] fallback-seeded empty yText for note ${noteId} (len=${seed.length})`);
                  }
          '''
          fallback_new = '''        if (seed) {
                    ytext.insert(0, seed);
                    // Freeze the repaired baseline so every later update can replay after
                    // room eviction or process restart. Preserve the existing snapshot watermark.
                    noteYsnapshotsRepository.upsert(
                      noteId,
                      Buffer.from(Y.encodeStateAsUpdate(doc)),
                      snap?.updatesMergedTo || 0,
                    );
                    console.log(`[yjs] fallback-seeded empty yText for note ${noteId} (len=${seed.length})`);
                  }
          '''
          if text.count(fallback_old) != 1:
              raise SystemExit(f"fallback seed block matches: {text.count(fallback_old)}")
          path.write_text(text.replace(fallback_old, fallback_new, 1), encoding="utf-8")
          PY
      - name: Keep async repository methods adapter-compatible
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("backend/src/repositories/noteYupdatesRepository.ts")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r"  async deleteByNoteIdAsync\(noteId: string\): Promise<void> \{.*?"
              r"  async transferOwnershipAsync\(fromUserId: string, toUserId: string\): Promise<number> \{.*?"
              r"  \},\n",
              re.DOTALL,
          )
          replacement = "\n".join([
              "  async deleteByNoteIdAsync(noteId: string): Promise<void> {",
              "    await getAdapter().executeStatements([",
              "      { sql: \"DELETE FROM note_yupdates WHERE noteId = ?\", params: [noteId] },",
              "      { sql: \"DELETE FROM yjs_operation_receipts WHERE noteId = ?\", params: [noteId] },",
              "    ]);",
              "  },",
              "",
              "  async transferOwnershipAsync(fromUserId: string, toUserId: string): Promise<number> {",
              "    const adapter = getAdapter();",
              "    const result = await adapter.execute(",
              "      \"UPDATE note_yupdates SET userId = ? WHERE userId = ?\",",
              "      [toUserId, fromUserId],",
              "    );",
              "    await adapter.execute(",
              "      \"UPDATE yjs_operation_receipts SET userId = ? WHERE userId = ?\",",
              "      [toUserId, fromUserId],",
              "    );",
              "    return result.changes;",
              "  },",
              "",
          ])
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"generated repository async block matches: {count}")
          path.write_text(text, encoding="utf-8")
          PY
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Run Yjs durability and repository regressions
        working-directory: backend
        run: |
          node --import tsx --import ./tests/setup-db-isolation.ts --test tests/yjs-durability.test.ts
          node --import tsx --import ./tests/setup-db-isolation.ts --test tests/note-yupdates-repository-async.test.ts
      - name: Backend typecheck
        working-directory: backend
        run: npm run build:tsc
      - name: Commit verified backend patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/db/migrations.ts \
            backend/src/db/schema.ts \
            backend/src/db/postgres/schema.base.sql \
            backend/src/db/yjsOperationReceiptsMigration.ts \
            backend/src/repositories/noteYupdatesRepository.ts \
            backend/src/services/yjs.ts \
            backend/src/services/yjsDurability.ts \
            backend/src/services/realtime.ts \
            backend/tests/yjs-durability.test.ts
          git commit -m "fix(sync): persist Yjs baselines and idempotent ACK receipts (#612)"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
