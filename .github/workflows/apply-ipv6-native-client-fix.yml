name: Apply IPv6 native client fix

on:
  push:
    branches:
      - fix/ipv6-native-client-connection
    paths:
      - .github/workflows/apply-ipv6-native-client-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ipv6-native-client-connection
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply IPv6 fixes
        run: python3 scripts/apply-ipv6-native-client-fix.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run IPv6 and native HTTP regression tests
        working-directory: frontend
        run: npm run test:run -- src/lib/__tests__/serverUrl.test.ts src/lib/__tests__/apiNativeHttpFallback.test.ts
      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc -b
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m "fix(client): support IPv6 NAS server addresses"
          git push origin HEAD:fix/ipv6-native-client-connection
