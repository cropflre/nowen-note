name: Android Immersive Editor CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/components/EditorPane.tsx'
      - 'frontend/src/components/TiptapEditor.tsx'
      - 'frontend/src/components/MarkdownEditorImpl.tsx'
      - 'frontend/src/components/PublicSpaceLauncher.tsx'
      - 'frontend/src/hooks/useKeyboardVisible.ts'
      - 'frontend/src/lib/__tests__/androidImmersiveEditorContract.test.ts'
      - '.github/workflows/android-immersive-editor-ci.yml'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --silent
      - name: Android immersive editor contract
        working-directory: frontend
        run: npx vitest run --reporter=basic src/lib/__tests__/androidImmersiveEditorContract.test.ts
      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc -b
