# Sync GitHub Release → Gitee Release（仅小文件，国内加速兜底）
#
# 触发：人工发布 Release 时由 release 事件触发；统一发布流程通过 workflow_call 显式调用，
#       避免 GitHub Actions 使用 GITHUB_TOKEN 发布 Release 时被 GitHub 的事件抑制规则跳过。
# 目的：同步 Gitee Release 元数据，以及不超过 95MB 的可分发附件。
#       让国内用户在 GitHub 直连慢、ghproxy 公共代理挂掉时仍有可用下载渠道。
#
# 不同步的内容（故意排除）：
#   - .upk / .dmg / .AppImage / .rpm 等大文件：Gitee 单文件上限约 100MB，
#     超过 95MB 的文件会跳过；APK/AAB/FPK 等小文件允许同步。
#   - blockmap / yml / latest*.yml：electron-builder 的更新元数据，对终端用户无意义。
#
# 失败处理：GitHub Release 发布成功后才执行 Gitee 镜像；镜像失败会明确标红并可重跑，
#          不会回滚已经发布的 GitHub Release。
#
# 必需的 Repository Secrets：
#   GITEE_TOKEN  — Gitee 个人访问令牌（projects + user_info 权限）
#   GITEE_OWNER  — Gitee 用户名（如 cropflre）
#   GITEE_REPO   — Gitee 仓库名（如 nowen-note）

name: Sync Release to Gitee

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: '要同步的 tag（如 v1.5.5），留空则用最新 release'
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: GitHub Release tag to mirror
        required: true
        type: string

# 同一个 tag 只允许一个同步任务在跑，避免重入打架
concurrency:
  group: gitee-sync-${{ inputs.tag || github.event.release.tag_name || github.event.inputs.tag || 'latest' }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 没配 GITEE_TOKEN 时不跑，避免 fork / 新仓库报错
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || github.event.release.draft == false }}
    permissions:
      contents: read
    steps:
      - name: Resolve target tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ inputs.tag || github.event.release.tag_name || github.event.inputs.tag || '' }}
        run: |
          set -euo pipefail
          if [ -n "$TARGET_TAG" ]; then
            TAG="$TARGET_TAG"
          else
            TAG=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "[sync] target tag = $TAG"

      - name: Check Gitee secrets
        id: check
        run: |
          if [ -z "${{ secrets.GITEE_TOKEN }}" ] || [ -z "${{ secrets.GITEE_OWNER }}" ] || [ -z "${{ secrets.GITEE_REPO }}" ]; then
            echo "[sync] Gitee secrets 未配置（GITEE_TOKEN/GITEE_OWNER/GITEE_REPO），跳过同步"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release assets from GitHub
        if: steps.check.outputs.skip == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p assets
          # 只下载白名单后缀；--clobber 允许重跑覆盖
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --dir assets \
            --pattern '*.exe' \
            --pattern '*.apk' \
            --pattern '*.zip' \
            --pattern '*.deb' \
            --pattern '*.aab' \
            --pattern '*.fpk' \
            --clobber || true
          echo "[sync] downloaded files:"
          ls -lh assets/ || true

      - name: Filter assets by size (≤ 95MB)
        if: steps.check.outputs.skip == '0'
        id: filter
        run: |
          set -euo pipefail
          mkdir -p upload
          # Gitee 实测上限 100MB，留 5MB 缓冲；超限的直接跳过
          MAX_BYTES=$((95 * 1024 * 1024))
          shopt -s nullglob
          for f in assets/*; do
            # 排除一些 electron-builder 的元数据文件
            base=$(basename "$f")
            case "$base" in
              *.blockmap|latest*.yml|*.yml) continue ;;
            esac
            size=$(stat -c%s "$f")
            if [ "$size" -gt "$MAX_BYTES" ]; then
              echo "[sync] skip oversized: $base ($(numfmt --to=iec $size) > 95MB)"
              continue
            fi
            cp "$f" "upload/$base"
            echo "[sync] keep: $base ($(numfmt --to=iec $size))"
          done
          count=$(ls upload/ 2>/dev/null | wc -l || echo 0)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "[sync] $count file(s) ready for Gitee upload"

      - name: Wait for Gitee mirror tag
        if: steps.check.outputs.skip == '0'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Gitee's Pull mirror may update a few minutes after GitHub creates the tag.
          # Never create a Gitee Release against main as a fallback before the exact tag arrives.
          for attempt in $(seq 1 12); do
            resp=$(curl -sS -w "\\n%{http_code}" \
              "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/tags?access_token=$GITEE_TOKEN&per_page=100&page=1")
            body=$(echo "$resp" | sed '$d')
            code=$(echo "$resp" | tail -n 1)
            if [ "$code" != "200" ]; then
              echo "[gitee] list tags failed: HTTP $code"
              echo "$body"
              exit 1
            fi
            if printf '%s' "$body" | jq -e --arg tag "$TAG" 'any(.[]?; .name == $tag)' >/dev/null; then
              echo "[gitee] tag $TAG is mirrored"
              exit 0
            fi
            echo "[gitee] waiting for mirror tag $TAG ($attempt/12)"
            sleep 30
          done
          echo "[gitee] tag $TAG did not appear in Gitee after 6 minutes; refusing to create a Release on the wrong commit"
          exit 1

      - name: Ensure Gitee release exists
        # Release metadata must be mirrored even when every binary exceeds Gitee's attachment limit.
        if: steps.check.outputs.skip == '0'
        id: gitee_release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          API="https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/releases/tags/$TAG"
          resp=$(curl -sS -w "\n%{http_code}" -H "Content-Type: application/json" \
            "$API?access_token=$GITEE_TOKEN")
          body=$(echo "$resp" | sed '$d')
          code=$(echo "$resp" | tail -n 1)

          # Gitee may return HTTP 200 with an empty JSON array when this tag has no Release.
          # Do not treat HTTP 200 alone as proof that a Release exists.
          ID=""
          if [ "$code" = "200" ]; then
            ID=$(printf '%s' "$body" | jq -r --arg tag "$TAG" '
              if type == "object" then (.id // empty)
              elif type == "array" then (map(select(.tag_name == $tag)) | first | .id // empty)
              else empty end
            ' 2>/dev/null || true)
          elif [ "$code" != "404" ]; then
            echo "[gitee] lookup release failed: HTTP $code"
            echo "$body"
            exit 1
          fi

          if [[ "$ID" =~ ^[0-9]+$ ]]; then
            echo "[gitee] release exists, id=$ID"
          else
            echo "[gitee] release not found; creating $TAG"

            GH_RELEASE_JSON=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name,body,isPrerelease)
            RELEASE_NAME=$(jq -r --arg fallback "$TAG" '.name // $fallback' <<< "$GH_RELEASE_JSON")
            RELEASE_NOTES=$(jq -r '.body // ""' <<< "$GH_RELEASE_JSON")
            PRERELEASE=$(jq -r '.isPrerelease // false' <<< "$GH_RELEASE_JSON")
            RELEASE_BODY=$(printf '%s\n\n---\n此 Release 由 GitHub 自动同步至 Gitee。\nGitHub 原始版本：https://github.com/%s/releases/tag/%s' \
              "$RELEASE_NOTES" "$GITHUB_REPOSITORY" "$TAG")

            payload=$(jq -n \
              --arg tag "$TAG" \
              --arg name "$RELEASE_NAME" \
              --arg body "$RELEASE_BODY" \
              --arg target "main" \
              --argjson prerelease "$PRERELEASE" \
              '{tag_name:$tag, name:$name, body:$body, target_commitish:$target, prerelease:$prerelease}')

            RELEASE_API="https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/releases"
            CREATE_PAYLOAD=$(echo "$payload" | jq --arg t "$GITEE_TOKEN" '. + {access_token:$t}')

            # Gitee may reset the connection while processing a Release creation request.
            # A failed curl does not prove that the server did not create the Release.
            # After every ambiguous response, query by tag before retrying to avoid duplicates.
            for attempt in 1 2 3 4; do
              echo "[gitee] create release attempt $attempt/4"
              if create_resp=$(curl --http1.1 --connect-timeout 15 --max-time 40 -sS \
                -w "\\n%{http_code}" -X POST \
                -H "Content-Type: application/json" \
                -d "$CREATE_PAYLOAD" \
                "$RELEASE_API" 2>&1); then
                create_body=$(printf '%s' "$create_resp" | sed '$d')
                create_code=$(printf '%s' "$create_resp" | tail -n 1)
                if [ "$create_code" = "201" ] || [ "$create_code" = "200" ]; then
                  ID=$(printf '%s' "$create_body" | jq -r '.id // empty' 2>/dev/null || true)
                  if [[ "$ID" =~ ^[0-9]+$ ]]; then
                    echo "[gitee] release created, id=$ID"
                    break
                  fi
                  echo "[gitee] create returned HTTP $create_code but no valid release id"
                  echo "$create_body"
                else
                  echo "[gitee] create returned HTTP $create_code"
                  echo "$create_body"
                fi
              else
                echo "[gitee] create request transport error on attempt $attempt:"
                echo "$create_resp"
              fi

              # Recover an already-created Release if the POST response was lost.
              if lookup_resp=$(curl --http1.1 --connect-timeout 15 --max-time 25 -sS \
                -w "\\n%{http_code}" \
                "$API?access_token=$GITEE_TOKEN" 2>&1); then
                lookup_body=$(printf '%s' "$lookup_resp" | sed '$d')
                lookup_code=$(printf '%s' "$lookup_resp" | tail -n 1)
                if [ "$lookup_code" = "200" ]; then
                  ID=$(printf '%s' "$lookup_body" | jq -r --arg tag "$TAG" '
                    if type == "object" then (.id // empty)
                    elif type == "array" then (map(select(.tag_name == $tag)) | first | .id // empty)
                    else empty end
                  ' 2>/dev/null || true)
                  if [[ "$ID" =~ ^[0-9]+$ ]]; then
                    echo "[gitee] recovered existing release after ambiguous POST, id=$ID"
                    break
                  fi
                elif [ "$lookup_code" != "404" ]; then
                  echo "[gitee] post-create lookup returned HTTP $lookup_code"
                  echo "$lookup_body"
                fi
              else
                echo "[gitee] post-create lookup transport error:"
                echo "$lookup_resp"
              fi

              if [ "$attempt" -lt 4 ]; then
                sleep $((attempt * 5))
              fi
            done

            if ! [[ "$ID" =~ ^[0-9]+$ ]]; then
              echo "[gitee] unable to create or recover Gitee Release for $TAG after 4 attempts"
              exit 1
            fi
          fi

          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Upload assets to Gitee
        if: steps.check.outputs.skip == '0' && steps.filter.outputs.count != '0'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
          RELEASE_ID: ${{ steps.gitee_release.outputs.id }}
        run: |
          set -euo pipefail
          fail=0
          ok=0
          shopt -s nullglob

          API="https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/releases/$RELEASE_ID/attach_files"
          # Gitee may accept a file even if the upload response is lost.
          # Reconcile by name + size before and after every ambiguous upload.
          list_attachments() {
            local resp body code
            if ! resp=$(curl --http1.1 --connect-timeout 15 --max-time 30 -sS \
              -w "\n%{http_code}" "$API?access_token=$GITEE_TOKEN"); then
              echo "[gitee] list attachments: network error" >&2
              return 1
            fi
            body=$(printf '%s' "$resp" | sed '$d')
            code=$(printf '%s' "$resp" | tail -n 1)
            if [ "$code" != "200" ]; then
              echo "[gitee] list attachments failed (HTTP $code)" >&2
              return 1
            fi
            if ! printf '%s' "$body" | jq -e 'type == "array" or (.assets | type == "array")' >/dev/null; then
              echo "[gitee] unexpected attachment-list response" >&2
              return 1
            fi
            printf '%s' "$body"
          }

          existing_size() {
            jq -r --arg name "$1" '
              (if type == "array" then . else (.assets // []) end)
              | map(select(.name == $name))
              | first
              | .size // empty
            '
          }

          for f in upload/*; do
            base=$(basename "$f")
            size=$(stat -c%s "$f")
            if ! attachments=$(list_attachments); then
              echo "[gitee] cannot verify existing attachments; aborting safely"
              exit 1
            fi
            found=$(printf '%s' "$attachments" | existing_size "$base")
            if [ -n "$found" ]; then
              if [ "$found" = "$size" ]; then
                echo "[gitee] already uploaded: $base"
                ok=$((ok+1))
              else
                echo "[gitee] existing attachment has different size: $base ($found != $size)"
                fail=$((fail+1))
              fi
              continue
            fi

            uploaded=0
            for attempt in 1 2; do
              echo "[gitee] uploading $base (attempt $attempt/2, max 180s)"
              result_file="$RUNNER_TEMP/gitee-upload-response.json"
              error_file="$RUNNER_TEMP/gitee-upload-error.txt"
              # Use 'if curl' so runner-level bash -e cannot bypass failure handling.
              if http=$(curl --http1.1 --connect-timeout 15 --max-time 180 \
                --speed-limit 10240 --speed-time 45 \
                -sS -o "$result_file" -w "%{http_code}" \
                -X POST -F "access_token=$GITEE_TOKEN" -F "file=@$f" \
                "$API" 2>"$error_file"); then
                if [ "$http" = "201" ] || [ "$http" = "200" ]; then
                  echo "[gitee] uploaded: $base"
                  uploaded=1
                  break
                fi
                echo "[gitee] upload returned HTTP $http: $base"
                if [[ "$http" =~ ^4[0-9][0-9]$ ]] && [ "$http" != "408" ] && [ "$http" != "429" ]; then
                  echo "[gitee] permanent client error; will reconcile once and not retry"
                  permanent=1
                else
                  permanent=0
                fi
              else
                permanent=0
                echo "[gitee] upload network error: $base"
                sed -E 's/(access_token=)[^& ]+/\1***/g' "$error_file" || true
              fi

              # An interrupted POST may have created the attachment on Gitee.
              if ! attachments=$(list_attachments); then
                echo "[gitee] attachment state unknown; not retrying a potentially successful POST"
                break
              fi
              found=$(printf '%s' "$attachments" | existing_size "$base")
              if [ -n "$found" ]; then
                if [ "$found" = "$size" ]; then
                  echo "[gitee] recovered completed upload: $base"
                  uploaded=1
                else
                  echo "[gitee] remote size mismatch after upload: $base"
                fi
                break
              fi
              if [ "$permanent" = "1" ] || [ "$attempt" = "2" ]; then
                break
              fi
              sleep 3
            done

            if [ "$uploaded" = "1" ]; then
              ok=$((ok+1))
            else
              echo "[gitee] FAILED to upload: $base"
              fail=$((fail+1))
            fi
            sleep 1
          done

          echo "[gitee] done: ok=$ok fail=$fail"
          # Keep failures visible; a successful Release record is not a complete asset mirror.
          if [ "$fail" -gt 0 ]; then
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Gitee Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "- tag: ${{ steps.tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- skipped (no secrets): ${{ steps.check.outputs.skip }}" >> $GITHUB_STEP_SUMMARY
          echo "- files queued: ${{ steps.filter.outputs.count }}" >> $GITHUB_STEP_SUMMARY
          echo "- gitee release id: ${{ steps.gitee_release.outputs.id }}" >> $GITHUB_STEP_SUMMARY
