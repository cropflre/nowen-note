name: Apply Issue 612 title lifecycle patch

on:
  push:
    branches:
      - fix/issue-612-data-protection
    paths:
      - .github/workflows/issue-612-title-lifecycle-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-612-data-protection
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply lifecycle safety patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          Path("frontend/src/lib/editorLifecycleSafety.ts").write_text('''import { shouldEmitTitleUpdate } from "@/lib/titleIme";

export type EditorLifecycleSaveMode = "none" | "title" | "content";

export function resolveEditorLifecycleSave({
  hasPendingContent,
  title,
  noteTitle,
  lastEmittedTitle,
  isTitleComposing,
}: {
  hasPendingContent: boolean;
  title: string;
  noteTitle: string;
  lastEmittedTitle: string;
  isTitleComposing: boolean;
}): EditorLifecycleSaveMode {
  if (hasPendingContent) return "content";
  if (isTitleComposing) return "none";
  return shouldEmitTitleUpdate({ title, noteTitle, lastEmittedTitle })
    ? "title"
    : "none";
}
''', encoding="utf-8")

          Path("frontend/src/lib/__tests__/editorLifecycleSafety.test.ts").write_text('''import { describe, expect, it } from "vitest";
import { resolveEditorLifecycleSave } from "@/lib/editorLifecycleSafety";

describe("editor lifecycle save safety", () => {
  it("flushes pending content even when the title is unchanged", () => {
    expect(resolveEditorLifecycleSave({
      hasPendingContent: true,
      title: "Title",
      noteTitle: "Title",
      lastEmittedTitle: "Title",
      isTitleComposing: false,
    })).toBe("content");
  });

  it("flushes a title-only edit when no body debounce exists", () => {
    expect(resolveEditorLifecycleSave({
      hasPendingContent: false,
      title: "New title",
      noteTitle: "Old title",
      lastEmittedTitle: "Old title",
      isTitleComposing: false,
    })).toBe("title");
  });

  it("does not emit an unchanged title during lifecycle events", () => {
    expect(resolveEditorLifecycleSave({
      hasPendingContent: false,
      title: "Title",
      noteTitle: "Title",
      lastEmittedTitle: "Title",
      isTitleComposing: false,
    })).toBe("none");
  });

  it("does not send an unfinished IME title without pending body content", () => {
    expect(resolveEditorLifecycleSave({
      hasPendingContent: false,
      title: "未完成输",
      noteTitle: "旧标题",
      lastEmittedTitle: "旧标题",
      isTitleComposing: true,
    })).toBe("none");
  });
});
''', encoding="utf-8")

