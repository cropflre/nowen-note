name: Repair PostgreSQL Yjs boundary from PR

on:
  pull_request:
    branches: [pg-migration-unified]
    types: [opened, reopened, synchronize]
    paths:
      - "backend/.pg-yjs-boundary-trigger"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pg-migration-unified
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Execute embedded repair script
        id: repair
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/pg-yjs-boundary.log
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/pg-fix-yjs-boundary.yml').read_text()
          marker = "python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])
          script = script.replace(
              "persist_pattern.subn(persist_replacement, source, count=1)",
              "persist_pattern.subn(lambda _match: persist_replacement, source, count=1)",
          )
          script = script.replace(
              "prepare(noteId: string): YjsSubdocumentManifest | null",
              "prepareManifest(noteId: string): YjsSubdocumentManifest | null",
          )
          script = script.replace(
              "yjsSubdocumentsRepository.prepare(noteId)",
              "yjsSubdocumentsRepository.prepareManifest(noteId)",
          )
          exec(compile(script, 'repair-yjs-boundary.py', 'exec'), {})
          PY

      - name: Upload repair diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-yjs-boundary-${{ github.run_id }}
          path: /tmp/pg-yjs-boundary.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop after repair failure
        if: steps.repair.outcome == 'failure'
        run: exit 1

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Validate Yjs repository boundary
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          npm run build:tsc -- --noEmit 2>&1 | tee -a /tmp/pg-yjs-boundary.log
          node --import tsx --test --test-concurrency=1 \
            tests/webhook-yjs-service-boundary.test.ts \
            2>&1 | tee -a /tmp/pg-yjs-boundary.log

      - name: Commit repaired boundary
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/services/yjs.ts \
            backend/src/repositories/yjsPersistenceRepository.ts \
            backend/src/repositories/yjsSubdocumentsRepository.ts
          git rm \
            .github/workflows/pg-fix-yjs-boundary.yml \
            .github/workflows/pg-fix-yjs-boundary-pr.yml
          git commit -m "refactor(postgres): move Yjs persistence behind repositories"
          git push origin HEAD:pg-migration-unified
