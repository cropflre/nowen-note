name: PostgreSQL Task Runtime

on:
  push:
    branches: [pg-migration-unified]
    paths:
      - "backend/src/routes/tasks-runtime.ts"
      - "backend/src/routes/task-projects-runtime.ts"
      - "backend/src/routes/task-dependencies-runtime.ts"
      - "backend/src/routes/task-reminders-runtime.ts"
      - "backend/src/routes/task-reminder-delivery-runtime.ts"
      - "backend/src/routes/task-templates-runtime.ts"
      - "backend/src/services/task-recurrence-runtime.ts"
      - "backend/src/services/task-module-access-runtime.ts"
      - "backend/src/services/task-reminder-delivery-runtime.ts"
      - "backend/src/services/task-automation-delivery-runtime.ts"
      - "backend/src/repositories/taskCoreRepository.ts"
      - "backend/src/db/postgres/schema.base.sql"
      - "backend/src/db/postgres/migrations/0057_task_reminder_runtime_parity.sql"
      - "backend/src/db/postgres/migrations/0058_task_reminder_delivery_runtime.sql"
      - "backend/src/db/postgres/migrations/0059_task_automation_delivery_runtime.sql"
      - "backend/src/index.postgres-runtime.ts"
      - "backend/tests/task-core-repository-pg.test.ts"
      - "backend/tests/task-core-runtime-pg.test.ts"
      - "backend/tests/task-module-phase2-runtime-pg.test.ts"
      - "backend/tests/task-reminder-delivery-runtime-pg.test.ts"
      - "backend/tests/task-automation-delivery-runtime-pg.test.ts"
      - "backend/tests/task-templates-runtime-pg.test.ts"
      - "backend/tests/postgres-migrations.test.ts"
      - ".github/workflows/pg-task-runtime.yml"
  pull_request:
    paths:
      - "backend/src/routes/tasks-runtime.ts"
      - "backend/src/routes/task-projects-runtime.ts"
      - "backend/src/routes/task-dependencies-runtime.ts"
      - "backend/src/routes/task-reminders-runtime.ts"
      - "backend/src/routes/task-reminder-delivery-runtime.ts"
      - "backend/src/routes/task-templates-runtime.ts"
      - "backend/src/services/task-recurrence-runtime.ts"
      - "backend/src/services/task-module-access-runtime.ts"
      - "backend/src/services/task-reminder-delivery-runtime.ts"
      - "backend/src/services/task-automation-delivery-runtime.ts"
      - "backend/src/repositories/taskCoreRepository.ts"
      - "backend/src/db/postgres/schema.base.sql"
      - "backend/src/db/postgres/migrations/0057_task_reminder_runtime_parity.sql"
      - "backend/src/db/postgres/migrations/0058_task_reminder_delivery_runtime.sql"
      - "backend/src/db/postgres/migrations/0059_task_automation_delivery_runtime.sql"
      - "backend/src/index.postgres-runtime.ts"
      - "backend/tests/task-core-repository-pg.test.ts"
      - "backend/tests/task-core-runtime-pg.test.ts"
      - "backend/tests/task-module-phase2-runtime-pg.test.ts"
      - "backend/tests/task-reminder-delivery-runtime-pg.test.ts"
      - "backend/tests/task-automation-delivery-runtime-pg.test.ts"
      - "backend/tests/task-templates-runtime-pg.test.ts"
      - "backend/tests/postgres-migrations.test.ts"
      - ".github/workflows/pg-task-runtime.yml"
  workflow_dispatch:

jobs:
  tasks-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nowen
          POSTGRES_PASSWORD: nowen
          POSTGRES_DB: nowen_note_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nowen -d nowen_note_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_PG_DATABASE_URL: postgresql://nowen:nowen@127.0.0.1:5432/nowen_note_test
      DATABASE_URL: postgresql://nowen:nowen@127.0.0.1:5432/nowen_note_test
      DB_DRIVER: postgres
      JWT_SECRET: pg-task-runtime-ci-secret-please-change
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npm run build:tsc -- --noEmit
      - name: Task repository foundation regression
        run: node --import tsx --test --test-concurrency=1 tests/task-core-repository-pg.test.ts
      - name: Task core API and recurrence lifecycle
        run: node --import tsx --test --test-concurrency=1 tests/task-core-runtime-pg.test.ts
      - name: Task module phase 2 runtime
        run: node --import tsx --test --test-concurrency=1 tests/task-module-phase2-runtime-pg.test.ts
      - name: Task templates runtime
        run: node --import tsx --test --test-concurrency=1 tests/task-templates-runtime-pg.test.ts
      - name: Durable task reminder delivery runtime
        run: node --import tsx --test --test-concurrency=1 tests/task-reminder-delivery-runtime-pg.test.ts
      - name: Durable task automation notifications
        run: node --import tsx --test --test-concurrency=1 tests/task-automation-delivery-runtime-pg.test.ts
      - name: PostgreSQL migration regression
        run: node --import tsx --test --test-concurrency=1 tests/postgres-migrations.test.ts
      - name: Build production backend bundle
        run: npm run build
