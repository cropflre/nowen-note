name: WebDAV Backup CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/webdav-backup
    paths:
      - "backend/src/index.hardened.ts"
      - "backend/src/routes/backup-webdav.ts"
      - "backend/src/runtime/auto-full-backup.ts"
      - "backend/src/runtime/backup-webdav.ts"
      - "backend/src/services/backup-webdav.ts"
      - "backend/tests/backup-webdav.test.ts"
      - "backend/tests/auto-full-backup.test.ts"
      - "frontend/src/components/BackupWebDavBridge.tsx"
      - "frontend/src/main.tsx"
      - ".env.example"
      - "docs/webdav-backup.md"
      - ".github/workflows/webdav-backup-ci.yml"
  pull_request:
    paths:
      - "backend/src/index.hardened.ts"
      - "backend/src/routes/backup-webdav.ts"
      - "backend/src/runtime/auto-full-backup.ts"
      - "backend/src/runtime/backup-webdav.ts"
      - "backend/src/services/backup-webdav.ts"
      - "backend/tests/backup-webdav.test.ts"
      - "backend/tests/auto-full-backup.test.ts"
      - "frontend/src/components/BackupWebDavBridge.tsx"
      - "frontend/src/main.tsx"
      - ".env.example"
      - "docs/webdav-backup.md"
      - ".github/workflows/webdav-backup-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: WebDAV and automatic backup tests
        run: >-
          node --import tsx --import ./tests/setup-db-isolation.ts --test
          tests/backup-webdav.test.ts
          tests/auto-full-backup.test.ts
      - name: Backend typecheck
        run: npm run build:tsc

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Frontend typecheck
        run: npx tsc -b
