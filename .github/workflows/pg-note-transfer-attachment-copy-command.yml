name: PostgreSQL Note Transfer Attachment Copy Command

on:
  pull_request:
    paths:
      - ".github/workflows/pg-note-transfer-attachment-copy-command.yml"

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nowen
          POSTGRES_PASSWORD: nowen_ci_password
          POSTGRES_DB: nowen_note_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nowen -d nowen_note_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_PG_DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test
      DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test

    steps:
      - uses: actions/checkout@v4
        with:
          ref: pg-migration-unified
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Implement physical attachment staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 backend/scripts/implement-note-transfer-attachment-copy-20260804.py

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Validate TypeScript and database boundaries
        working-directory: backend
        run: |
          npm run build:tsc -- --noEmit
          npm run audit:sqlite-boundaries
          npm run audit:pg-schema-parity

      - name: Validate migrations and Note Transfer attachment staging
        working-directory: backend
        run: >-
          node --import tsx --test --test-concurrency=1
          tests/postgres-migrations.test.ts
          tests/note-transfer-preview-runtime-pg.test.ts
          tests/note-transfer-attachment-staging-runtime-pg.test.ts

      - name: Validate production bundle
        working-directory: backend
        run: |
          npm run build
          test -f dist/postgres/migrations/0018_note_transfer_attachment_staging_runtime.sql

      - name: Commit validated attachment staging slice
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- \
            .github/workflows/pg-note-transfer-attachment-copy-command.yml \
            .github/workflows/pg-runtime.yml
          git rm -f backend/scripts/implement-note-transfer-attachment-copy-20260804.py
          git add -A
          git commit -m "feat(pg): add recoverable physical attachment staging"
          git push origin HEAD:pg-migration-unified

