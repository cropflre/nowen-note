name: PostgreSQL Note Transfer Orchestration Fix 20260805

on:
  push:
    branches: [feat/pg-note-transfer-orchestration-20260805]
    paths:
      - ".github/workflows/pg-note-transfer-orchestration-fix-20260805.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pg-note-transfer-orchestration-20260805
          fetch-depth: 0
      - name: Apply targeted orchestration fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          repo = Path("backend/src/repositories/noteTransferOrchestrationRepository.ts")
          text = repo.read_text()
          text = text.replace(
              "operation.status IN ('prepared', 'staging', 'target_committed', 'source_deleting')",
              "(operation.status = 'prepared' AND operation.\"expiresAt\" > CURRENT_TIMESTAMP)\n  OR operation.status IN ('staging', 'target_committed', 'source_deleting')",
              1,
          )
          text = text.replace(
              "function countSummary(row: CountRow | null, completeWhenEmpty: boolean)",
              "function countSummary(row: CountRow | null | undefined, completeWhenEmpty: boolean)",
              1,
          )
          text = text.replace(
              "): Promise<CountRow | null> {",
              "): Promise<CountRow | undefined> {",
              1,
          )
          pattern = re.compile(
              r"    async resetFailure\(input: \{ actorUserId: string; idempotencyKey: string \}\): Promise<void> \{.*?\n    \},\n\n    async release",
              re.S,
          )
          replacement = '''    async resetFailure(input: { actorUserId: string; idempotencyKey: string }): Promise<void> {
              const key = normalizeIdempotencyKey(input.idempotencyKey);
              const result = await db.execute(
                `UPDATE note_transfer_operations
                    SET "orchestrationAttempts" = 0,
                        "orchestrationAvailableAt" = CURRENT_TIMESTAMP,
                        "orchestrationLastError" = NULL,
                        "orchestrationLeaseToken" = NULL,
                        "orchestrationLeaseExpiresAt" = NULL,
                        "updatedAt" = CURRENT_TIMESTAMP
                  WHERE "userId" = ? AND "idempotencyKey" = ?
                    AND (
                      "orchestrationLeaseExpiresAt" IS NULL
                      OR "orchestrationLeaseExpiresAt" <= CURRENT_TIMESTAMP
                    )`,
                [input.actorUserId, key],
              );
              if (result.changes === 1) return;
              const existing = await db.queryOne<{ id: string }>(
                `SELECT id FROM note_transfer_operations
                  WHERE "userId" = ? AND "idempotencyKey" = ?`,
                [input.actorUserId, key],
              );
              if (!existing) {
                throw new NoteTransferOperationError(
                  "NOTE_TRANSFER_PLAN_NOT_FOUND",
                  "转移计划不存在",
                  404,
                );
              }
            },

            async release'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("resetFailure block mismatch")
          repo.write_text(text)

          test_path = Path("backend/tests/note-transfer-orchestration-runtime-pg.test.ts")
          test_text = test_path.read_text()
          test_text = test_text.replace(
              "claimNextAny: async () => null,",
              "claimNextAny: async (_input: { maxAttempts: number; leaseSeconds: number }) => null,",
              1,
          )
          test_text = test_text.replace("  } as const;\n}", "  };\n}", 1)
          test_path.write_text(test_text)
          PY
          git diff --check
          git diff --exit-code -- .github/workflows/pg-note-transfer-orchestration-fix-20260805.yml >/dev/null || true
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/repositories/noteTransferOrchestrationRepository.ts backend/tests/note-transfer-orchestration-runtime-pg.test.ts
          git commit -m "fix(pg): harden orchestration claims and typing"
          git push origin HEAD:feat/pg-note-transfer-orchestration-20260805
