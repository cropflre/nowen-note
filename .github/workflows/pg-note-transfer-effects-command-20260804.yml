name: PostgreSQL Note Transfer Effects Command 20260804

on:
  push:
    branches:
      - pg-migration-unified
    paths:
      - "backend/scripts/.effects-command.gz.b64.part-*"
      - ".github/workflows/pg-note-transfer-effects-command-20260804.yml"
  pull_request:
    branches:
      - pg-migration-unified
    paths:
      - ".github/pg-note-transfer-effects-trigger"
      - ".github/workflows/pg-note-transfer-effects-command-20260804.yml"

permissions:
  contents: write

concurrency:
  group: pg-note-transfer-effects-command-20260804
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nowen
          POSTGRES_PASSWORD: nowen_ci_password
          POSTGRES_DB: nowen_note_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nowen -d nowen_note_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_PG_DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test
      DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test

    steps:
      - uses: actions/checkout@v4
        with:
          ref: pg-migration-unified
          fetch-depth: 0

      - name: Decode implementation command
        run: |
          cat backend/scripts/.effects-command.gz.b64.part-* | base64 -d > /tmp/note-transfer-effects-command.gz
          gzip -t /tmp/note-transfer-effects-command.gz
          gunzip -c /tmp/note-transfer-effects-command.gz > backend/scripts/implement-note-transfer-effects-20260804.py
          python3 -m py_compile backend/scripts/implement-note-transfer-effects-20260804.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Apply implementation
        run: python3 backend/scripts/implement-note-transfer-effects-20260804.py

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Validate TypeScript and database boundaries
        working-directory: backend
        run: |
          npm run build:tsc -- --noEmit
          npm run audit:sqlite-boundaries
          npm run audit:pg-schema-parity

      - name: Validate effects and prior transfer phases
        working-directory: backend
        run: >-
          node --import tsx --test --test-concurrency=1
          tests/postgres-migrations.test.ts
          tests/note-transfer-preview-runtime-pg.test.ts
          tests/note-transfer-attachment-staging-runtime-pg.test.ts
          tests/note-transfer-commit-runtime-pg.test.ts
          tests/note-transfer-cleanup-runtime-pg.test.ts
          tests/note-transfer-effects-runtime-pg.test.ts

      - name: Validate production bundle
        working-directory: backend
        run: npm run build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f backend/scripts/.effects-command.gz.b64 backend/scripts/.effects-command.gz.b64.part-* backend/scripts/.effects-command-part-00 .github/workflows/pg-note-transfer-effects-command-20260804.yml
          git add backend/src backend/tests .github/workflows/pg-note-transfer-effects.yml
          git commit -m "feat(pg): add durable note transfer effects outbox"
          git push origin HEAD:pg-migration-unified
