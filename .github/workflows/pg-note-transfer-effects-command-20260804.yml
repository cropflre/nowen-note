# retrigger: 2026-08-04T16:29:00+08:00
name: PostgreSQL Note Transfer Effects Command 20260804

on:
  push:
    branches:
      - pg-migration-unified
    paths:
      - "backend/scripts/.effects-command.gz.b64.part-*"
      - ".github/workflows/pg-note-transfer-effects-command-20260804.yml"
  pull_request:
    branches:
      - pg-migration-unified
    paths:
      - ".github/pg-note-transfer-effects-trigger"
      - ".github/workflows/pg-note-transfer-effects-command-20260804.yml"

permissions:
  contents: write

concurrency:
  group: pg-note-transfer-effects-command-20260804-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nowen
          POSTGRES_PASSWORD: nowen_ci_password
          POSTGRES_DB: nowen_note_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nowen -d nowen_note_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_PG_DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test
      DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test

    steps:
      - uses: actions/checkout@v4
        with:
          ref: pg-migration-unified
          fetch-depth: 0

      - name: Decode implementation command
        run: |
          cat backend/scripts/.effects-command.gz.b64.part-* | base64 -d > /tmp/note-transfer-effects-command.gz
          gzip -t /tmp/note-transfer-effects-command.gz
          gunzip -c /tmp/note-transfer-effects-command.gz > backend/scripts/implement-note-transfer-effects-20260804.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("backend/scripts/implement-note-transfer-effects-20260804.py")
          content = path.read_text(encoding="utf-8")
          old_anchor = "'''            to_regclass('public.idx_note_transfer_staged_attachments_lease') AS staged_lease`,'''"
          current_anchor = "'''            to_regclass('public.idx_note_transfer_staged_attachments_lease') AS staged_lease,\\n            to_regclass('public.idx_note_transfer_staged_attachments_cleanup_lease') AS cleanup_lease`,'''"
          old_output = "'''            to_regclass('public.idx_note_transfer_staged_attachments_lease') AS staged_lease,\\n            to_regclass('public.idx_note_transfer_effect_outbox_claim') AS effect_claim,\\n            to_regclass('public.idx_note_transfer_effect_outbox_operation') AS effect_operation`,'''"
          current_output = "'''            to_regclass('public.idx_note_transfer_staged_attachments_lease') AS staged_lease,\\n            to_regclass('public.idx_note_transfer_staged_attachments_cleanup_lease') AS cleanup_lease,\\n            to_regclass('public.idx_note_transfer_effect_outbox_claim') AS effect_claim,\\n            to_regclass('public.idx_note_transfer_effect_outbox_operation') AS effect_operation`,'''"
          if content.count(old_anchor) != 1 or content.count(old_output) != 1:
              raise RuntimeError("unexpected effects command migration-test anchor")
          path.write_text(
              content.replace(old_anchor, current_anchor, 1).replace(old_output, current_output, 1),
              encoding="utf-8",
          )
          PY
          python3 -m py_compile backend/scripts/implement-note-transfer-effects-20260804.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Apply implementation
        run: python3 backend/scripts/implement-note-transfer-effects-20260804.py

      - name: Harden generated effects runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path

          repository_path = Path("backend/src/repositories/noteTransferEffectsRepository.ts")
          repository = repository_path.read_text(encoding="utf-8")
          old_mapper = "    return mapClaim(row, leaseToken);"
          new_mapper = "    return mapClaim(row ?? null, leaseToken);"
          if repository.count(old_mapper) != 1:
              raise RuntimeError("unexpected noteTransferEffectsRepository claim mapper")
          repository_path.write_text(repository.replace(old_mapper, new_mapper, 1), encoding="utf-8")

          runtime_path = Path("backend/src/services/note-transfer-effects-runtime.ts")
          runtime = runtime_path.read_text(encoding="utf-8")
          old_loop = '''    await repository.assertCompleted(input);
    const counters = { attempted: 0, completedThisRun: 0, failedThisRun: 0 };
    const worker = async () => {
      while (true) {
        const claim = await repository.claimNextForOperation({
'''
          new_loop = '''    await repository.assertCompleted(input);
    const initial = await repository.summarize({ ...input, maxAttempts });
    let remaining = Math.max(0, initial.total - initial.completed - initial.exhausted);
    const counters = { attempted: 0, completedThisRun: 0, failedThisRun: 0 };
    const worker = async () => {
      while (remaining > 0) {
        remaining -= 1;
        const claim = await repository.claimNextForOperation({
'''
          if runtime.count(old_loop) != 1:
              raise RuntimeError("unexpected note-transfer effects resume worker")
          runtime_path.write_text(runtime.replace(old_loop, new_loop, 1), encoding="utf-8")
          PY

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Validate TypeScript and database boundaries
        working-directory: backend
        run: |
          npm run build:tsc -- --noEmit
          npm run audit:sqlite-boundaries
          npm run audit:pg-schema-parity

      - name: Validate effects and prior transfer phases
        working-directory: backend
        run: >-
          node --import tsx --test --test-concurrency=1
          tests/postgres-migrations.test.ts
          tests/note-transfer-preview-runtime-pg.test.ts
          tests/note-transfer-attachment-staging-runtime-pg.test.ts
          tests/note-transfer-commit-runtime-pg.test.ts
          tests/note-transfer-cleanup-runtime-pg.test.ts
          tests/note-transfer-effects-runtime-pg.test.ts

      - name: Validate production bundle
        working-directory: backend
        run: npm run build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f backend/scripts/.effects-command.gz.b64 backend/scripts/.effects-command.gz.b64.part-* backend/scripts/.effects-command-part-00 .github/workflows/pg-note-transfer-effects-command-20260804.yml
          git add backend/src backend/tests .github/workflows/pg-note-transfer-effects.yml
          git commit -m "feat(pg): add durable note transfer effects outbox"
          git push origin HEAD:pg-migration-unified
