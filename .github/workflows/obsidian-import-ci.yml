name: Obsidian Import CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/v1.5.0
    paths:
      - "frontend/src/components/ObsidianImport.tsx"
      - "frontend/src/components/KnowledgeTreePanel.tsx"
      - "frontend/src/components/MobileKnowledgeTreePanel.tsx"
      - "frontend/src/lib/api.impl.ts"
      - "frontend/src/lib/knowledgeTreeApi.ts"
      - "frontend/src/lib/obsidianImportTypes.ts"
      - "frontend/src/lib/obsidianImportService.ts"
      - "frontend/src/lib/obsidianScan.ts"
      - "frontend/src/lib/obsidianReferences.ts"
      - "frontend/src/lib/__tests__/obsidianImport*.test.ts"
      - "frontend/src/components/__tests__/ObsidianImportV2UxGuard.test.ts"
      - "backend/src/routes/export.ts"
      - "backend/src/routes/knowledge-tree.ts"
      - "backend/tests/obsidian-import-v2.test.ts"
      - ".github/workflows/obsidian-import-ci.yml"
  pull_request:
    paths:
      - "frontend/src/components/ObsidianImport.tsx"
      - "frontend/src/components/KnowledgeTreePanel.tsx"
      - "frontend/src/components/MobileKnowledgeTreePanel.tsx"
      - "frontend/src/lib/api.impl.ts"
      - "frontend/src/lib/knowledgeTreeApi.ts"
      - "frontend/src/lib/obsidianImportTypes.ts"
      - "frontend/src/lib/obsidianImportService.ts"
      - "frontend/src/lib/obsidianScan.ts"
      - "frontend/src/lib/obsidianReferences.ts"
      - "frontend/src/lib/__tests__/obsidianImport*.test.ts"
      - "frontend/src/components/__tests__/ObsidianImportV2UxGuard.test.ts"
      - "backend/src/routes/export.ts"
      - "backend/src/routes/knowledge-tree.ts"
      - "backend/tests/obsidian-import-v2.test.ts"
      - ".github/workflows/obsidian-import-ci.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Obsidian import V2 regression tests
        run: >-
          npm run test:run --
          src/lib/__tests__/obsidianImportService.test.ts
          src/lib/__tests__/obsidianImportFormat.test.ts
          src/lib/__tests__/obsidianImportV2.test.ts
          src/components/__tests__/ObsidianImportV2UxGuard.test.ts
      - name: Frontend typecheck
        run: npx tsc -b

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Obsidian source identity and knowledge file tests
        run: node --import tsx --test tests/obsidian-import-v2.test.ts
      - name: Backend typecheck
        if: always()
        run: npm run build:tsc
