name: HTML Preview Mobile CI

on:
  workflow_dispatch:
  push:
    branches: [main, "release/**"]
    paths:
      - "frontend/src/components/HtmlPreviewPane.tsx"
      - "frontend/src/components/HtmlPreviewPane.css"
      - "frontend/src/lib/htmlPreviewAssets.ts"
      - "frontend/src/components/__tests__/HtmlPreviewPane.mobileLayout.test.tsx"
      - "frontend/src/lib/__tests__/htmlPreviewAssets.test.ts"
      - ".github/workflows/html-preview-mobile-ci.yml"
  pull_request:
    paths:
      - "frontend/src/components/HtmlPreviewPane.tsx"
      - "frontend/src/components/HtmlPreviewPane.css"
      - "frontend/src/lib/htmlPreviewAssets.ts"
      - "frontend/src/components/__tests__/HtmlPreviewPane.mobileLayout.test.tsx"
      - "frontend/src/lib/__tests__/htmlPreviewAssets.test.ts"
      - ".github/workflows/html-preview-mobile-ci.yml"

permissions:
  contents: read

jobs:
  html-preview-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: HTML preview and attachment URL regression tests
        run: npx vitest run src/components/__tests__/HtmlPreviewPane.mobileLayout.test.tsx src/lib/__tests__/htmlPreviewAssets.test.ts --reporter=verbose
      - name: Frontend production build
        run: npm run build
