name: Shortcut Merge Diagnostic

on:
  push:
    branches:
      - agent/shortcut-help-center

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shortcut-help-center
          fetch-depth: 0
      - name: Record merge conflicts without changing source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main >/tmp/merge.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            git commit -m "chore(shortcuts): merge latest main"
            result="MERGE_CLEAN"
          else
            conflicts="$(git diff --name-only --diff-filter=U)"
            git merge --abort
            printf '%s\n' "$conflicts" > .github/shortcut-merge-conflicts.txt
            result="MERGE_CONFLICTS_RECORDED"
          fi
          rm -f .github/workflows/shortcut-merge-diagnostic.yml
          git add -A
          git commit -m "chore(shortcuts): record main merge status"
          git push origin HEAD:agent/shortcut-help-center
          echo "$result"
