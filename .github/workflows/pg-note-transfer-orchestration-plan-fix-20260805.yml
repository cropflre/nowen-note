name: PostgreSQL Note Transfer Orchestration Plan Fix 20260805

on:
  push:
    branches: [feat/pg-note-transfer-orchestration-20260805]
    paths:
      - ".github/workflows/pg-note-transfer-orchestration-plan-fix-20260805.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pg-note-transfer-orchestration-20260805
          fetch-depth: 0
      - name: Align durable plan counts with include flags
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          runtime = Path("backend/src/services/note-transfer-orchestration-runtime.ts")
          runtime_text = runtime.read_text()
          runtime_pattern = re.compile(
            r'(?P<indent>^[ \t]*)attachmentCount: result\.attachmentCount,\s*'
            r'attachmentBytes: result\.attachmentBytes,\s*'
            r'tagCount: result\.tagCount,',
            re.M,
          )
          def runtime_replacement(match):
            indent = match.group("indent")
            return (
              f"{indent}attachmentCount: input.includeAttachments !== false ? result.attachmentCount : 0,\n"
              f"{indent}attachmentBytes: input.includeAttachments !== false ? result.attachmentBytes : 0,\n"
              f"{indent}tagCount: input.includeTags !== false ? result.tagCount : 0,"
            )
          runtime_text, runtime_count = runtime_pattern.subn(runtime_replacement, runtime_text, count=1)
          if runtime_count != 1:
            raise SystemExit("orchestration plan count pattern mismatch")
          runtime.write_text(runtime_text)

          route = Path("backend/src/routes/note-transfers-runtime.ts")
          route_text = route.read_text()
          route_pattern = re.compile(
            r'(?P<indent>^[ \t]*)attachmentCount: preview\.attachmentCount,\s*'
            r'attachmentBytes: preview\.attachmentBytes,\s*'
            r'tagCount: preview\.tagCount,',
            re.M,
          )
          def route_replacement(match):
            indent = match.group("indent")
            return (
              f"{indent}attachmentCount: request.includeAttachments !== false ? preview.attachmentCount : 0,\n"
              f"{indent}attachmentBytes: request.includeAttachments !== false ? preview.attachmentBytes : 0,\n"
              f"{indent}tagCount: request.includeTags !== false ? preview.tagCount : 0,"
            )
          route_text, route_count = route_pattern.subn(route_replacement, route_text, count=1)
          if route_count != 1:
            raise SystemExit("prepare route plan count pattern mismatch")
          route.write_text(route_text)
          PY
          git diff --check
      - name: Commit plan count fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/services/note-transfer-orchestration-runtime.ts backend/src/routes/note-transfers-runtime.ts
          git commit -m "fix(pg): align transfer plan counts with include flags"
          git push origin HEAD:feat/pg-note-transfer-orchestration-20260805
