name: PostgreSQL Note Transfer Orchestration Plan Fix 20260805

on:
  push:
    branches: [feat/pg-note-transfer-orchestration-20260805]
    paths:
      - ".github/workflows/pg-note-transfer-orchestration-plan-fix-20260805.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pg-note-transfer-orchestration-20260805
          fetch-depth: 0
      - name: Align durable plan counts with include flags
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path("backend/src/services/note-transfer-orchestration-runtime.ts")
          runtime_text = runtime.read_text()
          old_runtime = '''      attachmentCount: result.attachmentCount,
                attachmentBytes: result.attachmentBytes,
                tagCount: result.tagCount,'''
          new_runtime = '''      attachmentCount: input.includeAttachments !== false ? result.attachmentCount : 0,
                attachmentBytes: input.includeAttachments !== false ? result.attachmentBytes : 0,
                tagCount: input.includeTags !== false ? result.tagCount : 0,'''
          if runtime_text.count(old_runtime) != 1:
            raise SystemExit("orchestration plan count anchor mismatch")
          runtime.write_text(runtime_text.replace(old_runtime, new_runtime, 1))

          route = Path("backend/src/routes/note-transfers-runtime.ts")
          route_text = route.read_text()
          old_route = '''        attachmentCount: preview.attachmentCount,
                attachmentBytes: preview.attachmentBytes,
                tagCount: preview.tagCount,'''
          new_route = '''        attachmentCount: request.includeAttachments !== false ? preview.attachmentCount : 0,
                attachmentBytes: request.includeAttachments !== false ? preview.attachmentBytes : 0,
                tagCount: request.includeTags !== false ? preview.tagCount : 0,'''
          if route_text.count(old_route) != 1:
            raise SystemExit("prepare route plan count anchor mismatch")
          route.write_text(route_text.replace(old_route, new_route, 1))
          PY
          git diff --check
      - name: Commit plan count fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/services/note-transfer-orchestration-runtime.ts backend/src/routes/note-transfers-runtime.ts
          git commit -m "fix(pg): align transfer plan counts with include flags"
          git push origin HEAD:feat/pg-note-transfer-orchestration-20260805
