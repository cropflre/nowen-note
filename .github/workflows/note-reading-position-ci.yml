name: Note Reading Position CI

on:
  push:
    branches: [main, "release/v1.5.2"]
    paths:
      - "frontend/src/lib/noteReadingPosition.ts"
      - "frontend/src/components/NoteReadingPositionBridge.tsx"
      - "frontend/src/components/EditorPane.tsx"
      - "frontend/src/components/TiptapEditor.tsx"
      - "frontend/src/lib/__tests__/noteReadingPosition.test.ts"
      - "frontend/src/components/__tests__/NoteReadingPositionBridge.test.tsx"
      - ".github/workflows/note-reading-position-ci.yml"
  pull_request:
    paths:
      - "frontend/src/lib/noteReadingPosition.ts"
      - "frontend/src/components/NoteReadingPositionBridge.tsx"
      - "frontend/src/components/EditorPane.tsx"
      - "frontend/src/components/TiptapEditor.tsx"
      - "frontend/src/lib/__tests__/noteReadingPosition.test.ts"
      - "frontend/src/components/__tests__/NoteReadingPositionBridge.test.tsx"
      - ".github/workflows/note-reading-position-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --silent
      - name: Reading position regression
        run: npx vitest run src/lib/__tests__/noteReadingPosition.test.ts src/components/__tests__/NoteReadingPositionBridge.test.tsx
      - name: Frontend typecheck
        run: npx tsc -b --pretty false
