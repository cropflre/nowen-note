name: PostgreSQL backup restore isolated gate

on:
  push:
    branches: [pg-validation-runtime-batch]
    paths:
      - ".github/workflows/pg-backup-isolated.yml"

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nowen
          POSTGRES_PASSWORD: nowen_ci_password
          POSTGRES_DB: nowen_note_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nowen -d nowen_note_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_PG_DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test
      DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test
      RUN_PG_BACKUP_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pg-migration-unified
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pg_dump --version | grep -E 'PostgreSQL\) 16\.'
          pg_restore --version | grep -E 'PostgreSQL\) 16\.'
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        working-directory: backend
        run: npm run build:tsc -- --noEmit
      - name: Backup and restore-drill integration
        working-directory: backend
        run: >-
          node --import tsx --test --test-concurrency=1
          tests/postgres-backup-runtime.test.ts
          tests/postgres-restore-drill-runtime.test.ts
      - name: Production bundle
        working-directory: backend
        run: npm run build
      - name: Verify container PostgreSQL client dependency
        run: grep -F "postgresql-client" Dockerfile
