name: Journal Cleanup and Natural Dates CI

on:
  pull_request:
    branches: [main]
    paths:
      - backend/src/routes/journals.ts
      - backend/src/services/journalArchiveCleanup.ts
      - backend/src/services/journalArchiveTree.ts
      - backend/tests/journal-archive-cleanup.test.ts
      - backend/tests/journal-archive-cleanup-routes.test.ts
      - backend/tests/journal-archive-tree.test.ts
      - backend/tests/journal-archive-routes.test.ts
      - frontend/src/components/daily-records/DailyJournalView.tsx
      - frontend/src/components/daily-records/dailyRecordSlashCommands.tsx
      - frontend/src/components/daily-records/markdownDailyRecordSlashCommands.tsx
      - frontend/src/components/daily-records/__tests__/dailyRecordSlashCommands.test.tsx
      - frontend/src/components/daily-records/__tests__/markdownDailyRecordSlashCommands.test.tsx
      - frontend/src/components/daily-records/__tests__/journalArchiveCleanupContract.test.ts
      - frontend/src/lib/api.impl.ts
      - frontend/src/lib/dailyRecordCommandDefinitions.ts
      - frontend/src/lib/__tests__/dailyRecordCommandDefinitions.test.ts
      - .github/workflows/journal-cleanup-natural-dates-ci.yml

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR merge commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --silent
      - name: Journal cleanup service regression
        working-directory: backend
        run: npx tsx --test tests/journal-archive-cleanup.test.ts
      - name: Journal cleanup route lifecycle
        working-directory: backend
        run: npx tsx --test tests/journal-archive-cleanup-routes.test.ts
      - name: Existing journal archive regressions
        working-directory: backend
        run: npx tsx --test tests/journal-archive-tree.test.ts tests/journal-archive-routes.test.ts
      - name: Backend typecheck
        working-directory: backend
        run: npm run build:tsc

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR merge commit
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --silent
      - name: Date commands and cleanup UI regressions
        working-directory: frontend
        run: >-
          npx vitest run --reporter=basic
          src/lib/__tests__/dailyRecordCommandDefinitions.test.ts
          src/components/daily-records/__tests__/dailyRecordSlashCommands.test.tsx
          src/components/daily-records/__tests__/markdownDailyRecordSlashCommands.test.tsx
          src/components/daily-records/__tests__/journalArchiveCleanupContract.test.ts
          src/components/__tests__/SlashCommandExtension.test.ts
      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc -b
      - name: Vite production bundle
        working-directory: frontend
        run: npx vite build
