name: PostgreSQL Note Transfer Orchestration Realtime Test Fix 20260805

on:
  push:
    branches: [feat/pg-note-transfer-orchestration-20260805]
    paths:
      - ".github/workflows/pg-note-transfer-orchestration-realtime-test-fix-20260805.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pg-note-transfer-orchestration-20260805
          fetch-depth: 0
      - name: Inject realtime publisher in route regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("backend/tests/note-transfer-preview-runtime-pg.test.ts")
          text = path.read_text()
          import_anchor = 'import createNoteTransfersRuntimeRouter from "../src/routes/note-transfers-runtime";\n'
          import_line = 'import { createNoteTransferEffectsRuntime } from "../src/services/note-transfer-effects-runtime";\n'
          if text.count(import_anchor) != 1:
            raise SystemExit("route import anchor mismatch")
          if import_line not in text:
            text = text.replace(import_anchor, import_anchor + import_line, 1)

          old_route = '''    const app = new Hono();
            app.route(
              "/api/note-transfers",
              createNoteTransfersRuntimeRouter(adapter),
            );'''
          new_route = '''    const app = new Hono();
            const effects = createNoteTransferEffectsRuntime(adapter, {
              publishRealtime: async () => {},
              retryBaseSeconds: 0,
            });
            app.route(
              "/api/note-transfers",
              createNoteTransfersRuntimeRouter(adapter, { effects }),
            );'''
          if text.count(old_route) != 1:
            raise SystemExit("router setup anchor mismatch")
          path.write_text(text.replace(old_route, new_route, 1))
          PY
          git diff --check
      - name: Commit regression dependency
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/note-transfer-preview-runtime-pg.test.ts
          git commit -m "test(pg): inject transfer realtime publisher"
          git push origin HEAD:feat/pg-note-transfer-orchestration-20260805
