name: PostgreSQL Note Transfer Orchestration Realtime Test Fix 20260805

on:
  push:
    branches: [feat/pg-note-transfer-orchestration-20260805]
    paths:
      - ".github/workflows/pg-note-transfer-orchestration-realtime-test-fix-20260805.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pg-note-transfer-orchestration-20260805
          fetch-depth: 0
      - name: Inject realtime publisher in route regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("backend/tests/note-transfer-preview-runtime-pg.test.ts")
          text = path.read_text()
          import_anchor = 'import createNoteTransfersRuntimeRouter from "../src/routes/note-transfers-runtime";\n'
          import_line = 'import { createNoteTransferEffectsRuntime } from "../src/services/note-transfer-effects-runtime";\n'
          if text.count(import_anchor) != 1:
            raise SystemExit("route import anchor mismatch")
          if import_line not in text:
            text = text.replace(import_anchor, import_anchor + import_line, 1)

          pattern = re.compile(
            r'(?P<indent>^[ \t]*)const app = new Hono\(\);\s*'
            r'app\.route\(\s*'
            r'"/api/note-transfers",\s*'
            r'createNoteTransfersRuntimeRouter\(adapter\),\s*'
            r'\);',
            re.M,
          )
          def replacement(match):
            indent = match.group("indent")
            return (
              f"{indent}const app = new Hono();\n"
              f"{indent}const effects = createNoteTransferEffectsRuntime(adapter, {{\n"
              f"{indent}  publishRealtime: async () => {{}},\n"
              f"{indent}  retryBaseSeconds: 0,\n"
              f"{indent}}});\n"
              f"{indent}app.route(\n"
              f"{indent}  \"/api/note-transfers\",\n"
              f"{indent}  createNoteTransfersRuntimeRouter(adapter, {{ effects }}),\n"
              f"{indent});"
            )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
            raise SystemExit("router setup pattern mismatch")
          path.write_text(text)
          PY
          git diff --check
      - name: Commit regression dependency
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/note-transfer-preview-runtime-pg.test.ts
          git commit -m "test(pg): inject transfer realtime publisher"
          git push origin HEAD:feat/pg-note-transfer-orchestration-20260805
