name: Normalize file manager video insert formatting

on:
  push:
    branches:
      - fix/v1.4.6-file-manager-video-inline

permissions:
  contents: write

jobs:
  format-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.4.6-file-manager-video-inline
          fetch-depth: 0

      - name: Normalize implementation formatting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/components/TiptapEditor.tsx")
          source = path.read_text()
          old = '''    const inlineImage = isInlineImageAttachment(item);
            const inlineVideo = !inlineImage && isInlineVideoAttachment(item);
            const chain = editor.chain().focus();
            if (inlineImage) {
              chain.setImage({
                src: item.url,
                alt: item.filename,
                title: item.filename,
              }).run();
            } else if (inlineVideo) {
              chain.setVideoFile({
                previewUrl: toInlineAttachmentUrl(item.url),
                url: item.url,
                attachmentId: item.id,
                filename: item.filename,
                mimeType: item.mimeType,
                size: item.size,
              }).run();
            } else {
              chain
                .insertContent(buildAttachmentLinkHtml(item.filename, item.url, item.size))
                .run();
            }

            closeAttachmentLibrary();
            toast.success(inlineImage
              ? t("tiptap.imageInsertedFromFileManager", { defaultValue: "图片已插入" })
              : inlineVideo
                ? t("tiptap.videoInsertedFromFileManager", { defaultValue: "视频已插入" })
                : t("tiptap.attachmentLinkInserted", { defaultValue: "附件链接已插入" }));'''
          # Previous workflow's YAML indentation was stripped by the runner, leaving
          # the implementation at two spaces. Match the actual checked-in variant too.
          actual = '''    const inlineImage = isInlineImageAttachment(item);
            const inlineVideo = !inlineImage && isInlineVideoAttachment(item);
            const chain = editor.chain().focus();'''
          if actual not in source:
              old = '''    const inlineImage = isInlineImageAttachment(item);
  const inlineVideo = !inlineImage && isInlineVideoAttachment(item);
  const chain = editor.chain().focus();
  if (inlineImage) {
    chain.setImage({
      src: item.url,
      alt: item.filename,
      title: item.filename,
    }).run();
  } else if (inlineVideo) {
    chain.setVideoFile({
      previewUrl: toInlineAttachmentUrl(item.url),
      url: item.url,
      attachmentId: item.id,
      filename: item.filename,
      mimeType: item.mimeType,
      size: item.size,
    }).run();
  } else {
    chain
      .insertContent(buildAttachmentLinkHtml(item.filename, item.url, item.size))
      .run();
  }

  closeAttachmentLibrary();
  toast.success(inlineImage
    ? t("tiptap.imageInsertedFromFileManager", { defaultValue: "图片已插入" })
    : inlineVideo
      ? t("tiptap.videoInsertedFromFileManager", { defaultValue: "视频已插入" })
      : t("tiptap.attachmentLinkInserted", { defaultValue: "附件链接已插入" }));'''
          new = '''    const inlineImage = isInlineImageAttachment(item);
    const inlineVideo = !inlineImage && isInlineVideoAttachment(item);
    const chain = editor.chain().focus();
    if (inlineImage) {
      chain.setImage({
        src: item.url,
        alt: item.filename,
        title: item.filename,
      }).run();
    } else if (inlineVideo) {
      chain.setVideoFile({
        previewUrl: toInlineAttachmentUrl(item.url),
        url: item.url,
        attachmentId: item.id,
        filename: item.filename,
        mimeType: item.mimeType,
        size: item.size,
      }).run();
    } else {
      chain
        .insertContent(buildAttachmentLinkHtml(item.filename, item.url, item.size))
        .run();
    }

    closeAttachmentLibrary();
    toast.success(inlineImage
      ? t("tiptap.imageInsertedFromFileManager", { defaultValue: "图片已插入" })
      : inlineVideo
        ? t("tiptap.videoInsertedFromFileManager", { defaultValue: "视频已插入" })
        : t("tiptap.attachmentLinkInserted", { defaultValue: "附件链接已插入" }));'''
          if source.count(old) != 1:
              raise SystemExit(f"format target count: {source.count(old)}")
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Verify formatting and commit
        shell: bash
        run: |
          grep -q '^    const inlineVideo' frontend/src/components/TiptapEditor.tsx
          git rm .github/workflows/tmp-file-manager-video-inline-format.yml
          git config user.name "Drug"
          git config user.email "cropflre2333@gmail.com"
          git add frontend/src/components/TiptapEditor.tsx
          git commit -m "style(editor): align inline video insertion"
          git push origin HEAD:fix/v1.4.6-file-manager-video-inline
