name: Apply Android UGREEN 302 Fix

on:
  push:
    branches: [fix/v1.4.6-android-ugreen-302]
    paths:
      - "scripts/apply-android-ugreen-302-fix.mjs"
      - ".github/workflows/tmp-apply-android-ugreen-302-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/v1.4.6-android-ugreen-302
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply fix
        run: node scripts/apply-android-ugreen-302-fix.mjs

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Run UGREEN and server URL regressions
        working-directory: frontend
        run: >-
          npm run test:run --
          src/lib/__tests__/ugreenRemoteAccess.test.ts
          src/lib/__tests__/ugreenAndroidLoginContract.test.ts
          src/lib/__tests__/serverUrl.test.ts

      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc -b

      - name: Frontend production build
        working-directory: frontend
        run: npx vite build

      - name: Remove temporary patch files
        run: |
          rm scripts/apply-android-ugreen-302-fix.mjs
          rm .github/workflows/tmp-apply-android-ugreen-302-fix.yml

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "fix(android): handle UGREEN remote gateway redirects"
          git push origin HEAD:fix/v1.4.6-android-ugreen-302
