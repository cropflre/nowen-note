name: Validate PostgreSQL tag write runtime

on:
  push:
    branches: [pg-validation-runtime-batch]
    paths:
      - ".github/workflows/pg-tags-write-fast.yml"

jobs:
  tags:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nowen
          POSTGRES_PASSWORD: nowen_ci_password
          POSTGRES_DB: nowen_note_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nowen -d nowen_note_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_PG_DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test
      DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test
      DB_DRIVER: postgres
      JWT_SECRET: pg-tags-write-test-secret-please-change
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pg-migration-unified
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run build:tsc -- --noEmit
      - name: PostgreSQL migrations
        run: node --import tsx --test --test-concurrency=1 tests/postgres-migrations.test.ts
      - name: Existing tag bootstrap regression
        run: node --import tsx --test --test-concurrency=1 tests/postgres-sync-bootstrap-surfaces-pg.test.ts
      - name: Tag write ACL/idempotency/concurrency lifecycle
        run: node --import tsx --test --test-concurrency=1 tests/tags-runtime-write-pg.test.ts
      - name: Build production bundle
        run: npm run build
