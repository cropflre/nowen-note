name: PostgreSQL Note Transfer Move Land 20260805

on:
  push:
    branches: [feat/pg-note-transfer-move-20260805]
    paths:
      - ".github/workflows/pg-note-transfer-move-land-20260805.yml"

permissions:
  contents: write

concurrency:
  group: pg-note-transfer-move-land-20260805
  cancel-in-progress: false

jobs:
  land:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pg-note-transfer-move-20260805
          fetch-depth: 0

      - name: Recreate validated business tree
        shell: bash
        run: |
          set -euo pipefail

          cat backend/scripts/.move-command-v3.py.gz.part-* > /tmp/implement-note-transfer-move.py.gz
          echo "1d8d63da9931a1022bafc8b0f212956662c0f7816be7061338ce40e1eb67ce1d  /tmp/implement-note-transfer-move.py.gz" | sha256sum --check
          gzip --test /tmp/implement-note-transfer-move.py.gz
          gzip --decompress --stdout /tmp/implement-note-transfer-move.py.gz > /tmp/implement-note-transfer-move.py
          echo "74cca103ac5bb334b54c332819b246327a535e4db660d3b1b018ccee88b6dd43  /tmp/implement-note-transfer-move.py" | sha256sum --check
          python3 -m py_compile /tmp/implement-note-transfer-move.py
          python3 /tmp/implement-note-transfer-move.py

          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("backend/tests/note-transfer-commit-runtime-pg.test.ts")
          text = path.read_text()
          pattern = re.compile(
              r'\s{4}await assert\.rejects\(\s*'
              r'runtime\.commit\(\{ actorUserId: ACTOR, idempotencyKey: "transfer-atomic-commit-move" \}\),\s*'
              r'\(error: any\) => error\?\.code === "NOTE_TRANSFER_MOVE_COMMIT_PENDING",\s*'
              r'\);\n'
          )
          replacement = '''    const moveCommit = await runtime.commit({
              actorUserId: ACTOR,
              idempotencyKey: "transfer-atomic-commit-move",
            });
            assert.equal(moveCommit.reused, false);
            assert.equal(moveCommit.operation.status, "target_committed");
            assert.equal(
              Number((await pool.query(`SELECT COUNT(*) AS count FROM notes WHERE id = $1`, [SOURCE_B])).rows[0].count),
              1,
            );
            assert.equal(
              Number((await pool.query(`SELECT COUNT(*) AS count FROM notes WHERE id = $1`, [moveCommit.result.targetNoteIds[SOURCE_B]])).rows[0].count),
              1,
            );
          '''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("move commit regression assertion pattern mismatch")
          path.write_text(text)
          PY

          cat backend/scripts/.knowledge-boundary.py.gz.part-* > /tmp/patch-knowledge-boundaries.py.gz
          echo "5e0846ade39a823e3a95dbe69058f44aa95bd4b3fb85279e05e6bc0c728a02d3  /tmp/patch-knowledge-boundaries.py.gz" | sha256sum --check
          gzip --test /tmp/patch-knowledge-boundaries.py.gz
          gzip --decompress --stdout /tmp/patch-knowledge-boundaries.py.gz > /tmp/patch-knowledge-boundaries.py
          echo "e747544c6904a4b74fc85a53c91fa6e84b5a9e00f736544707efd8f0e069fda5  /tmp/patch-knowledge-boundaries.py" | sha256sum --check
          python3 -m py_compile /tmp/patch-knowledge-boundaries.py
          python3 /tmp/patch-knowledge-boundaries.py

          python3 - <<'PY'
          from pathlib import Path
          path = Path("backend/src/middleware/knowledgeFilesCapabilityGuard.ts")
          text = path.read_text()
          bad = 'join("' + "\n" + '");'
          good = 'join("\\n");'
          if text.count(bad) != 1:
              raise SystemExit("knowledge files newline literal anchor mismatch")
          path.write_text(text.replace(bad, good, 1))
          PY

          test -f backend/src/db/postgres/migrations/0021_note_transfer_move_source_deletion.sql
          test -f backend/src/repositories/noteTransferMoveDeletionRepository.ts
          test -f backend/src/services/note-transfer-move-deletion-runtime.ts
          test -f backend/tests/note-transfer-move-deletion-runtime-pg.test.ts
          test -f .github/workflows/pg-note-transfer-move.yml

          cp .github/workflows/pg-note-transfer-move.yml backend/scripts/pg-note-transfer-move.workflow.yml
          rm -f .github/workflows/pg-note-transfer-move.yml
          rm -f backend/scripts/.move-command*.part-*
          rm -f backend/scripts/.knowledge-boundary*.part-*

      - name: Commit validated business changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(pg): add durable note transfer move deletion" \
            -m "Land the exact business tree validated by run 30969547949. The permanent workflow is staged as an ordinary file and will be installed through the GitHub connector because the Actions token cannot write workflow paths."
          git push origin HEAD:feat/pg-note-transfer-move-20260805
