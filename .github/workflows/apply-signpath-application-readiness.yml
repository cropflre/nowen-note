name: Apply SignPath Application Readiness

on:
  push:
    branches:
      - codex/github-signpath-windows-update-signing

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/github-signpath-windows-update-signing
          fetch-depth: 0

      - name: Apply targeted SignPath readiness patch
        run: python3 scripts/apply-signpath-readiness-patch.py

      - name: Verify targeted patch
        shell: bash
        run: |
          set -euo pipefail
          grep -n "SIGNPATH_FULL_ARTIFACT_CONFIGURATION_SLUG" .github/workflows/release.yml
          grep -n "SIGNPATH_LITE_ARTIFACT_CONFIGURATION_SLUG" .github/workflows/release.yml
          grep -n "toJSON(steps.package_version.outputs.version)" .github/workflows/release.yml
          grep -n "Ensure Release code signing policy" .github/workflows/release.yml
          node -e "require('js-yaml').load(require('fs').readFileSync('.github/workflows/release.yml','utf8')); console.log('release.yml ok')"
          git diff --check

      - name: Commit patch and remove helper files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(signpath): 强化申请就绪发布约束"
          git push origin HEAD:codex/github-signpath-windows-update-signing
