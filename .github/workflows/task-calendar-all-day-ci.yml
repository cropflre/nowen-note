name: Task Calendar and All-Day CI

on:
  pull_request:
    paths:
      - backend/src/routes/task-calendar.ts
      - backend/tests/task-calendar.test.ts
      - frontend/src/components/tasks/TaskDetailPanel.tsx
      - frontend/src/components/tasks/taskDateUtils.ts
      - frontend/src/components/tasks/__tests__/taskDueTimeUtils.test.ts
      - frontend/src/components/tasks/__tests__/taskAllDayContract.test.ts
      - frontend/src/i18n/locales/en.json
      - frontend/src/i18n/locales/zh-CN.json
      - .github/workflows/task-calendar-all-day-ci.yml
  push:
    branches:
      - main
    paths:
      - backend/src/routes/task-calendar.ts
      - backend/tests/task-calendar.test.ts
      - frontend/src/components/tasks/TaskDetailPanel.tsx
      - frontend/src/components/tasks/taskDateUtils.ts
      - frontend/src/components/tasks/__tests__/taskDueTimeUtils.test.ts
      - frontend/src/components/tasks/__tests__/taskAllDayContract.test.ts
      - frontend/src/i18n/locales/en.json
      - frontend/src/i18n/locales/zh-CN.json
      - .github/workflows/task-calendar-all-day-ci.yml

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR merge commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Calendar ICS regression
        working-directory: backend
        run: node --import tsx --import ./tests/setup-db-isolation.ts --test tests/task-calendar.test.ts

      - name: Backend typecheck
        working-directory: backend
        run: npm run build:tsc

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR merge commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Task all-day regressions
        working-directory: frontend
        run: npx vitest run src/components/tasks/__tests__/taskDueTimeUtils.test.ts src/components/tasks/__tests__/taskAllDayContract.test.ts

      - name: Frontend production build
        working-directory: frontend
        run: npm run build
