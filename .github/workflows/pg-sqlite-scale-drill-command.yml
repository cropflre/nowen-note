name: PostgreSQL SQLite Scale Drill Command

on:
  push:
    branches: [feat/pg-sqlite-scale-drill-20260806]

concurrency:
  group: pg-sqlite-scale-drill-command-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nowen
          POSTGRES_PASSWORD: nowen_ci_password
          POSTGRES_DB: nowen_note_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nowen -d nowen_note_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_PG_DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test
      DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: TypeScript and database boundaries
        working-directory: backend
        run: |
          npm run build:tsc -- --noEmit
          npm run audit:sqlite-boundaries
          npm run audit:pg-schema-parity
      - name: PostgreSQL migration and drill regressions
        working-directory: backend
        run: >-
          node --import tsx --test --test-concurrency=1
          tests/postgres-migrations.test.ts
          tests/sqlite-postgres-migration-runtime-pg.test.ts
          tests/sqlite-postgres-rollback-runtime-pg.test.ts
          tests/sqlite-postgres-nonempty-recovery-runtime-pg.test.ts
          tests/sqlite-postgres-scale-drill-runtime-pg.test.ts
      - name: CLI contracts
        working-directory: backend
        run: |
          npm run migrate:sqlite-to-postgres -- --help
          npm run migrate:sqlite-to-postgres:drill -- --help
      - name: Production bundle
        working-directory: backend
        run: npm run build
