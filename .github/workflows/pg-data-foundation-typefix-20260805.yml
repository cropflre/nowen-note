name: PG data foundation typefix

on:
  push:
    branches:
      - feat/pg-sqlite-migration-foundation-20260805
    paths:
      - ".github/workflows/pg-data-foundation-typefix-20260805.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pg-sqlite-migration-foundation-20260805
          fetch-depth: 0
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("backend/src/repositories/sqlitePostgresMigrationRepository.ts")
          source = path.read_text(encoding="utf-8")
          before = ') as SqlitePostgresMigrationSnapshot["progress"];'
          after = ') as unknown as SqlitePostgresMigrationSnapshot["progress"];'
          if before in source:
              path.write_text(source.replace(before, after, 1), encoding="utf-8")
          PY
          if git diff --quiet -- backend/src/repositories/sqlitePostgresMigrationRepository.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/repositories/sqlitePostgresMigrationRepository.ts
          git commit -m "fix(pg): narrow migration progress mapping"
          git push origin HEAD:feat/pg-sqlite-migration-foundation-20260805
