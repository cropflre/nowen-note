name: PostgreSQL schema parity focus

on:
  push:
    branches: [pg-migration-unified]
    paths:
      - ".github/workflows/pg-schema-parity-focus.yml"

permissions:
  contents: write

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pg-migration-unified
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: PostgreSQL schema parity
        working-directory: backend
        run: npm run audit:pg-schema-parity
      - name: Remove temporary parity workflow
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pg-schema-parity-focus.yml
          git commit -m "ci(pg): remove schema parity focus"
          git push origin HEAD:pg-migration-unified
