name: PostgreSQL Note Transfer Preview

on:
  push:
    branches: [pg-migration-unified]
    paths:
      - "backend/src/db/**"
      - "backend/src/index.postgres-runtime.ts"
      - "backend/src/repositories/knowledgeTreeNodeAccessRepository.ts"
      - "backend/src/repositories/knowledgeTreePermissionMutationRepository.ts"
      - "backend/src/repositories/noteTransferPreviewRepository.ts"
      - "backend/src/routes/note-transfers-runtime.ts"
      - "backend/src/services/attachment-storage-runtime.ts"
      - "backend/src/services/note-transfer-preview-runtime.ts"
      - "backend/tests/knowledge-tree-surfaces-runtime-pg.test.ts"
      - "backend/tests/note-transfer-preview-runtime-pg.test.ts"
      - "backend/tests/helpers/pg-test-db.ts"
      - "backend/scripts/check-direct-db-access-baseline.mjs"
      - "backend/scripts/check-pg-schema-parity.mjs"
      - "backend/scripts/direct-db-access-*.json"
      - ".github/workflows/pg-note-transfer-preview.yml"
  pull_request:
    paths:
      - "backend/src/db/**"
      - "backend/src/index.postgres-runtime.ts"
      - "backend/src/repositories/knowledgeTreeNodeAccessRepository.ts"
      - "backend/src/repositories/knowledgeTreePermissionMutationRepository.ts"
      - "backend/src/repositories/noteTransferPreviewRepository.ts"
      - "backend/src/routes/note-transfers-runtime.ts"
      - "backend/src/services/attachment-storage-runtime.ts"
      - "backend/src/services/note-transfer-preview-runtime.ts"
      - "backend/tests/knowledge-tree-surfaces-runtime-pg.test.ts"
      - "backend/tests/note-transfer-preview-runtime-pg.test.ts"
      - "backend/tests/helpers/pg-test-db.ts"
      - "backend/scripts/check-direct-db-access-baseline.mjs"
      - "backend/scripts/check-pg-schema-parity.mjs"
      - "backend/scripts/direct-db-access-*.json"
      - ".github/workflows/pg-note-transfer-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pg-note-transfer-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nowen
          POSTGRES_PASSWORD: nowen_ci_password
          POSTGRES_DB: nowen_note_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nowen -d nowen_note_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_PG_DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test
      DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        working-directory: backend
        run: npm run build:tsc -- --noEmit

      - name: SQLite direct-access guard
        working-directory: backend
        run: npm run audit:sqlite-boundaries

      - name: PostgreSQL schema parity
        working-directory: backend
        run: npm run audit:pg-schema-parity

      - name: Real PostgreSQL knowledge-tree and note-transfer preview
        working-directory: backend
        run: >-
          node --import tsx --test --test-concurrency=1
          tests/postgres-migrations.test.ts
          tests/knowledge-tree-surfaces-runtime-pg.test.ts
          tests/note-transfer-preview-runtime-pg.test.ts

      - name: Production backend bundle
        working-directory: backend
        run: |
          npm run build
          test -f dist/postgres/migrations/0015_knowledge_tree_read_runtime.sql
