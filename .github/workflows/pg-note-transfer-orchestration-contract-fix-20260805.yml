name: PostgreSQL Note Transfer Orchestration Contract Fix 20260805

on:
  push:
    branches: [feat/pg-note-transfer-orchestration-20260805]
    paths:
      - ".github/workflows/pg-note-transfer-orchestration-contract-fix-20260805.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pg-note-transfer-orchestration-20260805
          fetch-depth: 0
      - name: Stabilize asynchronous submit contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          runtime = Path("backend/src/services/note-transfer-orchestration-runtime.ts")
          runtime_text = runtime.read_text()
          old_runtime = '''      wake();
                return {
                  accepted: prepared.accepted,
                  reused: !prepared.accepted || operation.reused,
                  snapshot: await snapshot(input),
                };'''
          new_runtime = '''      const submittedSnapshot = await snapshot(input);
                wake();
                return {
                  accepted: prepared.accepted,
                  reused: !prepared.accepted || operation.reused,
                  snapshot: submittedSnapshot,
                };'''
          if runtime_text.count(old_runtime) != 1:
            raise SystemExit("submit snapshot anchor mismatch")
          runtime.write_text(runtime_text.replace(old_runtime, new_runtime, 1))

          test = Path("backend/tests/note-transfer-preview-runtime-pg.test.ts")
          test_text = test.read_text()
          pattern = re.compile(
            r'    const execution = await request\("", ACTOR, \{\s*'
            r'sourceNoteIds: \[SOURCE_NOTE_A\],\s*'
            r'targetWorkspaceId: ACTOR_WORKSPACE,\s*'
            r'targetNotebookId: ACTOR_TARGET,\s*'
            r'mode: "copy",\s*'
            r'\}, 503\);\s*'
            r'assert\.equal\(execution\.code, "POSTGRES_NOTE_TRANSFER_EXECUTION_PENDING"\);\s*'
            r'assert\.equal\(execution\.issue, 249\);'
          )
          replacement = '''    const executionKey = "transfer-unified-execution-001";
            const execution = await request("", ACTOR, {
              sourceNoteIds: [SOURCE_NOTE_A],
              targetWorkspaceId: ACTOR_WORKSPACE,
              targetNotebookId: ACTOR_TARGET,
              mode: "copy",
              includeAttachments: false,
              includeTags: true,
              expectedVersions: { [SOURCE_NOTE_A]: 4 },
              idempotencyKey: executionKey,
            }, 202);
            assert.equal(execution.accepted, true);
            assert.equal(execution.reused, false);
            assert.equal(execution.snapshot.phase, "staging");
            assert.equal(execution.snapshot.terminal, false);

            let executionStatus = execution.snapshot;
            for (let attempt = 0; attempt < 100 && !executionStatus.terminal; attempt += 1) {
              await new Promise((resolve) => setTimeout(resolve, 20));
              executionStatus = await responseJson<Record<string, any>>(
                await app.request(
                  `/api/note-transfers/operations/${encodeURIComponent(executionKey)}`,
                  { headers: { "X-User-Id": ACTOR } },
                ),
                200,
              );
            }
            assert.equal(executionStatus.terminal, true);
            assert.equal(executionStatus.phase, "completed");'''
          test_text, count = pattern.subn(replacement, test_text, count=1)
          if count != 1:
            raise SystemExit("unified execution test pattern mismatch")
          test.write_text(test_text)
          PY
          git diff --check
      - name: Commit contract fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/services/note-transfer-orchestration-runtime.ts backend/tests/note-transfer-preview-runtime-pg.test.ts
          git commit -m "test(pg): validate unified transfer execution contract"
          git push origin HEAD:feat/pg-note-transfer-orchestration-20260805
