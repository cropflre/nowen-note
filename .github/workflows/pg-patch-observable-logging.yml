name: Patch observable PostgreSQL merge logging

on:
  pull_request:
    branches: [pg-migration-unified]
    types: [opened, reopened, synchronize]
    paths:
      - "backend/.pg-observable-log-patch-trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pg-migration-unified
          fetch-depth: 0

      - name: Persist merge-step diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/pg-merge-main-observable.yml')
          source = path.read_text()
          old = '''      - name: Merge latest main and preserve verified PG implementations
        id: merge
        shell: bash
        run: |
          set -euo pipefail
'''
          new = '''      - name: Merge latest main and preserve verified PG implementations
        id: merge
        shell: bash
        run: |
          exec > >(tee /tmp/pg-observable-main-merge.log) 2>&1
          set -euo pipefail
'''
          if old not in source:
              raise SystemExit('observable merge step pattern not found')
          path.write_text(source.replace(old, new, 1))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pg-merge-main-observable.yml
          git rm .github/workflows/pg-patch-observable-logging.yml
          git commit -m "ci(postgres): persist observable merge diagnostics"
          git push origin HEAD:pg-migration-unified
