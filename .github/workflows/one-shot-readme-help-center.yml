name: One-shot README help center link

on:
  push:
    branches:
      - docs/help-center-link

permissions:
  contents: write

jobs:
  update-readmes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: docs/help-center-link

      - name: Replace legacy nowen.cn docs links
        shell: python
        run: |
          from pathlib import Path

          path = Path('README.en.md')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '- [Feature documentation](http://nowen.cn/docs/nowen-note-features)\n',
                  '- [Feature overview](https://cropflre.github.io/#/note)\n',
              ),
              (
                  '- [Installation and troubleshooting](http://nowen.cn/docs/nowen-note-help)\n',
                  '- [Installation and troubleshooting](https://cropflre.github.io/#/note/faq)\n',
              ),
              (
                  '- [API documentation](http://nowen.cn/docs/nowen-note-api)\n',
                  '- [API documentation](https://cropflre.github.io/#/note/api)\n',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected text not found: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.en.md
          git commit -m "docs: 替换英文 README 旧官网文档链接"
          git push origin HEAD:docs/help-center-link
