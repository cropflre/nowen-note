name: Sync Conflict Center Regression CI

on:
  push:
    branches: ["release/v1.5.2"]
    paths:
      - "frontend/src/components/settings/ConflictCenter.tsx"
      - "frontend/src/lib/syncTreeConflictPresentation.ts"
      - "frontend/src/components/__tests__/ConflictCenterBulkResolve.test.tsx"
      - ".github/workflows/conflict-center-ci.yml"
  pull_request:
    paths:
      - "frontend/src/components/settings/ConflictCenter.tsx"
      - "frontend/src/lib/syncTreeConflictPresentation.ts"
      - "frontend/src/components/__tests__/ConflictCenterBulkResolve.test.tsx"
      - ".github/workflows/conflict-center-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conflict-center:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --silent
      - name: Conflict center regressions
        run: npx vitest run src/components/__tests__/ConflictCenterBulkResolve.test.tsx --reporter=verbose
      - name: Typecheck
        run: npx tsc -b --pretty false
