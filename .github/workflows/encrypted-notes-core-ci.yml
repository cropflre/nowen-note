permissions:
  contents: read

jobs:
  crypto:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Newer 24.x headers can abort ObjectWrap GC (nodejs/node#65446).
          # Keep runtime AND clean-install addon headers on the verified version.
          node-version: "24.18.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Backend fixture dependencies
        run: npm ci
        working-directory: backend
      - name: SQLite persistence, backup and old-writer regressions
        run: node --import tsx --import ./tests/setup-db-isolation.ts --test tests/encrypted-notes-blocks.test.ts tests/encrypted-notes-block-writers.test.ts tests/encrypted-notes-storage.test.ts tests/encrypted-notes-sync.test.ts tests/encrypted-notes-backup.test.ts tests/sync-v2-bootstrap.test.ts tests/sync-v2-engine.test.ts tests/sync-v2-conflict-history-route.test.ts tests/backup-restore-integrity.test.ts tests/backup-restore-large-archive.test.ts tests/backup-restore-corrupt-hotfix.test.ts
        working-directory: backend
      - name: Backend typecheck
        run: npx tsc --noEmit --pretty false
        working-directory: backend
      - name: Storage, Sync and recovery fixture typecheck
        run: npx tsc --noEmit --pretty false --target ES2022 --module ESNext --moduleResolution bundler --esModuleInterop --skipLibCheck --strict tests/encrypted-notes-sync.test.ts tests/encrypted-notes-backup.test.ts tests/encrypted-notes-recovery-worker.ts tests/encrypted-notes-block-writers.test.ts tests/encrypted-notes-postgres.test.ts tests/encrypted-notes-app-server.ts src/types/word-extractor.d.ts
        working-directory: backend
      - name: Crypto core and Worker lifecycle regressions
        run: npm run test:encrypted-notes
      - name: Native locking bridge syntax
        run: node --check ../electron/encrypted-notes-auto-lock.js && node --check ../scripts/encrypted-notes-electron-fixture.cjs && node --check ../scripts/encrypted-notes-app-fixture.cjs && node --check ../scripts/encrypted-notes-backend-fixture.cjs && node --check ../scripts/encrypted-notes-package-fixture.cjs && node --check ../scripts/encrypted-notes-full-acceptance.mjs && node --check ../electron/main.js && node --check ../electron/preload.js
      - name: Ordinary and encrypted cache/conflict regressions
        run: npx vitest run src/lib/__tests__/conflictResolution.test.ts src/lib/__tests__/noteLoadSource.test.ts src/lib/__tests__/syncConflictAutoMerge.test.ts src/components/__tests__/ConflictCenterBulkResolve.test.tsx src/store/__tests__/encryptedRegionNavigation.test.tsx src/lib/__tests__/noteContentPersistence.test.ts src/lib/__tests__/contentFormat.test.ts
      - name: Application typecheck
        run: npx tsc -b --pretty false
      - name: Benchmark and browser test typecheck
        run: npx tsc --project tsconfig.encrypted-notes.json --pretty false
      - run: npx playwright install --with-deps chromium
      - name: Bundled Worker, Web Crypto and WASM under CSP
        run: npm run test:encrypted-notes:browser

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-fixture-password
          POSTGRES_DB: encrypted_notes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d encrypted_notes_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: PostgreSQL encrypted storage guards
        run: node --import tsx --test tests/encrypted-notes-postgres.test.ts
        working-directory: backend
        env:
          TEST_PG_DATABASE_URL: postgres://test:test-only-fixture-password@127.0.0.1:5432/encrypted_notes_test
