name: MiCloud Import CI

on:
  pull_request:
    paths:
      - "frontend/src/components/MiCloudImport.tsx"
      - "frontend/src/lib/miNoteService.ts"
      - "frontend/src/lib/__tests__/miNoteService.test.ts"
      - "backend/src/index.hardened.ts"
      - "backend/src/runtime/micloud-import-hardening.ts"
      - "backend/src/runtime/micloud-import-jobs.ts"
      - "backend/src/routes/micloud.ts"
      - "backend/tests/micloud-import-hardening.test.ts"
      - "backend/tests/micloud-import-jobs.test.ts"
      - ".github/workflows/micloud-import-ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend/src/components/MiCloudImport.tsx"
      - "frontend/src/lib/miNoteService.ts"
      - "frontend/src/lib/__tests__/miNoteService.test.ts"
      - "backend/src/index.hardened.ts"
      - "backend/src/runtime/micloud-import-hardening.ts"
      - "backend/src/runtime/micloud-import-jobs.ts"
      - "backend/src/routes/micloud.ts"
      - "backend/tests/micloud-import-hardening.test.ts"
      - "backend/tests/micloud-import-jobs.test.ts"
      - ".github/workflows/micloud-import-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: MiCloud legacy import regression tests
        run: node --import tsx --import ./tests/setup-db-isolation.ts --test tests/micloud-import-hardening.test.ts
      - name: MiCloud background job regression tests
        run: node --import tsx --import ./tests/setup-db-isolation.ts --test tests/micloud-import-jobs.test.ts
      - name: Backend typecheck
        if: always()
        run: npm run build:tsc

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: MiCloud import regression tests
        run: npm run test:run -- src/lib/__tests__/miNoteService.test.ts
      - name: Frontend typecheck
        if: always()
        run: npx tsc -b
