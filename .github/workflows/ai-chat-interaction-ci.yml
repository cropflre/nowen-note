name: AI Chat Interaction CI

on:
  push:
    branches:
      - main
      - fix/ai-chat-issue-568
    paths:
      - "frontend/src/components/AIChatPanel.tsx"
      - "frontend/src/components/AIChatReliabilityShell.tsx"
      - "frontend/src/components/ui/scroll-area.tsx"
      - "frontend/src/lib/abortableAiAsk.ts"
      - "frontend/src/lib/__tests__/abortableAiAsk.test.ts"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/ai-chat-interaction-ci.yml"
  pull_request:
    paths:
      - "frontend/src/components/AIChatPanel.tsx"
      - "frontend/src/components/AIChatReliabilityShell.tsx"
      - "frontend/src/components/ui/scroll-area.tsx"
      - "frontend/src/lib/abortableAiAsk.ts"
      - "frontend/src/lib/__tests__/abortableAiAsk.test.ts"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/ai-chat-interaction-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Frontend typecheck
        run: npx tsc -b --pretty false
      - name: Abortable AI request tests
        run: npm run test:run -- src/lib/__tests__/abortableAiAsk.test.ts
