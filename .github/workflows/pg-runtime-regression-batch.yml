name: Reconcile runtime regression batch

on:
  push:
    branches: [pg-migration-unified]
    paths:
      - ".github/workflows/pg-runtime-regression-batch.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pg-migration-unified
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Canonicalize Tiptap blocks and repair search fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          blocks = Path("backend/src/lib/noteBlocks.ts")
          text = blocks.read_text()
          old = '''  visit(doc.content, null, []);\n  return {\n    normalizedContent: changed ? JSON.stringify(doc) : content,\n    candidates,\n    changed,\n  };'''
          new = '''  visit(doc.content, null, []);\n  // Block Authority materializes Tiptap documents with JSON.stringify(). Canonicalize\n  // every valid Tiptap document here as well so harmless JSON whitespace/formatting\n  // cannot create a permanent byte-level authority hash mismatch.\n  const normalizedContent = JSON.stringify(doc);\n  return {\n    normalizedContent,\n    candidates,\n    changed: changed || normalizedContent !== content,\n  };'''
          if old not in text:
              raise SystemExit("Tiptap normalization block not found")
          blocks.write_text(text.replace(old, new, 1))

          test_path = Path("backend/tests/knowledge-tree-query-limits.test.ts")
          text = test_path.read_text()
          old = '''  db.prepare("UPDATE notes SET contentText = ?, updatedAt = ? WHERE id = ?")\n    .run("limitneedle", "2020-01-01 00:00:00", visibleNote.resourceId);'''
          new = '''  db.prepare("UPDATE notes SET content = ?, contentText = ?, contentFormat = 'markdown', updatedAt = ? WHERE id = ?")\n    .run("limitneedle", "limitneedle", "2020-01-01 00:00:00", visibleNote.resourceId);'''
          if old not in text:
              raise SystemExit("visible search fixture block not found")
          text = text.replace(old, new, 1)

          old = '''    db.prepare("UPDATE notes SET contentText = ?, updatedAt = ? WHERE id = ?")\n      .run(\n        `${"limitneedle ".repeat(12)}hidden ${index}`,\n        `2026-08-04 12:${String(index % 60).padStart(2, "0")}:${String(index % 60).padStart(2, "0")}`,\n        note.resourceId,\n      );'''
          new = '''    const hiddenContent = `${"limitneedle ".repeat(12)}hidden ${index}`;\n    db.prepare("UPDATE notes SET content = ?, contentText = ?, contentFormat = 'markdown', updatedAt = ? WHERE id = ?")\n      .run(\n        hiddenContent,\n        hiddenContent,\n        `2026-08-04 12:${String(index % 60).padStart(2, "0")}:${String(index % 60).padStart(2, "0")}`,\n        note.resourceId,\n      );'''
          if old not in text:
              raise SystemExit("hidden search fixture block not found")
          test_path.write_text(text.replace(old, new, 1))
          PY
      - name: TypeScript and targeted regressions
        working-directory: backend
        run: |
          npm run build:tsc -- --noEmit
          node --import tsx --test --test-concurrency=1 \
            tests/block-authority-store.test.ts \
            tests/knowledge-tree-query-limits.test.ts
      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pg-runtime-regression-batch.yml
          git add backend/src/lib/noteBlocks.ts backend/tests/knowledge-tree-query-limits.test.ts
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(sqlite): canonicalize block content and search fixtures"
          git push origin HEAD:pg-migration-unified
