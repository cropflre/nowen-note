name: Issue 612 Data Protection CI

on:
  push:
    branches: [main]
    paths:
      - "backend/src/services/realtime.ts"
      - "backend/src/services/yjs.ts"
      - "backend/src/services/yjsDurability.ts"
      - "backend/tests/yjs-durability.test.ts"
      - "frontend/src/hooks/useYDoc.ts"
      - "frontend/src/lib/realtime.ts"
      - "frontend/src/lib/yjsProvider.ts"
      - "frontend/src/lib/yjsDurability.ts"
      - "frontend/src/lib/draftStorage.ts"
      - "frontend/src/lib/__tests__/yjsDurability.test.ts"
      - "frontend/src/lib/__tests__/draftStorage.conflict.test.ts"
      - ".github/workflows/issue-612-data-protection-ci.yml"
  pull_request:
    paths:
      - "backend/src/services/realtime.ts"
      - "backend/src/services/yjs.ts"
      - "backend/src/services/yjsDurability.ts"
      - "backend/tests/yjs-durability.test.ts"
      - "frontend/src/hooks/useYDoc.ts"
      - "frontend/src/lib/realtime.ts"
      - "frontend/src/lib/yjsProvider.ts"
      - "frontend/src/lib/yjsDurability.ts"
      - "frontend/src/lib/draftStorage.ts"
      - "frontend/src/lib/__tests__/yjsDurability.test.ts"
      - "frontend/src/lib/__tests__/draftStorage.conflict.test.ts"
      - ".github/workflows/issue-612-data-protection-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Yjs durability regression tests
        run: node --import tsx --import ./tests/setup-db-isolation.ts --test tests/yjs-durability.test.ts
      - name: Backend typecheck
        if: always()
        run: npm run build:tsc

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Yjs durability and draft recovery regressions
        run: >-
          npm run test:run --
          src/lib/__tests__/yjsDurability.test.ts
          src/lib/__tests__/draftStorage.conflict.test.ts
      - name: Frontend typecheck
        if: always()
        run: npx tsc -b
