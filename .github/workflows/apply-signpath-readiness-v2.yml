name: Apply SignPath Readiness V2

on:
  push:
    branches:
      - codex/github-signpath-windows-update-signing

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/github-signpath-windows-update-signing
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply-signpath-readiness-patch.py
      - name: Verify generated files
        shell: bash
        run: |
          set -euo pipefail
          grep -n "SIGNPATH_FULL_ARTIFACT_CONFIGURATION_SLUG" .github/workflows/release.yml
          grep -n "SIGNPATH_LITE_ARTIFACT_CONFIGURATION_SLUG" .github/workflows/release.yml
          grep -n "Ensure Release code signing policy" .github/workflows/release.yml
          grep -n "toJSON(steps.package_version.outputs.version)" .github/workflows/release.yml
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-signpath-readiness-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(signpath): 强化申请就绪发布约束"
          git push origin HEAD:codex/github-signpath-windows-update-signing
