name: Editor Layout CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/v1.5.0
    paths:
      - "frontend/src/components/TiptapEditor.tsx"
      - "frontend/src/components/FontSizeExtension.ts"
      - "frontend/src/components/extensions/RichTextLayoutExtensions.ts"
      - "frontend/src/index.css"
      - "frontend/src/lib/tiptapBlockPatchNode.ts"
      - "frontend/src/lib/__tests__/richTextLayoutExtensions.test.ts"
      - "frontend/src/lib/__tests__/tiptapBlockPatchLayoutAttrs.test.ts"
      - "frontend/src/components/__tests__/EditorLayoutUxGuard.test.ts"
      - "backend/src/lib/tiptapBlockPatchNode.ts"
      - "backend/tests/tiptap-block-patch-v2.test.ts"
      - ".github/workflows/editor-layout-ci.yml"
  pull_request:
    paths:
      - "frontend/src/components/TiptapEditor.tsx"
      - "frontend/src/components/FontSizeExtension.ts"
      - "frontend/src/components/extensions/RichTextLayoutExtensions.ts"
      - "frontend/src/index.css"
      - "frontend/src/lib/tiptapBlockPatchNode.ts"
      - "frontend/src/lib/__tests__/richTextLayoutExtensions.test.ts"
      - "frontend/src/lib/__tests__/tiptapBlockPatchLayoutAttrs.test.ts"
      - "frontend/src/components/__tests__/EditorLayoutUxGuard.test.ts"
      - "backend/src/lib/tiptapBlockPatchNode.ts"
      - "backend/tests/tiptap-block-patch-v2.test.ts"
      - ".github/workflows/editor-layout-ci.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Paragraph and table layout regression tests
        run: >-
          npm run test:run --
          src/lib/__tests__/richTextLayoutExtensions.test.ts
          src/lib/__tests__/tiptapBlockPatchLayoutAttrs.test.ts
          src/components/__tests__/EditorLayoutUxGuard.test.ts
          src/lib/__tests__/tiptapSchemaRepair.test.ts
          src/lib/__tests__/tableFidelityExtensions.test.ts
      - name: Frontend typecheck
        run: npx tsc -b

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Block patch layout regression
        run: node --import tsx --test tests/tiptap-block-patch-v2.test.ts
      - name: Backend typecheck
        run: npm run build:tsc
