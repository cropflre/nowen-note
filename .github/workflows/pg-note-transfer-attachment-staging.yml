name: PostgreSQL Note Transfer Attachment Staging

on:
  push:
    branches:
      - pg-migration-unified
    paths:
      - "backend/src/db/postgres/migrations/**"
      - "backend/src/repositories/noteTransferOperationRepository.ts"
      - "backend/src/routes/note-transfers-runtime.ts"
      - "backend/src/services/attachment-storage-runtime.ts"
      - "backend/src/services/note-transfer-attachment-staging-runtime.ts"
      - "backend/src/services/note-transfer-preview-runtime.ts"
      - "backend/src/index.postgres-runtime.ts"
      - "backend/tests/note-transfer-preview-runtime-pg.test.ts"
      - "backend/tests/note-transfer-attachment-staging-runtime-pg.test.ts"
      - "backend/tests/postgres-migrations.test.ts"
      - "backend/build.bundle.mjs"
      - ".github/workflows/pg-note-transfer-attachment-staging.yml"
  pull_request:
    paths:
      - "backend/src/db/postgres/migrations/**"
      - "backend/src/repositories/noteTransferOperationRepository.ts"
      - "backend/src/routes/note-transfers-runtime.ts"
      - "backend/src/services/attachment-storage-runtime.ts"
      - "backend/src/services/note-transfer-attachment-staging-runtime.ts"
      - "backend/src/services/note-transfer-preview-runtime.ts"
      - "backend/src/index.postgres-runtime.ts"
      - "backend/tests/note-transfer-preview-runtime-pg.test.ts"
      - "backend/tests/note-transfer-attachment-staging-runtime-pg.test.ts"
      - "backend/tests/postgres-migrations.test.ts"
      - "backend/build.bundle.mjs"
      - ".github/workflows/pg-note-transfer-attachment-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attachment-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nowen
          POSTGRES_PASSWORD: nowen_ci_password
          POSTGRES_DB: nowen_note_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nowen -d nowen_note_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_PG_DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test
      DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: TypeScript and database boundary checks
        working-directory: backend
        run: |
          npm run build:tsc -- --noEmit
          npm run audit:sqlite-boundaries
          npm run audit:pg-schema-parity

      - name: Real PostgreSQL staging regressions
        working-directory: backend
        run: >-
          node --import tsx --test --test-concurrency=1
          tests/postgres-migrations.test.ts
          tests/note-transfer-preview-runtime-pg.test.ts
          tests/note-transfer-attachment-staging-runtime-pg.test.ts

      - name: Production bundle
        working-directory: backend
        run: |
          npm run build
          test -f dist/postgres/migrations/0016_note_transfer_operations.sql
          test -f dist/postgres/migrations/0017_note_transfer_staging_manifest.sql
          test -f dist/postgres/migrations/0018_note_transfer_attachment_staging_runtime.sql
