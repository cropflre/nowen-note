name: Issue 790 mind map embed integration

on:
  push:
    branches: ["release/v1.5.0"]
    paths:
      - "scripts/apply-issue-790.mjs"
      - ".github/workflows/mindmap-embed-implementation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-790-implementation
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply exact source-anchored integration
        run: node scripts/apply-issue-790.mjs
      - name: Check patch whitespace
        run: git diff --check
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Native embed and legacy link regression
        working-directory: frontend
        run: npx vitest run src/lib/__tests__/mindMapEmbed.test.ts src/lib/__tests__/noteLinkSyntax.test.ts --reporter=verbose
      - name: Frontend production build
        working-directory: frontend
        run: npm run build
      - name: Commit reviewed integration only after successful tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/MarkdownPreview.tsx frontend/src/components/EditorPane.tsx frontend/src/lib/contentFormat.ts
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "feat(editor): integrate native mind map embeds in Markdown and notes (#790)"
          git push origin HEAD:release/v1.5.0
