name: Shared Knowledge Tree CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/src/routes/knowledge-tree.ts'
      - 'backend/src/services/knowledgeCapabilitiesCore.ts'
      - 'backend/src/services/knowledgeCapabilitiesResolver.ts'
      - 'backend/src/services/knowledgeTree.ts'
      - 'backend/src/services/knowledgeTreeCore.ts'
      - 'backend/src/services/sharedKnowledgeTreeListing.ts'
      - 'backend/tests/shared-knowledge-tree.test.ts'
      - 'backend/tests/knowledge-tree.test.ts'
      - 'frontend/src/components/KnowledgeTreePanel.tsx'
      - 'frontend/src/lib/knowledgeTreeApi.ts'
      - 'frontend/src/lib/sharedKnowledgeTree.ts'
      - 'frontend/src/lib/__tests__/sharedKnowledgeTree.test.ts'
      - 'frontend/src/lib/__tests__/knowledgeTree*.test.ts'
      - 'scripts/patch_issue462_shared_tree.py'
      - '.github/workflows/shared-knowledge-tree-ci.yml'

permissions:
  contents: write

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out pull request branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${HEAD_REF}"
          git checkout -q -B "${HEAD_REF}" FETCH_HEAD

      - name: Apply controlled shared-tree patch
        shell: bash
        run: |
          if [ -f scripts/patch_issue462_shared_tree.py ]; then
            python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/patch_issue462_shared_tree.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  "'''           draggable={node.access.capabilities.canMove}\n",
                  "'''          draggable={node.access.capabilities.canMove}\n",
              ),
              (
                  "'''             {node.access.source === \"inherited\"",
                  "'''            {node.access.source === \"inherited\"",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'controlled script anchor changed: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
            python3 scripts/patch_issue462_shared_tree.py
            rm scripts/patch_issue462_shared_tree.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              backend/src/routes/knowledge-tree.ts \
              backend/src/services/knowledgeCapabilitiesCore.ts \
              backend/src/services/knowledgeCapabilitiesResolver.ts \
              backend/src/services/knowledgeTreeCore.ts \
              frontend/src/components/KnowledgeTreePanel.tsx \
              frontend/src/lib/knowledgeTreeApi.ts \
              scripts/patch_issue462_shared_tree.py
            if ! git diff --cached --quiet; then
              git commit -m "feat(knowledge-tree): integrate shared roots in the unified tree"
              git push origin HEAD:${{ github.event.pull_request.head.ref }}
            fi
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --silent

      - name: Shared knowledge-tree backend tests
        working-directory: backend
        run: |
          node --import tsx --test tests/shared-knowledge-tree.test.ts
          node --import tsx --import ./tests/setup-db-isolation.ts --test tests/knowledge-tree.test.ts

      - name: Backend typecheck
        working-directory: backend
        run: npm run build:tsc

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --silent

      - name: Shared knowledge-tree frontend tests
        working-directory: frontend
        run: >-
          npx vitest run --reporter=basic
          src/lib/__tests__/sharedKnowledgeTree.test.ts
          src/lib/__tests__/knowledgeTreeModel.test.ts
          src/lib/__tests__/knowledgeTreeSidebarContract.test.ts

      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc -b
