name: SQLite full regression isolated gate

on:
  push:
    branches: [pg-validation-runtime-batch]
    paths:
      - ".github/workflows/pg-sqlite-regression-isolated.yml"

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pg-migration-unified
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        working-directory: backend
        run: npm run build:tsc -- --noEmit
      - name: Full SQLite regression suite
        working-directory: backend
        env:
          DB_DRIVER: sqlite
          DATABASE_URL: ""
          TEST_PG_DATABASE_URL: ""
        run: npm run test:serial
