name: PostgreSQL Note Transfer Staging Command

on:
  pull_request:
    paths:
      - ".github/workflows/pg-note-transfer-staging-command.yml"

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nowen
          POSTGRES_PASSWORD: nowen_ci_password
          POSTGRES_DB: nowen_note_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nowen -d nowen_note_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_PG_DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test
      DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test

    steps:
      - uses: actions/checkout@v4
        with:
          ref: pg-migration-unified
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Implement staging transaction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 backend/scripts/implement-note-transfer-staging-20260804.py
          python3 - <<'PY'
          from pathlib import Path

          preview_repository = Path("backend/src/repositories/noteTransferPreviewRepository.ts")
          source = preview_repository.read_text(encoding="utf-8")
          old = "          ORDER BY lower(tag.name), tag.id`,"
          new = "          ORDER BY tag.name, tag.id`,"
          if old not in source and new not in source:
              raise SystemExit("note-transfer tag ordering anchor changed")
          preview_repository.write_text(source.replace(old, new, 1), encoding="utf-8")

          runtime_test = Path("backend/tests/note-transfer-preview-runtime-pg.test.ts")
          source = runtime_test.read_text(encoding="utf-8")
          old = "    await closePgPool();"
          new = "    await closePgPool(pool);"
          if old not in source and new not in source:
              raise SystemExit("note-transfer PostgreSQL pool cleanup anchor changed")
          runtime_test.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Validate TypeScript and database boundaries
        working-directory: backend
        run: |
          npm run build:tsc -- --noEmit
          npm run audit:sqlite-boundaries
          npm run audit:pg-schema-parity

      - name: Validate migrations and Note Transfer staging
        working-directory: backend
        run: >-
          node --import tsx --test --test-concurrency=1
          tests/postgres-migrations.test.ts
          tests/note-transfer-preview-runtime-pg.test.ts

      - name: Validate production bundle
        working-directory: backend
        run: |
          npm run build
          test -f dist/postgres/migrations/0017_note_transfer_staging_manifest.sql

      - name: Commit validated staging slice
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/workflows/pg-note-transfer-staging-command.yml \
            backend/scripts/implement-note-transfer-staging-20260804.py
          git add -A
          git commit -m "feat(pg): add recoverable note-transfer staging manifest"
          git push origin HEAD:pg-migration-unified
