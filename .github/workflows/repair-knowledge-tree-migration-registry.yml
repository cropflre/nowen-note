name: Repair knowledge tree migration registry

on:
  pull_request:
    paths:
      - ".github/workflows/repair-knowledge-tree-migration-registry.yml"
      - ".github/scripts/repair_knowledge_tree_migration_registry.py"

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.pull_request.head.ref == 'fix/issue-612-data-protection' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Apply migration registry repair
        run: python .github/scripts/repair_knowledge_tree_migration_registry.py
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Verify migration registry and affected workflows
        working-directory: backend
        run: |
          node --import tsx --import ./tests/setup-db-isolation.ts --test tests/knowledge-tree-migration-registry.test.ts
          node --import tsx --import ./tests/setup-db-isolation.ts --test tests/roundtrip-permission-transfer-v2.test.ts tests/roundtrip-permission-postgres-schema.test.ts tests/roundtrip-permission-undo-authorization.test.ts
          node --import tsx --import ./tests/setup-db-isolation.ts --test tests/knowledge-tree-existing-data-migration.test.ts tests/knowledge-tree.test.ts
          node --import tsx --import ./tests/setup-db-isolation.ts --test tests/block-schema-repair-migration.test.ts
      - name: Backend typecheck
        working-directory: backend
        run: npm run build:tsc
      - name: Commit verified registry repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/db/migrations.ts \
            backend/src/runtime/knowledge-tree-migration-bootstrap.ts \
            backend/tests/knowledge-tree.test.ts \
            backend/tests/knowledge-tree-migration-registry.test.ts
          git commit -m "fix(db): register knowledge tree migrations v60-v65"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
