name: PostgreSQL Note Transfer Move Command 20260805

on:
  push:
    branches: [feat/pg-note-transfer-move-20260805]
    paths:
      - ".github/workflows/pg-note-transfer-move-command-20260805.yml"

permissions:
  contents: write

concurrency:
  group: pg-note-transfer-move-command-20260805
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nowen
          POSTGRES_PASSWORD: nowen_ci_password
          POSTGRES_DB: nowen_note_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nowen -d nowen_note_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_PG_DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test
      DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pg-note-transfer-move-20260805
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Reconstruct and apply move implementation
        shell: bash
        run: |
          set -euo pipefail
          cat backend/scripts/.move-command-v3.py.gz.part-* > /tmp/implement-note-transfer-move.py.gz
          echo "1d8d63da9931a1022bafc8b0f212956662c0f7816be7061338ce40e1eb67ce1d  /tmp/implement-note-transfer-move.py.gz" | sha256sum --check
          gzip --test /tmp/implement-note-transfer-move.py.gz
          gzip --decompress --stdout /tmp/implement-note-transfer-move.py.gz > /tmp/implement-note-transfer-move.py
          echo "74cca103ac5bb334b54c332819b246327a535e4db660d3b1b018ccee88b6dd43  /tmp/implement-note-transfer-move.py" | sha256sum --check
          python3 -m py_compile /tmp/implement-note-transfer-move.py
          python3 /tmp/implement-note-transfer-move.py
          test -f backend/src/db/postgres/migrations/0021_note_transfer_move_source_deletion.sql
          test -f backend/src/repositories/noteTransferMoveDeletionRepository.ts
          test -f backend/src/services/note-transfer-move-deletion-runtime.ts
          test -f backend/tests/note-transfer-move-deletion-runtime-pg.test.ts
          test -f .github/workflows/pg-note-transfer-move.yml
      - name: Apply knowledge capability repository boundary
        shell: bash
        run: |
          set -euo pipefail
          cat backend/scripts/.knowledge-boundary.py.gz.part-* > /tmp/patch-knowledge-boundaries.py.gz
          echo "5e0846ade39a823e3a95dbe69058f44aa95bd4b3fb85279e05e6bc0c728a02d3  /tmp/patch-knowledge-boundaries.py.gz" | sha256sum --check
          gzip --test /tmp/patch-knowledge-boundaries.py.gz
          gzip --decompress --stdout /tmp/patch-knowledge-boundaries.py.gz > /tmp/patch-knowledge-boundaries.py
          echo "e747544c6904a4b74fc85a53c91fa6e84b5a9e00f736544707efd8f0e069fda5  /tmp/patch-knowledge-boundaries.py" | sha256sum --check
          python3 -m py_compile /tmp/patch-knowledge-boundaries.py
          python3 /tmp/patch-knowledge-boundaries.py
          test -f backend/src/repositories/knowledgeAccessPolicyRepository.ts
          test -f backend/src/repositories/knowledgeDenyPolicyRepository.ts
          test -f backend/src/repositories/knowledgeCapabilityGuardRepository.ts
          test -f backend/src/repositories/knowledgeCapabilitiesRepository.ts
      - working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: TypeScript and database boundaries
        working-directory: backend
        run: |
          npm run build:tsc -- --noEmit
          npm run audit:sqlite-boundaries
          npm run audit:pg-schema-parity
      - name: PostgreSQL move deletion regression
        working-directory: backend
        run: >-
          node --import tsx --test --test-concurrency=1
          tests/postgres-migrations.test.ts
          tests/note-transfer-preview-runtime-pg.test.ts
          tests/note-transfer-attachment-staging-runtime-pg.test.ts
          tests/note-transfer-commit-runtime-pg.test.ts
          tests/note-transfer-cleanup-runtime-pg.test.ts
          tests/note-transfer-effects-runtime-pg.test.ts
          tests/note-transfer-move-deletion-runtime-pg.test.ts
      - name: Production bundle
        working-directory: backend
        run: npm run build
      - name: Commit validated business changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pg-note-transfer-move-command-20260805.yml
          rm -f backend/scripts/.move-command*.part-*
          rm -f backend/scripts/.knowledge-boundary*.part-*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(pg): add durable note transfer move deletion" \
            -m "Add migration 0021, target_committed/source_deleting states, effects-gated source deletion leases, source-version CAS, recoverable attachment cleanup, repository boundary fixes, runtime routes, health metrics and PostgreSQL regression coverage."
          git push origin HEAD:feat/pg-note-transfer-move-20260805
