name: Issue 694 Format Roundtrip CI

on:
  push:
    branches:
      - main
      - release/v1.4.6
    paths:
      - "backend/src/index.hardened.ts"
      - "backend/src/runtime/note-format-yjs-transition.ts"
      - "backend/src/services/yjs.ts"
      - "backend/src/routes/notes.ts"
      - "backend/tests/note-format-yjs-transition.test.ts"
      - "frontend/src/lib/noteFormatConversion.ts"
      - "frontend/src/lib/contentFormat.ts"
      - ".github/workflows/issue-694-format-roundtrip-ci.yml"
  pull_request:
    paths:
      - "backend/src/index.hardened.ts"
      - "backend/src/runtime/note-format-yjs-transition.ts"
      - "backend/src/services/yjs.ts"
      - "backend/src/routes/notes.ts"
      - "backend/tests/note-format-yjs-transition.test.ts"
      - "frontend/src/lib/noteFormatConversion.ts"
      - "frontend/src/lib/contentFormat.ts"
      - ".github/workflows/issue-694-format-roundtrip-ci.yml"

permissions:
  contents: read

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Reproduce stale IndexedDB merge across MD to RTE to MD
        run: node --import tsx --import ./tests/setup-db-isolation.ts --test tests/note-format-yjs-transition.test.ts
      - name: TypeScript
        run: npm run build:tsc

  conversion-semantics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Content format semantics
        run: npm run test:run -- src/lib/__tests__/contentFormat.test.ts
      - name: TypeScript
        run: npx tsc -b
