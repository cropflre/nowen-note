name: Apply minimal three-column layout guard

on:
  push:
    branches:
      - fix/v1.4.6-three-column-only-folder-navigation

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.4.6-three-column-only-folder-navigation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def one(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"target mismatch {path}: {text.count(old)} {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          def rx(path, pattern, repl):
              p = Path(path)
              text = p.read_text()
              text, count = re.subn(pattern, repl, text, count=1, flags=re.S | re.M)
              if count != 1:
                  raise SystemExit(f"regex mismatch {path}: {count} {pattern[:100]!r}")
              p.write_text(text)

          one(
            "frontend/src/lib/noteWorkspaceLayout.ts",
            'export function supportsWideNoteWorkspaceLayout(surface: NoteWorkspaceSurface): boolean {\n  return surface === "web" || surface === "desktop";\n}',
            '''export function supportsWideNoteWorkspaceLayout(surface: NoteWorkspaceSurface): boolean {
            return surface === "web" || surface === "desktop";
          }

          export function usesThreeColumnFolderNavigation(input: {
            mode: NoteWorkspaceLayoutMode;
            noteListCollapsed: boolean;
            desktopSurface: boolean;
          }): boolean {
            return input.mode === "three-column"
              && !input.noteListCollapsed
              && input.desktopSurface;
          }'''
          )

          panel = "frontend/src/components/KnowledgeTreePanel.tsx"
          one(panel, 'import { detectNoteWorkspaceSurface } from "@/lib/noteWorkspaceLayout";', '''import {
            detectNoteWorkspaceSurface,
            usesThreeColumnFolderNavigation,
            type NoteWorkspaceLayoutMode,
          } from "@/lib/noteWorkspaceLayout";''')
          one(panel, '  showAllNotesToolbar?: boolean;\n}', '  showAllNotesToolbar?: boolean;\n  layoutMode?: NoteWorkspaceLayoutMode;\n}')
          one(panel, '''  importRequest,
            showAllNotesToolbar = true,
          }: KnowledgeTreePanelProps) {
            const { state } = useApp();
            const actions = useAppActions();''', '''  importRequest,
            showAllNotesToolbar = true,
            layoutMode = "standard",
          }: KnowledgeTreePanelProps) {
            const { state } = useApp();
            const actions = useAppActions();
            const threeColumnFolderNavigation = usesThreeColumnFolderNavigation({
              mode: layoutMode,
              noteListCollapsed: state.noteListCollapsed,
              desktopSurface: variant === "desktop",
            });''')
          one(panel, '''    if (node.nodeType === "folder") {
                if (!isFolderUnlocked(node, unlockedFolderIds)) {
                  setPendingFolderAction({ nodeId: node.id, action: "select" });
                  setPasswordDialog({ node, mode: "unlock" });
                  return;
                }
                selectFolder(node);
                return;
              }''', '''    if (node.nodeType === "folder") {
                const folderAction = threeColumnFolderNavigation ? "select" : "toggle";
                if (!isFolderUnlocked(node, unlockedFolderIds)) {
                  setPendingFolderAction({ nodeId: node.id, action: folderAction });
                  setPasswordDialog({ node, mode: "unlock" });
                  return;
                }
                if (threeColumnFolderNavigation) selectFolder(node);
                else await toggle(node);
                return;
              }''')
          one(panel, '''        node.resourceType === "notebook"
                  && state.viewMode === "notebook"''', '''        threeColumnFolderNavigation
                  && node.resourceType === "notebook"
                  && state.viewMode === "notebook"''')

          rx(
            "frontend/src/components/KnowledgeTreeCreateMenuRuntime.tsx",
            r'(showAllNotesToolbar=\{showAllNotesEntry\}\n)(\s*/>)',
            r'\1          layoutMode={layoutMode}\n\2'
          )

          note = "frontend/src/components/NoteList.tsx"
          one(note, 'import { resolveExternalDropNotebookId } from "@/lib/notebookExternalDropTarget";', '''import { resolveExternalDropNotebookId } from "@/lib/notebookExternalDropTarget";
          import {
            loadNoteWorkspaceLayoutMode,
            NOTE_WORKSPACE_LAYOUT_CHANGED_EVENT,
            NOTE_WORKSPACE_LAYOUT_STORAGE_KEY,
            usesThreeColumnFolderNavigation,
            type NoteWorkspaceLayoutMode,
          } from "@/lib/noteWorkspaceLayout";''')
          one(note, '''export default function NoteList() {
            const { state } = useApp();
            const actions = useAppActions();
            const { loadNote, cancelNoteLoad } = useNoteLoader();''', '''export default function NoteList() {
            const { state } = useApp();
            const actions = useAppActions();
            const [layoutMode, setLayoutMode] = useState<NoteWorkspaceLayoutMode>(() =>
              loadNoteWorkspaceLayoutMode(state.noteListCollapsed),
            );
            const [desktopFolderNavigationSurface, setDesktopFolderNavigationSurface] = useState(() =>
              typeof window === "undefined" ? true : window.matchMedia("(min-width: 768px)").matches,
            );

            useEffect(() => {
              const onLayoutChanged = (event: Event) => {
                const mode = (event as CustomEvent<NoteWorkspaceLayoutMode>).detail;
                if (mode === "standard" || mode === "three-column") setLayoutMode(mode);
              };
              const onStorage = (event: StorageEvent) => {
                if (event.key === NOTE_WORKSPACE_LAYOUT_STORAGE_KEY) {
                  setLayoutMode(loadNoteWorkspaceLayoutMode(state.noteListCollapsed));
                }
              };
              window.addEventListener(NOTE_WORKSPACE_LAYOUT_CHANGED_EVENT, onLayoutChanged);
              window.addEventListener("storage", onStorage);
              return () => {
                window.removeEventListener(NOTE_WORKSPACE_LAYOUT_CHANGED_EVENT, onLayoutChanged);
                window.removeEventListener("storage", onStorage);
              };
            }, [state.noteListCollapsed]);

            useEffect(() => {
              const media = window.matchMedia("(min-width: 768px)");
              const update = () => setDesktopFolderNavigationSurface(media.matches);
              update();
              media.addEventListener("change", update);
              return () => media.removeEventListener("change", update);
            }, []);

            const directNotebookScope = usesThreeColumnFolderNavigation({
              mode: layoutMode,
              noteListCollapsed: state.noteListCollapsed,
              desktopSurface: desktopFolderNavigationSurface,
            });
            const { loadNote, cancelNoteLoad } = useNoteLoader();''')
          one(note, '        const params: Record<string, string> = { notebookId: state.selectedNotebookId, includeDescendants: "0", ...sortParams };', '''        const params: Record<string, string> = {
                  notebookId: state.selectedNotebookId,
                  ...(directNotebookScope ? { includeDescendants: "0" } : {}),
                  ...sortParams,
                };''')
          one(note, '  }, [actions, notesQueryKey, state.viewMode, state.selectedNotebookId, state.searchQuery, state.selectedTagIds, dateFilter, sortPref.by, sortPref.dir, t]);', '  }, [actions, notesQueryKey, state.viewMode, state.selectedNotebookId, state.searchQuery, state.selectedTagIds, dateFilter, sortPref.by, sortPref.dir, directNotebookScope, t]);')
          one(note, '        return api.getNotes({ notebookId: state.selectedNotebookId, includeDescendants: "0", ...sortParams });', '''        return api.getNotes({
                  notebookId: state.selectedNotebookId,
                  ...(directNotebookScope ? { includeDescendants: "0" } : {}),
                  ...sortParams,
                });''')
          rx(note, r'(sortPref\.dir,\n\s+state\.notesRefreshToken,)(\n\s+\]\);)', r'\1\n    directNotebookScope,\2')

          test = "frontend/src/lib/__tests__/noteWorkspaceLayout.test.ts"
          one(test, '  supportsWideNoteWorkspaceLayout,\n  type NoteWorkspaceLayoutMode,', '  supportsWideNoteWorkspaceLayout,\n  usesThreeColumnFolderNavigation,\n  type NoteWorkspaceLayoutMode,')
          one(test, '  it("migrates the previous note-list collapsed preference", () => {', '''  it("limits direct folder navigation to desktop three-column mode", () => {
                expect(usesThreeColumnFolderNavigation({ mode: "three-column", noteListCollapsed: false, desktopSurface: true })).toBe(true);
                expect(usesThreeColumnFolderNavigation({ mode: "standard", noteListCollapsed: false, desktopSurface: true })).toBe(false);
                expect(usesThreeColumnFolderNavigation({ mode: "three-column", noteListCollapsed: true, desktopSurface: true })).toBe(false);
                expect(usesThreeColumnFolderNavigation({ mode: "three-column", noteListCollapsed: false, desktopSurface: false })).toBe(false);
              });

              it("migrates the previous note-list collapsed preference", () => {''')

          contract = "frontend/src/lib/__tests__/knowledgeTreeSidebarContract.test.ts"
          old_block = '''  it("separates folder selection from the disclosure arrow in three-column navigation", () => {
            const panel = source("../../components/KnowledgeTreePanel.tsx");
            const noteList = source("../../components/NoteList.tsx");

            expect(panel).toContain('action: "select" | "toggle"');
            expect(panel).toContain('setPendingFolderAction({ nodeId: node.id, action: "select" })');
            expect(panel).toContain('setPendingFolderAction({ nodeId: node.id, action: "toggle" })');
            expect(panel).toContain("actions.setSelectedNotebook(node.resourceId)");
            expect(panel).toContain('actions.setViewMode("notebook")');
            expect(panel).toContain("selectFolder(node)");
            expect(panel).toContain("state.selectedNotebookId === node.resourceId");
            expect(panel).toContain("onClick={() => hasChildren && void toggleDisclosure(node)}");
            expect(noteList).toContain('includeDescendants: "0"');
          });'''
          new_block = '''  it("separates folder selection only in three-column navigation", () => {
            const panel = source("../../components/KnowledgeTreePanel.tsx");
            const runtime = source("../../components/KnowledgeTreeCreateMenuRuntime.tsx");
            const noteList = source("../../components/NoteList.tsx");

            expect(runtime).toContain("layoutMode={layoutMode}");
            expect(panel).toContain("usesThreeColumnFolderNavigation");
            expect(panel).toContain('const folderAction = threeColumnFolderNavigation ? "select" : "toggle"');
            expect(panel).toContain("if (threeColumnFolderNavigation) selectFolder(node)");
            expect(panel).toContain("else await toggle(node)");
            expect(panel).toContain("onClick={() => hasChildren && void toggleDisclosure(node)}");
            expect(noteList).toContain("directNotebookScope");
            expect(noteList).toContain('directNotebookScope ? { includeDescendants: "0" } : {}');
          });'''
          one(contract, old_block, new_block)
          PY

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run targeted tests
        working-directory: frontend
        run: npm run test:run -- src/lib/__tests__/noteWorkspaceLayout.test.ts src/lib/__tests__/knowledgeTreeSidebarContract.test.ts

      - name: Type-check frontend
        working-directory: frontend
        run: npx tsc -b --pretty false

      - name: Commit verified implementation
        shell: bash
        run: |
          git rm .github/workflows/tmp-three-column-only-folder-navigation.yml
          git rm .github/workflows/tmp-three-column-only-folder-navigation-v2.yml
          git rm .github/workflows/tmp-three-column-only-folder-navigation-v3.yml
          git rm .github/workflows/tmp-three-column-only-folder-navigation-v4.yml
          git rm .github/workflows/tmp-three-column-only-folder-navigation-v5.yml
          git config user.name "Drug"
          git config user.email "cropflre2333@gmail.com"
          git add frontend/src/lib/noteWorkspaceLayout.ts \
            frontend/src/components/KnowledgeTreePanel.tsx \
            frontend/src/components/KnowledgeTreeCreateMenuRuntime.tsx \
            frontend/src/components/NoteList.tsx \
            frontend/src/lib/__tests__/noteWorkspaceLayout.test.ts \
            frontend/src/lib/__tests__/knowledgeTreeSidebarContract.test.ts
          git commit -m "fix: restrict folder selection behavior to three-column mode"
          git push origin HEAD:fix/v1.4.6-three-column-only-folder-navigation
