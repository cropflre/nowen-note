name: Markdown Live Preview CI

on:
  workflow_dispatch:
  push:
    branches: [main, "release/**"]
    paths:
      - "frontend/src/components/MarkdownExperienceBridge.tsx"
      - "frontend/src/components/MarkdownMobileViewControlsBridge.tsx"
      - "frontend/src/components/MarkdownEditorImpl.tsx"
      - "frontend/src/components/LargeMarkdownSafeEditor.tsx"
      - "frontend/src/lib/markdownFolding.ts"
      - "frontend/src/lib/markdownLivePreview.tsx"
      - "frontend/src/components/__tests__/MarkdownExperienceBridge.interaction.test.tsx"
      - "frontend/src/components/__tests__/MarkdownEditor.mobilePreview.test.ts"
      - "frontend/src/components/__tests__/MarkdownEditor.folding.test.tsx"
      - "frontend/src/components/__tests__/LargeMarkdownSafeEditor.preview.test.tsx"
      - "frontend/src/lib/__tests__/markdownLivePreview.test.tsx"
      - "frontend/e2e/markdown-slash-menu.spec.ts"
      - "frontend/playwright.markdown-slash.config.ts"
      - "backend/tests/task-composer-browser-server.ts"
      - "frontend/package*.json"
      - "backend/package*.json"
      - ".github/workflows/markdown-live-preview-ci.yml"
  pull_request:
    paths:
      - "frontend/src/components/MarkdownExperienceBridge.tsx"
      - "frontend/src/components/MarkdownMobileViewControlsBridge.tsx"
      - "frontend/src/components/MarkdownEditorImpl.tsx"
      - "frontend/src/components/LargeMarkdownSafeEditor.tsx"
      - "frontend/src/lib/markdownFolding.ts"
      - "frontend/src/lib/markdownLivePreview.tsx"
      - "frontend/src/components/__tests__/MarkdownExperienceBridge.interaction.test.tsx"
      - "frontend/src/components/__tests__/MarkdownEditor.mobilePreview.test.ts"
      - "frontend/src/components/__tests__/MarkdownEditor.folding.test.tsx"
      - "frontend/src/components/__tests__/LargeMarkdownSafeEditor.preview.test.tsx"
      - "frontend/src/lib/__tests__/markdownLivePreview.test.tsx"
      - "frontend/e2e/markdown-slash-menu.spec.ts"
      - "frontend/playwright.markdown-slash.config.ts"
      - "backend/tests/task-composer-browser-server.ts"
      - "frontend/package*.json"
      - "backend/package*.json"
      - ".github/workflows/markdown-live-preview-ci.yml"

permissions:
  contents: read

jobs:
  live-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Live preview, chapter folding and responsive toolbar interaction tests
        run: >-
          npx vitest run src/components/__tests__/MarkdownExperienceBridge.interaction.test.tsx
          src/components/__tests__/MarkdownEditor.mobilePreview.test.ts
          src/components/__tests__/MarkdownEditor.folding.test.tsx
          src/components/__tests__/LargeMarkdownSafeEditor.preview.test.tsx
          src/lib/__tests__/markdownLivePreview.test.tsx --reporter=verbose
      - name: Production frontend build
        run: npm run build
      - name: Install isolated browser backend dependencies
        run: npm ci --prefix ../backend
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile chapter folding interactions
        env:
          NOWEN_MARKDOWN_TEST_RUNTIME: node
        run: npx playwright test --config playwright.markdown-slash.config.ts --grep "Markdown chapter folding" --output=test-results/markdown-folding
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: markdown-folding-browser-evidence
          path: frontend/test-results/markdown-folding
          if-no-files-found: ignore
