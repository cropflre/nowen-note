# 三平台构建 + SignPath Windows 签名 + 单一 GitHub Release 发布边界
#
# 触发方式：
#   1. push tag v*.*.*  → 构建全部平台，Windows 经过 SignPath 后再集中发布
#   2. workflow_dispatch → publish=never 只保留构建 artifact；publish=always 走正式发布链路
#
# SignPath 正式发布必需：
#   Secret: SIGNPATH_API_TOKEN
#   Variables: SIGNPATH_ORGANIZATION_ID / SIGNPATH_PROJECT_SLUG /
#              SIGNPATH_SIGNING_POLICY_SLUG / SIGNPATH_ARTIFACT_CONFIGURATION_SLUG /
#              NOWEN_WINDOWS_PUBLISHER_NAME

name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: "发布到 GitHub Releases（always/never）"
        required: false
        default: "never"
        type: choice
        options:
          - never
          - always

permissions:
  contents: write
  actions: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: win
          - os: macos-latest
            name: mac
          - os: ubuntu-latest
            name: linux

    runs-on: ${{ matrix.os }}
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Check SignPath release configuration
        if: matrix.name == 'win' && (github.event_name == 'push' || inputs.publish == 'always')
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          NOWEN_WINDOWS_PUBLISHER_NAME: ${{ vars.NOWEN_WINDOWS_PUBLISHER_NAME }}
        run: node scripts/check-signpath-release-config.mjs

      - name: Install root deps
        run: npm ci
        shell: bash

      - name: Install backend deps
        working-directory: backend
        run: npm ci
        shell: bash

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
        shell: bash

      - name: Fetch embedded Node binary
        run: npm run fetch:node
        shell: bash

      - name: Build backend & frontend
        run: npm run build:all
        shell: bash

      - name: Rebuild native modules for Electron ABI
        if: matrix.os != 'macos-latest'
        run: npm run rebuild:native
        shell: bash

      - name: Export macOS signing env
        if: matrix.name == 'mac'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK || secrets.CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$MAC_CSC_LINK" ]; then echo "CSC_LINK=$MAC_CSC_LINK" >> "$GITHUB_ENV"; fi
          if [ -n "$MAC_CSC_KEY_PASSWORD" ]; then echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"; fi
          echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
          echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$APPLE_API_KEY" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
        shell: bash

      - name: Build Electron Full (Windows)
        if: matrix.name == 'win'
        env:
          NOWEN_WINDOWS_PUBLISHER_NAME: ${{ vars.NOWEN_WINDOWS_PUBLISHER_NAME }}
        run: npx electron-builder --config electron/builder.config.js --win --publish never
        shell: bash

      - name: Build Electron Lite (Windows)
        if: matrix.name == 'win'
        env:
          NOWEN_WINDOWS_PUBLISHER_NAME: ${{ vars.NOWEN_WINDOWS_PUBLISHER_NAME }}
        run: npx electron-builder --config electron/builder.lite.config.js --win --publish never
        shell: bash

      - name: Build Electron (macOS x64 / Intel)
        if: matrix.name == 'mac'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.CSC_LINK == '' && 'false' || 'true' }}
          NOWEN_MAC_ARCH: x64
          TARGET_ARCH: x64
          npm_config_target_arch: x64
        run: npm run rebuild:native -- --target-platform=darwin --target-arch=x64 && npx electron-builder --config electron/builder.config.js --mac --publish never
        shell: bash

      - name: Build Electron (macOS arm64 / Apple Silicon)
        if: matrix.name == 'mac'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.CSC_LINK == '' && 'false' || 'true' }}
          NOWEN_MAC_ARCH: arm64
          TARGET_ARCH: arm64
          npm_config_target_arch: arm64
        run: npm run rebuild:native -- --target-platform=darwin --target-arch=arm64 && npx electron-builder --config electron/builder.config.js --mac --publish never
        shell: bash

      - name: Build Electron (Linux)
        if: matrix.name == 'linux'
        run: npx electron-builder --config electron/builder.config.js --linux --publish never
        shell: bash

      - name: Upload unsigned Full Windows artifact for SignPath
        id: upload_full_unsigned
        if: matrix.name == 'win' && (github.event_name == 'push' || inputs.publish == 'always')
        uses: actions/upload-artifact@v4
        with:
          name: nowen-note-win-full-unsigned-signpath
          path: |
            dist-electron/*.exe
            dist-electron/*.blockmap
            dist-electron/latest.yml
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned Lite Windows artifact for SignPath
        id: upload_lite_unsigned
        if: matrix.name == 'win' && (github.event_name == 'push' || inputs.publish == 'always')
        uses: actions/upload-artifact@v4
        with:
          name: nowen-note-win-lite-unsigned-signpath
          path: |
            dist-electron-lite/*.exe
            dist-electron-lite/*.blockmap
            dist-electron-lite/latest-lite.yml
          if-no-files-found: error
          retention-days: 14

      - name: Submit Full Windows artifact to SignPath
        if: matrix.name == 'win' && (github.event_name == 'push' || inputs.publish == 'always')
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload_full_unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-windows/full

      - name: Submit Lite Windows artifact to SignPath
        if: matrix.name == 'win' && (github.event_name == 'push' || inputs.publish == 'always')
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload_lite_unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-windows/lite

      - name: Export signed Windows Authenticode records
        if: matrix.name == 'win' && (github.event_name == 'push' || inputs.publish == 'always')
        shell: pwsh
        run: ./scripts/export-windows-signatures.ps1 -Root signed-windows -Output signed-windows/signatures.json

      - name: Verify signed Windows publisher and required channels
        if: matrix.name == 'win' && (github.event_name == 'push' || inputs.publish == 'always')
        run: node scripts/verify-windows-signatures.mjs --report signed-windows/signatures.json --publisher "${{ vars.NOWEN_WINDOWS_PUBLISHER_NAME }}" --require full,lite
        shell: bash

      - name: Refresh signed Windows blockmaps and updater metadata
        if: matrix.name == 'win' && (github.event_name == 'push' || inputs.publish == 'always')
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          node scripts/refresh-windows-update-metadata.mjs --metadata signed-windows/full/latest.yml --asset-dir signed-windows/full --channel full --version $version
          node scripts/refresh-windows-update-metadata.mjs --metadata signed-windows/lite/latest-lite.yml --asset-dir signed-windows/lite --channel lite --version $version
          New-Item -ItemType Directory -Path signed-windows/release -Force | Out-Null
          Copy-Item signed-windows/full/* signed-windows/release/ -Force
          Copy-Item signed-windows/lite/* signed-windows/release/ -Force
          Remove-Item signed-windows/release/signatures.json -ErrorAction SilentlyContinue

      - name: Verify signed Windows updater assets locally
        if: matrix.name == 'win' && (github.event_name == 'push' || inputs.publish == 'always')
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          node scripts/verify-release-update-assets.mjs local --dir signed-windows/release --version $version

      - name: Upload formal signed Windows artifact
        if: matrix.name == 'win' && (github.event_name == 'push' || inputs.publish == 'always')
        uses: actions/upload-artifact@v4
        with:
          name: nowen-note-win-signed
          path: signed-windows/release/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned Full Windows debug artifact
        if: matrix.name == 'win' && github.event_name != 'push' && inputs.publish != 'always'
        uses: actions/upload-artifact@v4
        with:
          name: nowen-note-win-unsigned-full
          path: |
            dist-electron/*.exe
            dist-electron/*.blockmap
            dist-electron/latest.yml
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned Lite Windows debug artifact
        if: matrix.name == 'win' && github.event_name != 'push' && inputs.publish != 'always'
        uses: actions/upload-artifact@v4
        with:
          name: nowen-note-win-unsigned-lite
          path: |
            dist-electron-lite/*.exe
            dist-electron-lite/*.blockmap
            dist-electron-lite/latest-lite.yml
          if-no-files-found: error
          retention-days: 14

      - name: Upload formal macOS artifact
        if: matrix.name == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: nowen-note-mac
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.blockmap
            dist-electron/latest*.yml
          if-no-files-found: error
          retention-days: 14

      - name: Upload formal Linux artifact
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: nowen-note-linux
          path: |
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.blockmap
            dist-electron/latest*.yml
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.event_name == 'push' || inputs.publish == 'always'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download signed Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: nowen-note-win-signed
          path: release-assets/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: nowen-note-mac
          path: release-assets/mac

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: nowen-note-linux
          path: release-assets/linux

      - name: Resolve and verify release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          TAG="v${VERSION}"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "tag/version mismatch: ref=$GITHUB_REF_NAME package=$VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Re-verify Windows Authenticode signatures
        shell: pwsh
        run: |
          ./scripts/export-windows-signatures.ps1 -Root release-assets/windows -Output release-assets/windows-signatures.json
          node scripts/verify-windows-signatures.mjs --report release-assets/windows-signatures.json --publisher "${{ vars.NOWEN_WINDOWS_PUBLISHER_NAME }}" --require full,lite

      - name: Verify local updater metadata before upload
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          node scripts/verify-release-update-assets.mjs local --dir release-assets/windows --version $version
          node scripts/verify-release-update-assets.mjs local --dir release-assets/mac --version $version
          node scripts/verify-release-update-assets.mjs local --dir release-assets/linux --version $version

      - name: Create or force Release back to draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=true
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          fi

      - name: Upload allowlisted Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(
            release-assets/windows/*.exe
            release-assets/windows/*.blockmap
            release-assets/windows/latest*.yml
            release-assets/mac/*.dmg
            release-assets/mac/*.zip
            release-assets/mac/*.blockmap
            release-assets/mac/latest*.yml
            release-assets/linux/*.AppImage
            release-assets/linux/*.deb
            release-assets/linux/*.blockmap
            release-assets/linux/latest*.yml
          )
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "no allowlisted release assets found" >&2
            exit 1
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"

      - name: Verify remote Release updater metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: node scripts/verify-release-update-assets.mjs remote --repo "$GITHUB_REPOSITORY" --tag "$TAG" --version "$VERSION"

      - name: Publish verified Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
