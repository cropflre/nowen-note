name: Issue 749 Editor UX CI

on:
  workflow_dispatch:
  push:
    branches: [main, "release/**"]
    paths:
      - "frontend/src/components/EditorPane.tsx"
      - "frontend/src/components/TiptapEditor.tsx"
      - "frontend/src/components/CodeBlockView.tsx"
      - "frontend/src/components/MarkdownCodeBlock.tsx"
      - "frontend/src/components/NoteIconPickerModal.tsx"
      - "frontend/src/components/KnowledgeTreePanel.tsx"
      - "frontend/src/components/SettingsModal.tsx"
      - "frontend/src/components/NoteColorMarkPicker.tsx"
      - "frontend/src/components/NoteColorMarkDot.tsx"
      - "frontend/src/lib/noteColorMark.ts"
      - "frontend/src/lib/__tests__/noteColorMarkUi.test.ts"
      - "frontend/src/components/NoteColorMarkPicker.tsx"
      - "frontend/src/components/NoteColorMarkDot.tsx"
      - "frontend/src/lib/noteColorMark.ts"
      - "frontend/src/lib/__tests__/noteColorMarkUi.test.ts"
      - "frontend/src/components/NavRail.tsx"
      - "frontend/src/lib/navigationVisibility.ts"
      - "frontend/src/lib/codeBlockPresentation.ts"
      - "frontend/src/lib/noteIconRegistry.ts"
      - "frontend/src/lib/userPreferenceAccountCache.ts"
      - "frontend/src/lib/__tests__/issue749EditorUx.test.ts"
      - "frontend/src/hooks/useUserPreferences.tsx"
      - "frontend/src/i18n/locales/**"
      - "backend/src/routes/user-preferences-sync.ts"
      - "backend/tests/user-preferences-sync.test.ts"
      - ".github/workflows/issue-749-editor-ux-ci.yml"
  pull_request:
    paths:
      - "frontend/src/components/EditorPane.tsx"
      - "frontend/src/components/TiptapEditor.tsx"
      - "frontend/src/components/CodeBlockView.tsx"
      - "frontend/src/components/MarkdownCodeBlock.tsx"
      - "frontend/src/components/NoteIconPickerModal.tsx"
      - "frontend/src/components/KnowledgeTreePanel.tsx"
      - "frontend/src/components/SettingsModal.tsx"
      - "frontend/src/components/NavRail.tsx"
      - "frontend/src/lib/navigationVisibility.ts"
      - "frontend/src/lib/codeBlockPresentation.ts"
      - "frontend/src/lib/noteIconRegistry.ts"
      - "frontend/src/lib/userPreferenceAccountCache.ts"
      - "frontend/src/lib/__tests__/issue749EditorUx.test.ts"
      - "frontend/src/hooks/useUserPreferences.tsx"
      - "frontend/src/i18n/locales/**"
      - "backend/src/routes/user-preferences-sync.ts"
      - "backend/tests/user-preferences-sync.test.ts"
      - ".github/workflows/issue-749-editor-ux-ci.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Issue 749 focused regressions
        run: >-
          npx vitest run
          src/lib/__tests__/issue749EditorUx.test.ts
          src/components/__tests__/CodeBlockView.performance.test.tsx
          src/components/__tests__/MarkdownCodeBlock.performance.test.tsx
          src/lib/__tests__/userPreferenceAccountCache.test.ts
          src/lib/__tests__/navigationVisibility.test.ts
          src/lib/__tests__/noteColorMarkUi.test.ts
          --reporter=verbose
      - name: Frontend typecheck
        run: npx tsc -b --pretty false

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Synced preference regression
        run: node --import tsx --import ./tests/setup-db-isolation.ts --test tests/user-preferences-sync.test.ts
      - name: Backend typecheck
        run: npm run build:tsc -- --pretty false
