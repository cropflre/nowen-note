      - "backend/src/db/schema.ts"
      - "backend/tests/note-color-mark-startup.test.ts"
      - "backend/src/db/noteCommentNotificationsMigration.ts"
      - "backend/src/db/postgres/migrations/0116-note-comment-notifications.sql"
      - "backend/tests/note-comments-management.test.ts"
      - "backend/tests/workspace-issues.test.ts"
      - "backend/tests/share-management-route.test.ts"
      - "docs/note-comments.md"
      - ".github/workflows/issue-749-editor-ux-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Issue 749 focused regressions
        run: >-
          npx vitest run
          src/lib/__tests__/issue749EditorUx.test.ts
          src/lib/__tests__/htmlPlayground.test.ts
          src/components/__tests__/HtmlCodeBlockRunButton.test.tsx
          src/components/__tests__/CodeBlockView.performance.test.tsx
          src/components/__tests__/MarkdownCodeBlock.performance.test.tsx
          src/lib/__tests__/userPreferenceAccountCache.test.ts
          src/lib/__tests__/navigationVisibility.test.ts
          src/lib/__tests__/noteColorMarkUi.test.ts
          src/components/__tests__/CommentManagementCenter.test.tsx
          src/components/__tests__/ShareManagementPage.test.tsx
          src/components/__tests__/InlineCommentBridge.viewport.test.tsx
          src/components/issues/__tests__/NotificationCenter.test.tsx
          src/lib/__tests__/noteCommentNavigation.test.ts
          --reporter=verbose
      - name: Frontend typecheck
        run: npx tsc -b --pretty false

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Legacy note color migration startup regression
        run: node --import tsx --import ./tests/setup-db-isolation.ts --test tests/note-color-mark-startup.test.ts
      - name: Synced preference regression
        run: node --import tsx --import ./tests/setup-db-isolation.ts --test tests/user-preferences-sync.test.ts
      - name: Note comment management and notification regressions
        run: >-
          node --import tsx --import ./tests/setup-db-isolation.ts --test
          tests/note-comments-management.test.ts
          tests/workspace-issues.test.ts
          tests/share-management-route.test.ts
      - name: Backend typecheck
        run: npm run build:tsc -- --pretty false
