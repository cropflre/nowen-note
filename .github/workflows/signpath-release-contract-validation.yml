name: SignPath Release Contract Validation

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/signpath-release-contract-validation.yml"
      - "electron/builder*.config.js"
      - "scripts/release*.sh"
      - "scripts/release-linux-app.test.mjs"
      - "scripts/**/*signpath*"
      - "scripts/**/*windows*"
      - "scripts/**/*update-metadata*"
      - "scripts/tests/*release*"
      - "README.md"
      - "docs/PRIVACY.md"
      - "package.json"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Release contract tests
        run: |
          npm run test:update-release
          node --test scripts/release-linux-app.test.mjs
      - name: Shell and YAML syntax
        run: |
          bash -n scripts/release.sh
          bash -n scripts/release-legacy.sh
          node -e "require('js-yaml').load(require('fs').readFileSync('.github/workflows/release.yml','utf8')); console.log('release.yml ok')"
      - name: Safety boundary checks
        shell: bash
        run: |
          set -euo pipefail
          if grep -nF -- "--publish always" .github/workflows/release.yml; then
            echo "forbidden direct publish flag found" >&2
            exit 1
          fi
          if grep -RInE "WIN_CSC_LINK|WIN_CSC_KEY_PASSWORD|publisherName:.*Nowen" .github/workflows/release.yml electron scripts; then
            echo "legacy Windows signing configuration found" >&2
            exit 1
          fi
          grep -nE "SIGNPATH_API_TOKEN|NOWEN_WINDOWS_PUBLISHER_NAME|github-action-submit-signing-request@v2" .github/workflows/release.yml
          grep -n "check-local-windows-publish-policy.mjs" scripts/release-legacy.sh
          if grep -n "check-local-windows-publish-policy.mjs" scripts/release.sh; then
            echo "Windows release guard must live in release-legacy.sh only" >&2
            exit 1
          fi
          git diff --check origin/${{ github.base_ref }}...HEAD

  windows-fail-closed:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Export repository Authenticode records
        shell: pwsh
        run: ./scripts/export-windows-signatures.ps1 -Root . -Output "$env:TEMP\nowen-signatures.json"
      - name: Unsigned repository must not satisfy release policy
        shell: pwsh
        run: |
          node scripts/verify-windows-signatures.mjs --report "$env:TEMP\nowen-signatures.json" --publisher "invalid-test-publisher" --require full,lite
          if ($LASTEXITCODE -eq 0) {
            throw "unsigned/error-signature smoke unexpectedly passed"
          }
          Write-Host "unsigned/error-signature smoke rejected as expected"
          exit 0
