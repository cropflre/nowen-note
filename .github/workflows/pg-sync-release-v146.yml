name: PostgreSQL Sync Release v1.4.6

on:
  push:
    branches: [pg-migration-unified]
    paths:
      - ".github/workflows/pg-sync-release-v146.yml"

permissions:
  contents: write

concurrency:
  group: pg-sync-release-v146
  cancel-in-progress: false

jobs:
  merge-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pg-migration-unified
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Merge release/v1.4.6 and resolve the two semantic conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin release/v1.4.6

          set +e
          git merge --no-ff --no-commit origin/release/v1.4.6
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            printf 'Conflicts:\n%s\n' "${conflicts[*]}"
            expected=$'backend/src/index.hardened.ts\nfrontend/src/main.tsx'
            actual="$(printf '%s\n' "${conflicts[@]}")"
            if [ "$actual" != "$expected" ]; then
              echo "Unexpected merge conflict set" >&2
              exit 1
            fi
          fi

          git checkout --ours backend/src/index.hardened.ts
          python <<'PY'
          from pathlib import Path
          path = Path('backend/src/index.hardened.ts')
          text = path.read_text()
          needle = '  await import("./runtime/knowledge-tree.js");\n  await import("./index.js");'
          replacement = (
              '  await import("./runtime/knowledge-tree.js");\n'
              '  // Install before the main Hono app registers its production wildcard static route.\n'
              '  await import("./runtime/static-precompressed-assets.js");\n'
              '  await import("./index.js");'
          )
          if text.count(needle) != 1:
              raise SystemExit('backend conflict resolution anchor changed')
          path.write_text(text.replace(needle, replacement))
          PY
          git add backend/src/index.hardened.ts

          git checkout --theirs frontend/src/main.tsx
          python <<'PY'
          from pathlib import Path
          path = Path('frontend/src/main.tsx')
          text = path.read_text()
          replacements = [
              (
                  'import NoteIconBridge from "./components/NoteIconBridge";\n',
                  'import NoteIconBridge from "./components/NoteIconBridge";\n'
                  'import SidebarSearchExperienceBridge from "./components/SidebarSearchExperienceBridge";\n',
              ),
              (
                  'import { installKnowledgeTreeScrollbarBridge } from "./lib/knowledgeTreeScrollbarBridge";\n',
                  'import { installKnowledgeTreeScrollbarBridge } from "./lib/knowledgeTreeScrollbarBridge";\n'
                  'import { installWorkspaceRealtimeSubscription } from "./lib/workspaceRealtimeSubscription";\n',
              ),
              (
                  'installKnowledgeTreeScrollbarBridge();\n',
                  'installKnowledgeTreeScrollbarBridge();\ninstallWorkspaceRealtimeSubscription();\n',
              ),
              (
                  '          <NoteIconBridge />\n',
                  '          <NoteIconBridge />\n          <SidebarSearchExperienceBridge />\n',
              ),
          ]
          for needle, replacement in replacements:
              if text.count(needle) != 1:
                  raise SystemExit(f'frontend conflict resolution anchor changed: {needle!r}')
              text = text.replace(needle, replacement)
          path.write_text(text)
          PY
          git add frontend/src/main.tsx

          if git diff --name-only --diff-filter=U | grep -q .; then
            git diff --name-only --diff-filter=U
            exit 1
          fi

      - name: Backend type and database boundary checks
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm run build:tsc -- --noEmit
          npm run audit:sqlite-boundaries
          npm run audit:pg-schema-parity

      - name: Frontend typecheck
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx tsc -b --pretty false

      - name: Commit dual-parent release sync
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pg-sync-release-v146.yml
          git commit -m "merge: sync release/v1.4.6 into pg migration"
          git push origin HEAD:pg-migration-unified
