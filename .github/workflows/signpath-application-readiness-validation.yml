name: SignPath Application Readiness Validation

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/signpath-application-readiness-validation.yml"
      - ".signpath/**"
      - "docs/CODE_SIGNING.md"
      - "docs/PRIVACY.md"
      - "README.md"
      - "package.json"
      - "scripts/**/*signpath*"
      - "scripts/**/*windows*"
      - "scripts/**/*update-metadata*"
      - "scripts/release*.sh"
      - "scripts/release-linux-app.test.mjs"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Release and SignPath contract tests
        run: |
          npm run test:update-release
          node --test scripts/release-linux-app.test.mjs
      - name: Parse Artifact Configuration XML
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for path in [
              '.signpath/artifact-configurations/windows-full.xml',
              '.signpath/artifact-configurations/windows-lite.xml',
          ]:
              ET.parse(path)
              print(f'{path}: XML ok')
          PY
      - name: Shell and YAML syntax
        run: |
          bash -n scripts/release.sh
          bash -n scripts/release-legacy.sh
          node -e "require('js-yaml').load(require('fs').readFileSync('.github/workflows/release.yml','utf8')); console.log('release.yml ok')"
      - name: Application readiness safety checks
        shell: bash
        run: |
          set -euo pipefail
          grep -n "SIGNPATH_FULL_ARTIFACT_CONFIGURATION_SLUG" .github/workflows/release.yml docs/CODE_SIGNING.md
          grep -n "SIGNPATH_LITE_ARTIFACT_CONFIGURATION_SLUG" .github/workflows/release.yml docs/CODE_SIGNING.md
          if grep -RIn "SIGNPATH_ARTIFACT_CONFIGURATION_SLUG" .github/workflows/release.yml docs/CODE_SIGNING.md scripts/lib/signpath-release-config.cjs scripts/check-signpath-release-config.mjs; then
            echo "legacy single Artifact Configuration variable remains in production configuration" >&2
            exit 1
          fi
          grep -n "toJSON(steps.package_version.outputs.version)" .github/workflows/release.yml
          grep -n "Ensure Release code signing policy" .github/workflows/release.yml
          grep -n "docs/CODE_SIGNING.md" .github/workflows/release.yml
          grep -n "docs/PRIVACY.md" .github/workflows/release.yml
          grep -n "product-name=\"Nowen Note\"" .signpath/artifact-configurations/windows-full.xml
          grep -n "product-name=\"Nowen Note Lite\"" .signpath/artifact-configurations/windows-lite.xml
          git diff --check origin/${{ github.base_ref }}...HEAD

  windows-fail-closed:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Export repository Authenticode records
        shell: pwsh
        run: ./scripts/export-windows-signatures.ps1 -Root . -Output "$env:TEMP\nowen-signatures.json"
      - name: Unsigned repository must not satisfy release policy
        shell: pwsh
        run: |
          node scripts/verify-windows-signatures.mjs --report "$env:TEMP\nowen-signatures.json" --publisher "invalid-test-publisher" --require full,lite
          if ($LASTEXITCODE -eq 0) {
            throw "unsigned/error-signature smoke unexpectedly passed"
          }
          Write-Host "unsigned/error-signature smoke rejected as expected"
          exit 0
