name: Apply complete offline workspace sync

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/src/db/offlineSyncMigration.ts"
      - "backend/src/routes/offline-sync.ts"
      - "backend/tests/offline-workspace-sync.test.ts"
      - "frontend/src/lib/offlineWorkspaceSync.ts"
      - "frontend/src/lib/__tests__/offlineWorkspaceSync.test.ts"
      - "frontend/src/components/settings/OfflineSyncSettings.tsx"
      - "scripts/apply-complete-offline-sync-review.py"
      - ".github/workflows/apply-complete-offline-sync.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Apply final hardening patches
        run: python3 scripts/apply-complete-offline-sync-review.py
      - name: Print generated backend route
        run: nl -ba backend/src/routes/offline-sync.ts | sed -n '215,250p'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend offline sync tests
        working-directory: frontend
        run: npm run test:run -- src/lib/__tests__/offlineWorkspaceSync.test.ts src/hooks/__tests__/useNetworkStatus.test.tsx
      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc -b
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Backend offline sync tests
        working-directory: backend
        run: node --import tsx --import ./tests/setup-db-isolation.ts --test tests/offline-workspace-sync.test.ts tests/notes-content-view.test.ts
      - name: Backend typecheck
        working-directory: backend
        run: npm run build:tsc
      - name: Commit hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend frontend
          if git diff --cached --quiet; then
            echo "No hardening changes to commit"
            exit 0
          fi
          git commit -m "fix(sync): harden complete offline workspace synchronization"
          git push origin HEAD:${{ github.head_ref }}
