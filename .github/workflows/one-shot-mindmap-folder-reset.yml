name: One-shot mind map folder reset

on:
  push:
    branches:
      - fix/mindmap-folder-content-reset

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Patch folder switching behavior
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          source_path = Path("frontend/src/components/MindMapEditor.tsx")
          raw = source_path.read_bytes()
          bom = b"\xef\xbb\xbf" if raw.startswith(b"\xef\xbb\xbf") else b""
          source = raw[len(bom):].decode("utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              source = source.replace(old, new, 1)

          replace_once(
              '  const saveTimerRef = useRef<ReturnType<typeof setTimeout> | null>(null);\n',
              '  const saveTimerRef = useRef<ReturnType<typeof setTimeout> | null>(null);\n'
              '  // 每次选择导图或切换目录都递增，用于丢弃已经失效的异步加载结果。\n'
              '  const mapLoadRequestRef = useRef(0);\n',
              "request generation ref",
          )

          marker = '  // 工作区切换：清空当前打开的导图 + 重拉列表，避免显示其他 scope 的图\n'
          if source.count(marker) != 1:
              raise SystemExit("clear helper marker not found exactly once")
          helper = '''  // 切换目录后不保留上一个导图，避免用户误以为目录没有切换成功。\n  // 同时递增请求序号，让切换前发出的 getMindMap 请求即使晚返回也不能恢复旧内容。\n  const clearActiveMap = useCallback(() => {\n    mapLoadRequestRef.current += 1;\n    setActiveMap(null);\n    setMapData(null);\n    setSelectedNodeId(null);\n    setSelectedNodeIds([]);\n    setEditingNodeId(null);\n    setFocusedNodeId(null);\n    setShowSearch(false);\n    setSearchQuery("");\n    setSearchResults([]);\n    setSearchIndex(0);\n  }, []);\n\n'''
          source = source.replace(marker, helper + marker, 1)

          replace_once(
              '''  useEffect(() => {\n    const onWs = () => {\n      setActiveMap(null);\n      setMapData(null);\n      setSelectedNodeId(null);\n      setSelectedNodeIds([]);\n      setEditingNodeId(null);\n      loadMaps();\n    };\n    window.addEventListener("nowen:workspace-changed", onWs);\n    return () => window.removeEventListener("nowen:workspace-changed", onWs);\n  }, [loadMaps]);\n''',
              '''  useEffect(() => {\n    const onWs = () => {\n      clearActiveMap();\n      loadMaps();\n    };\n    window.addEventListener("nowen:workspace-changed", onWs);\n    return () => window.removeEventListener("nowen:workspace-changed", onWs);\n  }, [clearActiveMap, loadMaps]);\n''',
              "workspace reset",
          )

          replace_once(
              '''  const handleSelect = useCallback(async (id: string) => {\n    try {\n      const map = await api.getMindMap(id);\n      setActiveMap(map);\n''',
              '''  const handleSelect = useCallback(async (id: string) => {\n    const requestId = ++mapLoadRequestRef.current;\n    try {\n      const map = await api.getMindMap(id);\n      if (requestId !== mapLoadRequestRef.current) return;\n      setActiveMap(map);\n''',
              "stale map load guard",
          )

          replace_once(
              '        setActiveMap(updated);\n',
              '        setActiveMap((current) => current?.id === updated.id ? updated : current);\n',
              "late save guard",
          )

          replace_once(
              '                    onClick={() => setExpandedFolders(prev => { const next = new Set(prev); if (next.has(folder.id)) next.delete(folder.id); else next.add(folder.id); return next; })}\n',
              '''                    onClick={() => {\n                      clearActiveMap();\n                      setExpandedFolders(prev => {\n                        const next = new Set(prev);\n                        if (next.has(folder.id)) next.delete(folder.id);\n                        else next.add(folder.id);\n                        return next;\n                      });\n                    }}\n''',
              "folder click reset",
          )

          source_path.write_bytes(bom + source.encode("utf-8"))

          test_path = Path("frontend/src/components/__tests__/MindMapUxGuards.test.ts")
          test_source = test_path.read_text(encoding="utf-8")
          addition = '''\n  it("clears stale mind map content when switching folders", () => {\n    expect(source).toContain("const mapLoadRequestRef = useRef(0)");\n    expect(source).toContain("const clearActiveMap = useCallback");\n    expect(source).toContain("const requestId = ++mapLoadRequestRef.current");\n    expect(source).toContain("if (requestId !== mapLoadRequestRef.current) return");\n    expect(source).toContain("setActiveMap((current) => current?.id === updated.id ? updated : current)");\n\n    const folderTree = source.slice(\n      source.indexOf("const renderFolder"),\n      source.indexOf("if (!hasResults && q)"),\n    );\n    expect(folderTree).toContain("clearActiveMap();");\n  });\n'''
          closing = test_source.rfind("\n});")
          if closing == -1:
              raise SystemExit("test suite closing marker not found")
          test_source = test_source[:closing] + addition + test_source[closing:]
          test_path.write_text(test_source, encoding="utf-8")
          PY

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run focused tests
        working-directory: frontend
        run: npm run test:run -- src/components/__tests__/MindMapUxGuards.test.ts

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Commit implementation
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-mindmap-folder-reset.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(mindmap): clear stale content when switching folders"
          git push origin HEAD:${GITHUB_REF_NAME}
