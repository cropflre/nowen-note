name: Task Native Reminder CI

on:
  pull_request:
    paths:
      - backend/src/index.ts
      - backend/src/routes/task-reminders.ts
      - backend/tests/task-reminders.test.ts
      - backend/tests/task-reminder-delivery-contract.test.ts
      - frontend/package.json
      - frontend/package-lock.json
      - frontend/android/app/capacitor.build.gradle
      - frontend/android/app/src/main/AndroidManifest.xml
      - frontend/android/capacitor.settings.gradle
      - frontend/src/App.tsx
      - frontend/src/components/TaskCenterImpl.tsx
      - frontend/src/components/tasks/ReminderCenter.tsx
      - frontend/src/components/tasks/TaskDetailPanel.tsx
      - frontend/src/components/tasks/useReminderNotifier.ts
      - frontend/src/lib/api.impl.ts
      - frontend/src/lib/taskNotificationSchedule.ts
      - frontend/src/lib/taskNotifications.ts
      - frontend/src/lib/__tests__/taskNotificationSchedule.test.ts
      - .github/workflows/task-native-reminder-ci.yml
  push:
    branches:
      - main
    paths:
      - backend/src/index.ts
      - backend/src/routes/task-reminders.ts
      - backend/tests/task-reminders.test.ts
      - backend/tests/task-reminder-delivery-contract.test.ts
      - frontend/package.json
      - frontend/package-lock.json
      - frontend/android/app/capacitor.build.gradle
      - frontend/android/app/src/main/AndroidManifest.xml
      - frontend/android/capacitor.settings.gradle
      - frontend/src/App.tsx
      - frontend/src/components/TaskCenterImpl.tsx
      - frontend/src/components/tasks/ReminderCenter.tsx
      - frontend/src/components/tasks/TaskDetailPanel.tsx
      - frontend/src/components/tasks/useReminderNotifier.ts
      - frontend/src/lib/api.impl.ts
      - frontend/src/lib/taskNotificationSchedule.ts
      - frontend/src/lib/taskNotifications.ts
      - frontend/src/lib/__tests__/taskNotificationSchedule.test.ts
      - .github/workflows/task-native-reminder-ci.yml

permissions:
  contents: read

jobs:
  frontend-native:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Native reminder regressions
        working-directory: frontend
        run: npx vitest run src/lib/__tests__/taskNotificationSchedule.test.ts

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: |
          npx cap sync android
          git diff --exit-code -- android/app/capacitor.build.gradle android/capacitor.settings.gradle

  backend-delivery:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Backend typecheck
        working-directory: backend
        run: npx tsc --noEmit

      - name: Reminder delivery regressions
        working-directory: backend
        run: npx tsx --test tests/task-reminders.test.ts tests/task-reminder-delivery-contract.test.ts
