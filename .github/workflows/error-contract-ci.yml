name: Error Contract CI

on:
  workflow_dispatch:
  push:
    branches: ["release/v1.5.1"]
    paths:
      - "backend/src/middleware/request-logging.ts"
      - "backend/src/middleware/request-error.ts"
      - "backend/src/index.ts"
      - "backend/src/services/note-write-observability.ts"
      - "backend/tests/request-logging.test.ts"
      - "backend/src/lib/tiptap-note-format.ts"
      - "backend/src/routes/notes.ts"
      - "backend/scripts/inspect-note-formats.ts"
      - "backend/tests/tiptap-note-format.test.ts"
      - "frontend/src/lib/noteAttachmentAccessBridge.ts"
      - "frontend/src/hooks/useAttachmentImageRenderSource.ts"
      - "frontend/src/hooks/useAttachmentVideoRenderSource.ts"
      - "frontend/src/components/MarkdownVideoPreview.tsx"
      - "frontend/src/components/MarkdownPreview.tsx"
      - "frontend/src/lib/htmlPreviewAssets.ts"
      - "frontend/src/lib/__tests__/htmlPreviewAssets.test.ts"
      - "frontend/src/lib/__tests__/noteAttachmentAccessBridge.test.ts"
      - "frontend/src/lib/__tests__/markdownVideoSyntax.test.ts"
      - ".github/workflows/error-contract-ci.yml"
  pull_request:
    paths:
      - "backend/src/lib/app-error.ts"
      - "backend/src/middleware/request-error.ts"
      - "backend/src/middleware/request-logging.ts"
      - "backend/src/services/note-write-observability.ts"
      - "backend/tests/request-logging.test.ts"
      - "backend/src/index.ts"
      - "backend/src/sync/errors.ts"
      - "backend/src/sync/blob.ts"
      - "backend/src/services/full-backup-jobs.ts"
      - "backend/src/lib/backup-error-response.ts"
      - "backend/src/routes/backups.ts"
      - "backend/src/lib/attachment-error-response.ts"
      - "backend/src/routes/attachments-core.ts"
      - "backend/tests/attachment-error-response.test.ts"
      - "backend/tests/backup-error-response.test.ts"
      - "backend/tests/sync-blob-error-contract.test.ts"
      - "backend/tests/full-backup-jobs.test.ts"
      - "backend/tests/request-error-contract.test.ts"
      - "frontend/src/lib/httpError.ts"
      - "frontend/src/lib/api.impl.ts"
      - "frontend/src/lib/fullBackupJobClient.ts"
      - "frontend/src/lib/supportError.ts"
      - "frontend/src/lib/uploadRequest.ts"
      - "frontend/src/lib/__tests__/uploadRequest.test.ts"
      - "frontend/src/lib/__tests__/supportError.test.ts"
      - "frontend/src/components/SystemFullDataTransferBridge.tsx"
      - "frontend/src/components/dataManagement/BackupCenter.tsx"
      - "frontend/src/lib/__tests__/fullBackupJobClient.test.ts"
      - "frontend/src/lib/syncLocalApi.ts"
      - "frontend/src/lib/__tests__/httpError.test.ts"
      - "backend/src/lib/tiptap-note-format.ts"
      - "backend/src/routes/notes.ts"
      - "backend/scripts/inspect-note-formats.ts"
      - "backend/tests/tiptap-note-format.test.ts"
      - "frontend/src/lib/noteAttachmentAccessBridge.ts"
      - "frontend/src/hooks/useAttachmentImageRenderSource.ts"
      - "frontend/src/hooks/useAttachmentVideoRenderSource.ts"
      - "frontend/src/components/MarkdownVideoPreview.tsx"
      - "frontend/src/components/MarkdownPreview.tsx"
      - "frontend/src/lib/htmlPreviewAssets.ts"
      - "frontend/src/lib/__tests__/htmlPreviewAssets.test.ts"
      - "frontend/src/lib/__tests__/noteAttachmentAccessBridge.test.ts"
      - "frontend/src/lib/__tests__/markdownVideoSyntax.test.ts"
      - ".github/workflows/error-contract-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Backend typecheck
        run: npm run build:tsc -- --pretty false
      - name: Request correlation and error response contract
        run: >-
          node --import tsx --import ./tests/setup-db-isolation.ts --test
          tests/request-error-contract.test.ts
          tests/request-logging.test.ts
          tests/tiptap-note-format.test.ts
          tests/sync-blob-error-contract.test.ts
          tests/full-backup-jobs.test.ts
          tests/backup-error-response.test.ts
          tests/attachment-error-response.test.ts

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Frontend typecheck
        run: npx tsc -b
      - name: Error response regression
        run: npm run test:run -- src/lib/__tests__/httpError.test.ts src/lib/__tests__/fullBackupJobClient.test.ts src/lib/__tests__/supportError.test.ts src/lib/__tests__/uploadRequest.test.ts src/lib/__tests__/htmlPreviewAssets.test.ts src/lib/__tests__/noteAttachmentAccessBridge.test.ts src/lib/__tests__/markdownVideoSyntax.test.ts
