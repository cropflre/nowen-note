name: Error Contract CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/src/lib/app-error.ts"
      - "backend/src/middleware/request-error.ts"
      - "backend/src/index.ts"
      - "backend/tests/request-error-contract.test.ts"
      - "frontend/src/lib/httpError.ts"
      - "frontend/src/lib/api.impl.ts"
      - "frontend/src/lib/syncLocalApi.ts"
      - "frontend/src/lib/__tests__/httpError.test.ts"
      - ".github/workflows/error-contract-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Backend typecheck
        run: npm run build:tsc -- --pretty false
      - name: Request correlation and error response contract
        run: node --import tsx --import ./tests/setup-db-isolation.ts --test tests/request-error-contract.test.ts

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Frontend typecheck
        run: npx tsc -b
      - name: Error response regression
        run: npm run test:run -- src/lib/__tests__/httpError.test.ts
