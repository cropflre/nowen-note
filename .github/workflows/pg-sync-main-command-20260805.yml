name: PostgreSQL Sync Latest Main Command 20260805

on:
  push:
    branches: [pg-migration-unified]
    paths: [.github/workflows/pg-sync-main-command-20260805.yml]

permissions:
  contents: write

concurrency:
  group: pg-sync-latest-main-command
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pg-migration-unified
          fetch-depth: 0

      - name: Merge latest main with strict three-way resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          main="$(git rev-parse origin/main)"
          echo "branch before: $(git rev-parse HEAD)"
          echo "main:          $main"

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort -u)
            printf 'conflicts (%s):\n' "${#conflicts[@]}"
            printf ' - %s\n' "${conflicts[@]}"

            for path in "${conflicts[@]}"; do
              for side in ours base theirs result; do
                mkdir -p "$(dirname "/tmp/pg-merge/$side/$path")"
              done
              git show ":2:$path" > "/tmp/pg-merge/ours/$path"
              git show ":1:$path" > "/tmp/pg-merge/base/$path"
              git show ":3:$path" > "/tmp/pg-merge/theirs/$path"

              if [ "$path" = "backend/src/middleware/acl.ts" ]; then
                cp "/tmp/pg-merge/ours/$path" "$path"
                python3 - <<'PY'
          from pathlib import Path
          p = Path("backend/src/middleware/acl.ts")
          s = p.read_text()
          imp = '''import {
            resolveNoteNotebookMemberPermission,
            resolveNotebookMemberPermission,
          } from "../services/notebook-permissions";
          '''
          extra = '''import {
            capabilitiesToLegacyPermission,
            resolveResourceKnowledgeAccess,
          } from "../services/knowledgeCapabilities";
          '''
          if s.count(imp) != 1: raise SystemExit("ACL import anchor mismatch")
          s = s.replace(imp, imp + extra, 1)
          note = '  if (!note) return { permission: null, workspaceId: null, noteOwnerId: null };\n\n'
          note_extra = '''  const knowledgeAccess = resolveResourceKnowledgeAccess("note", noteId, userId);
            if (knowledgeAccess.nodeId) {
              return {
                permission: capabilitiesToLegacyPermission(knowledgeAccess.capabilities),
                workspaceId: note.workspaceId,
                noteOwnerId: note.userId,
              };
            }

          '''
          if s.count(note) != 1: raise SystemExit("ACL note anchor mismatch")
          s = s.replace(note, note + note_extra, 1)
          notebook = '  if (!nb) return { permission: null, workspaceId: null, notebookOwnerId: null };\n\n'
          notebook_extra = '''  const knowledgeAccess = resolveResourceKnowledgeAccess("notebook", notebookId, userId);
            if (knowledgeAccess.nodeId) {
              return {
                permission: capabilitiesToLegacyPermission(knowledgeAccess.capabilities),
                workspaceId: nb.workspaceId,
                notebookOwnerId: nb.userId,
              };
            }

          '''
          if s.count(notebook) != 1: raise SystemExit("ACL notebook anchor mismatch")
          p.write_text(s.replace(notebook, notebook + notebook_extra, 1))
          PY
                git add "$path"
                continue
              fi

              if [ "$path" = "backend/src/routes/task-reminders.ts" ]; then
                cp "/tmp/pg-merge/ours/$path" "$path"
                python3 - <<'PY'
          from pathlib import Path
          route = Path("backend/src/routes/task-reminders.ts")
          s = route.read_text()
          old_import = '''  TaskReminderDueCandidate,
            TaskReminderOverviewRow,
          } from "../repositories/taskReminderOperationsRepository";
          '''
          new_import = '''  TaskReminderDueCandidate,
            TaskReminderOverviewRow,
            TaskReminderScheduleRow,
          } from "../repositories/taskReminderOperationsRepository";
          '''
          if s.count(old_import) != 1: raise SystemExit("task reminder type import anchor mismatch")
          s = s.replace(old_import, new_import, 1)
          anchor = '''taskReminders.post("/test-now", (c) => {
            const result = scanDueReminders();
            return c.json({ count: result.length, reminders: result });
          });

          '''
          schedule = '''// GET /schedule -- all future reminders for native client scheduling.
          taskReminders.get("/schedule", async (c) => {
            const userId = c.req.header("X-User-Id");
            if (!userId) return c.json({ error: "Unauthorized" }, 401);
            const rows = await taskReminderOperationsRepository.listScheduleAsync(userId);
            const now = Date.now();
            const reminders = rows.flatMap((row: TaskReminderScheduleRow) => {
              if (toIntegerBoolean(row.enabled) !== 1 || toIntegerBoolean(row.isCompleted) === 1) return [];
              if (row.workspaceId && !getUserWorkspaceRole(row.workspaceId, userId)) return [];
              const reminderAt = resolveReminderAt(row);
              if (!reminderAt) return [];
              const reminderMs = new Date(reminderAt).getTime();
              if (!Number.isFinite(reminderMs) || reminderMs <= now) return [];
              return [{
                reminderId: row.reminderId,
                taskId: row.taskId,
                taskTitle: row.taskTitle,
                reminderAt,
                dueAt: row.dueAt,
                dueDate: row.dueDate,
                snoozedUntil: row.snoozedUntil,
                offsetMinutes: Number(row.offsetMinutes || 0),
              }];
            }).sort((a, b) => new Date(a.reminderAt).getTime() - new Date(b.reminderAt).getTime())
              .slice(0, 1000);
            return c.json({ reminders });
          });

          '''
          if s.count(anchor) != 1: raise SystemExit("task reminder test-now anchor mismatch")
          route.write_text(s.replace(anchor, anchor + schedule, 1))

          repo = Path("backend/src/repositories/taskReminderOperationsRepository.ts")
          r = repo.read_text()
          interface_anchor = '''export interface TaskReminderDueCandidate {
            reminderId: string;
            taskId: string;
            userId: string;
            offsetMinutes: number;
            lastNotifiedAt: string | null;
            snoozedUntil: string | null;
            taskTitle: string;
            dueAt: string | null;
            dueDate: string | null;
            isCompleted: number;
          }

          '''
          interface_extra = '''export interface TaskReminderScheduleRow extends TaskReminderOverviewRow {
            workspaceId: string | null;
          }

          '''
          if r.count(interface_anchor) != 1: raise SystemExit("schedule interface anchor mismatch")
          r = r.replace(interface_anchor, interface_anchor + interface_extra, 1)
          method_anchor = '''  /** SQLite compatibility path used by the existing synchronous notification scanner. */
            listDueCandidates(): TaskReminderDueCandidate[] {
          '''
          method = '''  async listScheduleAsync(userId: string): Promise<TaskReminderScheduleRow[]> {
              return getDatabaseAdapter().queryMany<TaskReminderScheduleRow>(
                `SELECT r.id AS "reminderId", r."taskId", r."offsetMinutes", r.enabled,
                        r."lastNotifiedAt", r."snoozedUntil", t.title AS "taskTitle",
                        t.status AS "taskStatus", t."isCompleted", t."dueDate", t."dueAt",
                        t."workspaceId"
                   FROM task_reminders r
                   JOIN tasks t ON t.id = r."taskId"
                  WHERE r."userId" = ?
                  ORDER BY r."createdAt" DESC`,
                [userId],
              );
            },

          '''
          if r.count(method_anchor) != 1: raise SystemExit("schedule repository method anchor mismatch")
          repo.write_text(r.replace(method_anchor, method + method_anchor, 1))
          PY
                git add "$path" backend/src/repositories/taskReminderOperationsRepository.ts
                continue
              fi

              set +e
              git merge-file -p "/tmp/pg-merge/ours/$path" "/tmp/pg-merge/base/$path" "/tmp/pg-merge/theirs/$path" > "/tmp/pg-merge/result/$path"
              file_status=$?
              set -e

              if [ "$path" = "backend/src/routes/attachments.ts" ] && [ "$file_status" -ne 0 ]; then
                python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("/tmp/pg-merge/result/backend/src/routes/attachments.ts")
          s = p.read_text()
          pattern = re.compile(r'<<<<<<<[^\n]*\n\s*return hasCompleteSignature \|\| verifiedUserId\n\s*\? hardenScopedResponse\(response\)\n\s*: response;\n=======\n\s*return hardenScopedResponse\(response\);\n>>>>>>>[^\n]*\n')
          s, count = pattern.subn('  return hardenScopedResponse(response);\n', s)
          if count != 1 or '<<<<<<<' in s: raise SystemExit("attachment conflict block mismatch")
          p.write_text(s)
          PY
                file_status=0
              fi

              if [ "$path" = "backend/src/services/realtime.ts" ] && [ "$file_status" -ne 0 ]; then
                python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("/tmp/pg-merge/result/backend/src/services/realtime.ts")
          s = p.read_text()
          pattern = re.compile(r'<<<<<<<[^\n]*\n.*?=======\n(.*?)>>>>>>>[^\n]*\n', re.S)
          s, count = pattern.subn(lambda match: match.group(1), s)
          if count != 1 or '<<<<<<<' in s: raise SystemExit("realtime conflict block mismatch")
          p.write_text(s)
          PY
                file_status=0
              fi

              if [ "$file_status" -ne 0 ]; then
                echo "Unresolved overlapping edits in $path"
                cat "/tmp/pg-merge/result/$path"
                exit 1
              fi
              cp "/tmp/pg-merge/result/$path" "$path"
              git add "$path"
            done
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            git diff --name-only --diff-filter=U
            exit 1
          fi

          rm -f .github/workflows/pg-sync-main-command-20260805.yml
          git add -A
          git commit -m "Merge latest main into pg-migration-unified" \
            -m "Sync main@${main} before the Note Transfer move source-deletion migration. Preserve main product behavior and PostgreSQL repository boundaries through strict three-way resolution."
          git push origin HEAD:pg-migration-unified
