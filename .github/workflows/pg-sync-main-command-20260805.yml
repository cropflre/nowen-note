name: PostgreSQL Sync Latest Main Command 20260805

on:
  push:
    branches:
      - pg-migration-unified
    paths:
      - .github/workflows/pg-sync-main-command-20260805.yml

permissions:
  contents: write

concurrency:
  group: pg-sync-latest-main-command
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pg-migration-unified
          fetch-depth: 0

      - name: Merge latest main with strict three-way resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          before="$(git rev-parse HEAD)"
          main="$(git rev-parse origin/main)"
          echo "branch before: $before"
          echo "main:          $main"

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort -u)
            printf 'conflicts (%s):\n' "${#conflicts[@]}"
            printf ' - %s\n' "${conflicts[@]}"

            for path in "${conflicts[@]}"; do
              mkdir -p "$(dirname "/tmp/pg-merge/ours/$path")" \
                       "$(dirname "/tmp/pg-merge/base/$path")" \
                       "$(dirname "/tmp/pg-merge/theirs/$path")" \
                       "$(dirname "/tmp/pg-merge/result/$path")"

              git show ":2:$path" > "/tmp/pg-merge/ours/$path"
              git show ":1:$path" > "/tmp/pg-merge/base/$path"
              git show ":3:$path" > "/tmp/pg-merge/theirs/$path"

              if [ "$path" = "backend/src/middleware/acl.ts" ]; then
                cp "/tmp/pg-merge/ours/$path" "$path"
                python3 - <<'PY'
          from pathlib import Path

          path = Path("backend/src/middleware/acl.ts")
          text = path.read_text()

          permission_import = '''import {
            resolveNoteNotebookMemberPermission,
            resolveNotebookMemberPermission,
          } from "../services/notebook-permissions";
          '''
          knowledge_import = '''import {
            capabilitiesToLegacyPermission,
            resolveResourceKnowledgeAccess,
          } from "../services/knowledgeCapabilities";
          '''
          if text.count(permission_import) != 1:
              raise SystemExit("ACL permission import anchor mismatch")
          text = text.replace(permission_import, permission_import + knowledge_import, 1)

          note_anchor = '''  if (!note) return { permission: null, workspaceId: null, noteOwnerId: null };

          '''
          note_access = '''  const knowledgeAccess = resolveResourceKnowledgeAccess("note", noteId, userId);
            if (knowledgeAccess.nodeId) {
              return {
                permission: capabilitiesToLegacyPermission(knowledgeAccess.capabilities),
                workspaceId: note.workspaceId,
                noteOwnerId: note.userId,
              };
            }

          '''
          if text.count(note_anchor) != 1:
              raise SystemExit("ACL note anchor mismatch")
          text = text.replace(note_anchor, note_anchor + note_access, 1)

          notebook_anchor = '''  if (!nb) return { permission: null, workspaceId: null, notebookOwnerId: null };

          '''
          notebook_access = '''  const knowledgeAccess = resolveResourceKnowledgeAccess("notebook", notebookId, userId);
            if (knowledgeAccess.nodeId) {
              return {
                permission: capabilitiesToLegacyPermission(knowledgeAccess.capabilities),
                workspaceId: nb.workspaceId,
                notebookOwnerId: nb.userId,
              };
            }

          '''
          if text.count(notebook_anchor) != 1:
              raise SystemExit("ACL notebook anchor mismatch")
          text = text.replace(notebook_anchor, notebook_anchor + notebook_access, 1)
          path.write_text(text)
          PY
                git add "$path"
                continue
              fi

              set +e
              git merge-file -p \
                "/tmp/pg-merge/ours/$path" \
                "/tmp/pg-merge/base/$path" \
                "/tmp/pg-merge/theirs/$path" \
                > "/tmp/pg-merge/result/$path"
              file_status=$?
              set -e

              if [ "$file_status" -ne 0 ]; then
                echo "Unresolved overlapping edits in $path"
                cat "/tmp/pg-merge/result/$path"
                exit 1
              fi

              cp "/tmp/pg-merge/result/$path" "$path"
              git add "$path"
            done
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unmerged paths remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          rm -f .github/workflows/pg-sync-main-command-20260805.yml
          git add -A
          git commit -m "Merge latest main into pg-migration-unified" \
            -m "Sync main@${main} before the Note Transfer move source-deletion migration. Preserve both main product behavior and PostgreSQL migration boundaries through strict three-way file resolution."
          git push origin HEAD:pg-migration-unified
