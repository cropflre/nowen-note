name: Apply Issue 612 title lifecycle safety

on:
  pull_request:
    paths:
      - ".github/workflows/issue-612-title-lifecycle-apply.yml"
      - ".github/scripts/issue612_title_lifecycle_patch.py"

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.pull_request.head.ref == 'fix/issue-612-data-protection' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply title lifecycle patch
        run: python .github/scripts/issue612_title_lifecycle_patch.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run lifecycle and draft regressions
        working-directory: frontend
        run: >-
          npm run test:run --
          src/lib/__tests__/editorLifecycleSafety.test.ts
          src/lib/__tests__/draftStorage.conflict.test.ts
      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc -b
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/issue-612-title-lifecycle-patch.yml
          git rm -f .github/workflows/issue-612-title-lifecycle-apply.yml
          git rm -f .github/scripts/issue612_title_lifecycle_patch.py
          git add -A
          git commit -m "fix(editor): preserve title edits across lifecycle events (#612)"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
