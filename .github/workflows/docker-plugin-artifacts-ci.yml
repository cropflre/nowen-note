name: Docker Plugin Artifacts CI

on:
  pull_request:
    paths: ["Dockerfile", "backend/**", ".github/workflows/docker-plugin-artifacts-ci.yml"]
  push:
    branches: [main, release/v1.5.0]
    paths: ["Dockerfile", "backend/**", ".github/workflows/docker-plugin-artifacts-ci.yml"]

permissions:
  contents: read

jobs:
  final-image-plugin-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag nowen-plugin-smoke:${{ github.sha }} .
      - name: Execute plugins from final image with production dependencies
        run: >-
          docker run --rm --entrypoint node nowen-plugin-smoke:${{ github.sha }}
          backend/scripts/smoke-plugin-artifacts.cjs
