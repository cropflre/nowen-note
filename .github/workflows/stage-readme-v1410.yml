name: Stage README v1.4.10 refresh

on:
  push:
    branches:
      - docs/readme-v1.4.10
    paths:
      - .github/workflows/stage-readme-v1410.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/readme-v1.4.10
          fetch-depth: 0

      - name: Refresh Chinese and English READMEs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          cn_path = Path('README.md')
          en_path = Path('README.en.md')
          cn = cn_path.read_text()
          en = en_path.read_text()

          cn_top = '''## v1.4.10 已发布

          v1.4.10 聚焦 **编辑效率、移动端媒体稳定性、离线附件恢复、知识树体验与任务提醒可靠性**，并继续补齐模板、导入导出和桌面端细节。

          - 标题录入新增重复前缀提示，长标题支持自动换行；Markdown 查找替换进一步优化，并新增“当前目录笔记搜索”。
          - 知识树支持拖拽调整节点层级；加密目录中的笔记不会泄露到不应展示的位置。
          - 图片预览新增旋转与独立复原，富文本粘贴默认保留文字颜色与跨笔记格式；桌面端增加原生文本右键菜单，并可用系统默认程序打开本地办公附件。
          - Android / 移动端强化图片、视频上传文件身份与 multipart 上传稳定性，并将图片和视频入口加入紧凑工具栏。
          - 离线附件增加损坏 Blob 校验、隔离与恢复信号，避免异常离线缓存污染在线渲染；离线同步默认关闭，由用户主动启用。
          - 任务提醒补齐创建端时区、全天截止和 PostgreSQL Schema 一致性；同时修复备份保留、思源导入和 Markdown 附件 ZIP 往返导入等问题。

          查看：[v1.4.10 Release](https://github.com/cropflre/nowen-note/releases/tag/v1.4.10) · [完整更新日志](./CHANGELOG.md)

          '''
          cn_top = re.sub(r'^          ', '', cn_top, flags=re.M)

          cn_recent = '''## v1.4.10 重点更新

          ### 编辑器与检索

          - 标题录入新增重复前缀警示：输入过程中即可发现与现有标题的重复前缀，确认后恢复正常标题样式；超长标题会根据编辑区域自动换行。
          - Markdown 查找 / 替换继续优化，搜索面板在窄宽度下可正确换行，并新增当前目录范围的笔记搜索。
          - 富文本跨笔记复制默认保留格式与文字颜色，减少粘贴后重新排版的成本。

          ### 图片、附件与移动端

          - 图片查看器加入旋转和独立复原操作，并修复全屏预览后的旋转状态保持问题。
          - 移动端图片 / 视频上传保留原始 File 身份，稳定 DataTransfer、上传队列、进度映射与 multipart 上传链路，同时校验视频实际字节大小。
          - 紧凑移动工具栏加入图片和视频入口，短屏设备上的笔记菜单与设置页关闭按钮也进一步适配。
          - 离线附件增加 Blob 有效性校验、损坏缓存隔离和恢复信号，异常离线数据不会继续污染在线渲染。

          ### 知识树、模板与导入导出

          - 知识树支持拖拽改变节点层级，并继续收紧加密目录内容的展示边界。
          - 笔记模板支持保存模板、从模板新建、移动端入口和应用内保存弹窗，同时保护模板附件不被清理任务误删。
          - 修复 Markdown 附件 ZIP 往返导入，完善思源导入的拖拽识别、恢复目录持久化和无响应提示。

          ### 任务、备份与桌面体验

          - 任务提醒补齐创建端时区、服务端解析、全天截止语义和 PostgreSQL 字段 / 迁移一致性，快速捕获与普通创建保持相同行为。
          - 备份保留策略统一 db-only 清理逻辑，并持久化停用配置，减少自动与手动备份行为差异。
          - 桌面编辑器新增原生文本右键菜单；本地 Office 等附件可直接交给系统默认程序打开。
          - 下载页增强 GitHub Release 资产回退与平台分组，国内 / 网络受限场景下更容易找到正确安装包。

          完整记录请查看 [CHANGELOG.md](./CHANGELOG.md) 和 [v1.4.10 Release](https://github.com/cropflre/nowen-note/releases/tag/v1.4.10)。

          '''
          cn_recent = re.sub(r'^          ', '', cn_recent, flags=re.M)

          en_top = '''## v1.4.10 is available

          v1.4.10 focuses on **faster editing, more reliable mobile media uploads, offline attachment recovery, knowledge-tree usability, and reminder correctness**, while expanding templates, import/export, and desktop integration.

          - Added duplicate-title prefix warnings while typing, automatic wrapping for long titles, improved Markdown find/replace, and current-directory note search.
          - Added drag-to-change hierarchy in the knowledge tree and tightened visibility rules for notes inside encrypted directories.
          - Added image rotation and independent reset controls; rich-text paste now preserves text color and cross-note formatting more consistently. Desktop builds also gain native text context menus and system-default opening for local office files.
          - Hardened Android/mobile image and video uploads by preserving original file identity, stabilizing multipart uploads, and exposing image/video actions in the compact toolbar.
          - Added offline attachment validation, quarantine, and recovery signaling so broken cached blobs do not leak into online rendering. Offline sync now starts disabled until explicitly enabled.
          - Made reminder creation timezone-aware with safer date-only deadlines and PostgreSQL schema parity, while fixing backup retention, SiYuan import feedback, and Markdown attachment ZIP round trips.

          See the [v1.4.10 Release](https://github.com/cropflre/nowen-note/releases/tag/v1.4.10) and the [full changelog](./CHANGELOG.md).

          '''
          en_top = re.sub(r'^          ', '', en_top, flags=re.M)

          en_recent = '''## Recent highlights

          ### v1.4.10 · 2026-08-12

          #### Editing and search

          - Duplicate-title prefix warnings surface possible duplicates while a title is being entered, and long titles now wrap within the editor instead of overflowing.
          - Markdown find/replace has a more resilient narrow-width layout, and search can be scoped to notes in the current directory.
          - Rich-text copy/paste between notes preserves formatting and text colors more consistently.

          #### Images, attachments, and mobile

          - The image viewer adds rotation and independent reset controls, with rotation state preserved correctly in fullscreen mode.
          - Mobile image/video uploads keep original File identity across DataTransfer, queue, progress, and multipart boundaries, with real uploaded video size validation.
          - Image and video actions are available in the compact mobile toolbar, while short-viewport menus and scrolling settings surfaces receive additional layout fixes.
          - Offline attachment blobs are validated, quarantined when corrupted, and surfaced through a recovery signal instead of contaminating online rendering.

          #### Knowledge tree, templates, and import/export

          - Knowledge-tree nodes can be dragged across hierarchy levels, and encrypted-directory visibility boundaries are tightened.
          - Note templates support saving, creating notes from templates, mobile entry points, an in-app save dialog, and cleanup protection for template attachments.
          - Markdown attachment ZIP round-trip import is fixed, while SiYuan import gets better drag recognition, recovery-directory persistence, and no-response feedback.

          #### Tasks, backups, and desktop integration

          - Reminder scheduling now preserves creator timezone context, date-only deadline semantics, and PostgreSQL migration/schema parity across normal creation and quick capture.
          - db-only backup retention is unified for automatic and manual backups, including persistence of disabled backup settings.
          - Desktop builds add a native text context menu and can open local office attachments with the operating system's default application.
          - Release downloads gain stronger GitHub asset fallback and stable platform/install-type grouping.

          See [CHANGELOG.md](./CHANGELOG.md) and the [v1.4.10 Release](https://github.com/cropflre/nowen-note/releases/tag/v1.4.10) for complete details.

          '''
          en_recent = re.sub(r'^          ', '', en_recent, flags=re.M)

          def sub_once(text, pattern, replacement, label):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {count}')
              return updated

          cn = sub_once(cn, r'## v1\.4\.6 已发布\n.*?(?=## 为什么选择 Nowen Note)', cn_top, 'cn release hero')
          cn = sub_once(cn, r'## v1\.4\.6 重点更新\n.*?(?=## 截图)', cn_recent, 'cn highlights')
          en = sub_once(en, r'## v1\.4\.6 is available\n.*?(?=## Connect AI clients to Nowen Note)', en_top, 'en release hero')
          en = sub_once(en, r'## Recent highlights\n.*?(?=## Screenshots)', en_recent, 'en highlights')

          cn = cn.replace(
              '> v1.4.6 重点修复同步误冲突与重复副本，并优化权限、前端加载、Android 图片预览和任务提醒。升级后建议检查登录、笔记编辑、附件、任务、每日记录、权限和备份功能。镜像回滚不等于数据库回滚，生产环境必须保留独立备份。',
              '> v1.4.10 重点改善标题与 Markdown 编辑、知识树层级拖拽、移动端媒体上传、离线附件恢复和跨时区任务提醒。升级后建议重点检查登录、笔记编辑、图片 / 视频上传、离线附件、任务提醒、模板、导入导出和备份。镜像回滚不等于数据库回滚，生产环境必须保留独立备份。',
          )
          en = en.replace(
              '> v1.4.6 specifically improves conflict handling, permissions, frontend loading, Android image preview, and task reminders. After upgrading, verify sign-in, note editing, attachments, tasks, daily records, permissions, and backups. Rolling back an image does not roll back the database.',
              '> v1.4.10 specifically improves title and Markdown editing, knowledge-tree hierarchy changes, mobile media uploads, offline attachment recovery, and timezone-aware reminders. After upgrading, verify sign-in, note editing, image/video uploads, offline attachments, reminders, templates, import/export, and backups. Rolling back an image does not roll back the database.',
          )

          cn = cn.replace('支持根目录文档、无限层级、拖拽排序、统一创建菜单', '支持根目录文档、无限层级、拖拽排序与层级调整、统一创建菜单')
          cn = cn.replace('媒体嵌入、评论和版本历史。', '媒体嵌入、跨笔记格式粘贴、标题重复前缀提示、评论和版本历史。')
          cn = cn.replace('全文搜索、文内查找替换、双向链接', '全文搜索、当前目录笔记搜索、文内查找替换、双向链接')
          cn = cn.replace('支持个人空间、共享目录和工作区离线副本，并针对误冲突、重复副本和格式转换状态做保护。', '支持个人空间、共享目录和工作区离线副本，并针对误冲突、重复副本和格式转换状态做保护；离线附件支持损坏 Blob 校验、隔离与恢复。')
          cn = cn.replace('以及 Android 原生任务提醒调度。', '以及 Android 原生任务提醒调度，并补齐创建端时区、全天截止与服务端解析一致性。')
          cn = cn.replace('以及本地磁盘、S3、R2、MinIO。', '以及本地磁盘、S3、R2、MinIO，并强化移动端图片 / 视频文件身份与 multipart 上传稳定性。')

          en = en.replace('drag sorting, a unified create menu', 'drag sorting, drag-to-change hierarchy, a unified create menu')
          en = en.replace('media embeds, comments, and version history.', 'media embeds, cross-note format-preserving paste, duplicate-title prefix warnings, comments, and version history.')
          en = en.replace('full-text search, in-document find and replace', 'full-text search, current-directory note search, improved in-document find and replace')
          en = en.replace('v1.4.6 hardens false-conflict handling, duplicate-copy prevention, serial saves, and Yjs state preservation across Markdown/rich-text format transitions.', 'v1.4.10 adds offline attachment validation, quarantine, and recovery signaling while keeping serial saves and Yjs state protection across Markdown/rich-text format transitions.')
          en = en.replace('native Android reminder scheduling, and mind maps.', 'native Android reminder scheduling with creator-timezone/date-only deadline consistency, and mind maps.')
          en = en.replace('and local disk or S3/R2/MinIO storage.', 'local disk or S3/R2/MinIO storage, plus hardened mobile image/video file identity and multipart uploads.')

          cn = cn.replace('v1.4.6', 'v1.4.10')
          en = en.replace('v1.4.6', 'v1.4.10')

          if 'v1.4.6' in cn or 'v1.4.6' in en:
              raise SystemExit('stale v1.4.6 references remain')
          if '## v1.4.10 已发布' not in cn or '## v1.4.10 重点更新' not in cn:
              raise SystemExit('Chinese v1.4.10 sections missing')
          if '## v1.4.10 is available' not in en or '### v1.4.10 · 2026-08-12' not in en:
              raise SystemExit('English v1.4.10 sections missing')

          cn_path.write_text(cn)
          en_path.write_text(en)
          PY

          git diff --check
          grep -q 'NOWEN_IMAGE_TAG=v1.4.10' README.md
          grep -q 'NOWEN_IMAGE_TAG=v1.4.10' README.en.md
          grep -q 'cropflre/nowen-note:v1.4.10' README.md
          grep -q 'cropflre/nowen-note:v1.4.10' README.en.md

      - name: Commit staged README refresh
        shell: bash
        run: |
          git config user.name 'Drug'
          git config user.email 'cropflre2333@gmail.com'
          git add README.md README.en.md
          git diff --cached --check
          git commit -m 'docs(readme): update v1.4.10 release highlights'
          git push origin HEAD:docs/readme-v1.4.10
