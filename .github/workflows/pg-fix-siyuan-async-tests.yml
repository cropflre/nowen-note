name: Reconcile Siyuan async import tests

on:
  push:
    branches: [pg-migration-unified]
    paths:
      - ".github/workflows/pg-fix-siyuan-async-tests.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pg-migration-unified
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Update async route contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          import_test = Path("backend/tests/siyuan-package-import.test.ts")
          text = import_test.read_text()
          pattern = re.compile(r'test\("route import matches service behavior for target notebook and workspace writes", async \(\) => \{.*?\n\}\);\n\ntest\("service import stores Tiptap JSON', re.S)
          replacement = r'''test("route import matches service behavior for target notebook and workspace writes", async () => {
            const zipPath = await writeFixtureZip("route-import.zip");
            const form = new FormData();
            form.set("file", new File([fs.readFileSync(zipPath)], "route-import.zip", { type: "application/zip" }));

            const res = await app.request(
              `/export/import/siyuan-package?workspaceId=${WORKSPACE_ID}&targetNotebookId=${TARGET_NOTEBOOK_ID}&contentFormat=markdown`,
              {
                method: "POST",
                headers: { "X-User-Id": USER_ID },
                body: form,
              },
            );

            const textBody = await res.text();
            assert.equal(res.status, 202, textBody);
            const accepted = JSON.parse(textBody) as {
              job: { id: string; status: "queued" | "running" | "completed" | "failed" };
              reused: boolean;
            };
            assert.equal(accepted.reused, false);
            assert.ok(accepted.job.id);

            let jobPayload: {
              job: {
                status: "queued" | "running" | "completed" | "failed";
                error: string | null;
                result: null | {
                  success: boolean;
                  count: number;
                  notebookId: string;
                  notebookIds: string[];
                  workspaceId: string | null;
                  stats: { importedAssets: number; unresolvedAssets: number; unsupportedNodes: Record<string, number> };
                };
              };
            } | null = null;
            for (let attempt = 0; attempt < 200; attempt += 1) {
              const poll = await app.request(`/export/import/siyuan-package/jobs/${accepted.job.id}`, {
                headers: { "X-User-Id": USER_ID },
              });
              assert.equal(poll.status, 200, await poll.text());
              jobPayload = await poll.json() as typeof jobPayload;
              if (jobPayload && ["completed", "failed"].includes(jobPayload.job.status)) break;
              await new Promise((resolve) => setTimeout(resolve, 10));
            }

            assert.ok(jobPayload, "missing Siyuan import job payload");
            assert.equal(jobPayload.job.status, "completed", jobPayload.job.error || "Siyuan import job did not complete");
            const result = jobPayload.job.result;
            assert.ok(result);
            assert.equal(result.success, true);
            assert.equal(result.count, 3);
            assert.equal(result.workspaceId, WORKSPACE_ID);
            assert.equal(result.notebookId, TARGET_NOTEBOOK_ID);
            assert.deepEqual(result.notebookIds, [TARGET_NOTEBOOK_ID]);
            assert.equal(result.stats.importedAssets, 2);
            assert.equal(result.stats.unresolvedAssets, 1);
            assert.equal(result.stats.unsupportedNodes.NodeAttributeView, 1);

            const routeNotes = db()
              .prepare("SELECT id, title, notebookId, contentFormat, workspaceId FROM notes WHERE notebookId = ? ORDER BY title")
              .all(TARGET_NOTEBOOK_ID) as Array<{ id: string; title: string; notebookId: string; contentFormat: string; workspaceId: string | null }>;
            assert.deepEqual(routeNotes.map((note) => note.title), ["子级目录", "导入正文", "父级目录"]);
            assert.deepEqual(routeNotes.map((note) => note.contentFormat), ["markdown", "markdown", "markdown"]);
            assert.deepEqual(routeNotes.map((note) => note.workspaceId), [WORKSPACE_ID, WORKSPACE_ID, WORKSPACE_ID]);

            const routeDoc = getNoteByTitle("导入正文", TARGET_NOTEBOOK_ID);
            assert.ok(routeDoc);
            const routeAttachments = listAttachments(routeDoc.id);
            assert.equal(routeAttachments.length, 2);
            assert.ok(routeAttachments.every((item) => routeDoc.content.includes(`/api/attachments/${item.id}`)));
          });

          test("service import stores Tiptap JSON'''
          text2, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"failed to patch siyuan-package-import.test.ts: {count}")
          import_test.write_text(text2)

          budget_test = Path("backend/tests/siyuan-package-zip-budget.test.ts")
          text = budget_test.read_text()
          pattern = re.compile(r'test\("siyuan package route returns 413 when zip budgets are exceeded", async \(\) => \{.*?\n\}\);\s*$', re.S)
          replacement = r'''test("siyuan package route records an async failure when zip budgets are exceeded", async () => {
            const zipPath = await writeZip("route-budget.zip", {
              "a.sy": "{}",
              "assets/big.bin": new Uint8Array([1, 2, 3, 4, 5]),
            });
            const form = new FormData();
            form.set("file", new File([fs.readFileSync(zipPath)], "route-budget.zip", { type: "application/zip" }));

            const res = await app.request("/export/import/siyuan-package?workspaceId=personal", {
              method: "POST",
              headers: { "X-User-Id": "zip-budget-user" },
              body: form,
            });

            const text = await res.text();
            assert.equal(res.status, 202, text);
            const accepted = JSON.parse(text) as { job: { id: string }; reused: boolean };
            assert.equal(accepted.reused, false);

            let finalJob: { status: string; error: string | null } | null = null;
            for (let attempt = 0; attempt < 200; attempt += 1) {
              const poll = await app.request(`/export/import/siyuan-package/jobs/${accepted.job.id}`, {
                headers: { "X-User-Id": "zip-budget-user" },
              });
              assert.equal(poll.status, 200, await poll.text());
              const payload = await poll.json() as { job: { status: string; error: string | null } };
              finalJob = payload.job;
              if (["completed", "failed"].includes(finalJob.status)) break;
              await new Promise((resolve) => setTimeout(resolve, 10));
            }

            assert.ok(finalJob, "missing Siyuan import job result");
            assert.equal(finalJob.status, "failed");
            assert.match(finalJob.error || "", /思源资源文件过大|超出限制|文件数量过多|\.sy 文件过多/);
          });
          '''
          text2, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"failed to patch siyuan-package-zip-budget.test.ts: {count}")
          budget_test.write_text(text2)
          PY
      - name: Run Siyuan regressions
        working-directory: backend
        run: >-
          node --import tsx --test --test-concurrency=1
          tests/siyuan-package-import.test.ts
          tests/siyuan-package-zip-budget.test.ts
      - name: Commit verified test reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pg-fix-siyuan-async-tests.yml
          git add backend/tests/siyuan-package-import.test.ts backend/tests/siyuan-package-zip-budget.test.ts
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(sqlite): follow async Siyuan import jobs"
          git push origin HEAD:pg-migration-unified
