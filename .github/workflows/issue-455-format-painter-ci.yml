name: Issue 455 Format Painter CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/components/TiptapEditor.tsx'
      - 'frontend/src/components/FontSizeExtension.ts'
      - 'frontend/src/components/LineHeightExtension.ts'
      - 'frontend/src/lib/formatPainter.ts'
      - 'frontend/src/lib/__tests__/formatPainter*.test.ts'
      - '.github/workflows/issue-455-format-painter-ci.yml'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --silent
      - name: Safe format painter tests
        id: focused-tests
        continue-on-error: true
        working-directory: frontend
        run: >-
          npx vitest run --reporter=basic
          src/lib/__tests__/formatPainter.test.ts
          src/lib/__tests__/formatPainterUiContract.test.ts
          > format-painter-test.log 2>&1
      - name: Upload focused test diagnostics
        if: steps.focused-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: issue-455-format-painter-test-diagnostics
          path: frontend/format-painter-test.log
          if-no-files-found: error
      - name: Enforce focused test result
        if: steps.focused-tests.outcome == 'failure'
        run: exit 1
      - name: Frontend typecheck
        id: typecheck
        continue-on-error: true
        working-directory: frontend
        run: npx tsc -b > format-painter-tsc.log 2>&1
      - name: Upload typecheck diagnostics
        if: steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: issue-455-format-painter-tsc-diagnostics
          path: frontend/format-painter-tsc.log
          if-no-files-found: error
      - name: Enforce typecheck result
        if: steps.typecheck.outcome == 'failure'
        run: exit 1
