name: PostgreSQL SQLite Rollback Command

on:
  push:
    branches: [feat/pg-sqlite-rollback-20260805]
    paths:
      - ".github/workflows/pg-sqlite-rollback-command.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nowen
          POSTGRES_PASSWORD: nowen_ci_password
          POSTGRES_DB: nowen_note_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nowen -d nowen_note_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_PG_DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test
      DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pg-sqlite-rollback-20260805
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Wire run-owned tracking and rollback CLI
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          copy_path = Path('backend/src/services/sqlite-postgres-copy-runtime.ts')
          text = copy_path.read_text()
          anchor = 'async function repairSelfReferences(input: {'
          helper = '''function buildRowOwnershipStatement(input: {
            runId: string;
            tableName: string;
            columns: TargetColumn[];
            primaryKeyColumns: string[];
            row: Record<string, unknown>;
            batchSequence: number;
          }): DbStatement {
            const byName = new Map(input.columns.map((column) => [column.name, column]));
            const primaryKey = Object.fromEntries(input.primaryKeyColumns.map((columnName) => {
              const column = byName.get(columnName);
              if (!column) {
                throw new SqlitePostgresMigrationError(
                  "SQLITE_PG_MIGRATION_PRIMARY_KEY_COLUMN_MISSING",
                  "目标表缺少 run-owned tracking 所需主键列",
                  500,
                  { tableName: input.tableName, column: columnName },
                );
              }
              return [columnName, canonicalValue(column, input.row[columnName])];
            }));
            const canonicalRow = Object.fromEntries(input.columns.map((column) => [
              column.name,
              canonicalValue(column, input.row[column.name]),
            ]));
            return {
              sql: `INSERT INTO sqlite_postgres_migration_row_changes (
                      "runId", "tableName", "primaryKey", "primaryKeyHash",
                      "batchSequence", "changeKind", "originalRow", "migratedChecksum"
                    ) VALUES (?, ?, ?::jsonb, ?, ?, 'inserted', NULL, ?)
                    ON CONFLICT ("runId", "tableName", "primaryKeyHash") DO UPDATE
                      SET "batchSequence" = LEAST(
                            sqlite_postgres_migration_row_changes."batchSequence",
                            EXCLUDED."batchSequence"
                          ),
                          "migratedChecksum" = EXCLUDED."migratedChecksum",
                          "updatedAt" = CURRENT_TIMESTAMP`,
              params: [
                input.runId,
                input.tableName,
                JSON.stringify(primaryKey),
                sha256(stableJson(primaryKey)),
                Math.max(0, Math.trunc(input.batchSequence)),
                sha256(stableJson(canonicalRow)),
              ],
            };
          }

          '''
          if text.count(anchor) != 1:
              raise SystemExit('copy runtime helper anchor changed')
          text = text.replace(anchor, helper + anchor)
          old = '''      const statements = batch.rows.map((row) => buildUpsertStatement({
                tableName: sourceTable.name,
                columns,
                primaryKeyColumns: sourceTable.primaryKeyColumns,
                row,
                deferredSelfColumns: deferredNames,
              }));'''
          new = '''      const statements = batch.rows.flatMap((row) => [
                buildUpsertStatement({
                  tableName: sourceTable.name,
                  columns,
                  primaryKeyColumns: sourceTable.primaryKeyColumns,
                  row,
                  deferredSelfColumns: deferredNames,
                }),
                buildRowOwnershipStatement({
                  runId: input.claim.runId,
                  tableName: sourceTable.name,
                  columns,
                  primaryKeyColumns: sourceTable.primaryKeyColumns,
                  row,
                  batchSequence,
                }),
              ]);'''
          if text.count(old) != 1:
              raise SystemExit('copy runtime statements anchor changed')
          copy_path.write_text(text.replace(old, new))

          runtime_path = Path('backend/src/services/sqlite-postgres-migration-runtime.ts')
          text = runtime_path.read_text()
          needle = '  "sqlite_postgres_migration_batch_checkpoints",\n]);'
          replacement = '  "sqlite_postgres_migration_batch_checkpoints",\n  "sqlite_postgres_migration_row_changes",\n]);'
          if text.count(needle) != 1:
              raise SystemExit('migration metadata anchor changed')
          runtime_path.write_text(text.replace(needle, replacement))

          cli_path = Path('backend/scripts/migrate-sqlite-to-postgres.ts')
          text = cli_path.read_text()
          replacements = [
            (
              'import { createSqlitePostgresMigrationRuntime } from "../src/services/sqlite-postgres-migration-runtime";\n',
              'import { createSqlitePostgresMigrationRuntime } from "../src/services/sqlite-postgres-migration-runtime";\n'
              'import { createSqlitePostgresRollbackRuntime } from "../src/services/sqlite-postgres-rollback-runtime";\n',
            ),
            ('  mode: "dry-run" | "apply" | "verify";\n', '  mode: "dry-run" | "apply" | "verify" | "rollback";\n'),
            (
              '    "  npm run migrate:sqlite-to-postgres -- --verify --backup <backup.db> --idempotency-key <key>",\n',
              '    "  npm run migrate:sqlite-to-postgres -- --verify --backup <backup.db> --idempotency-key <key>",\n'
              '    "  npm run migrate:sqlite-to-postgres -- --rollback --idempotency-key <key>",\n',
            ),
            (
              '    "  --verify                   Independently re-read the frozen backup and verify PostgreSQL",\n',
              '    "  --verify                   Independently re-read the frozen backup and verify PostgreSQL",\n'
              '    "  --rollback                 Delete only rows owned by an empty-target migration run",\n',
            ),
            (
              '    "Rollback remains disabled until run-owned row tracking is implemented.",\n',
              '    "Rollback currently supports only runs whose PostgreSQL target was empty at preflight.",\n',
            ),
            (
              '  const selected = ["--dry-run", "--apply", "--verify"].filter((mode) => args.includes(mode));\n',
              '  const selected = ["--dry-run", "--apply", "--verify", "--rollback"]\n'
              '    .filter((mode) => args.includes(mode));\n',
            ),
            (
              '    throw new Error("Select exactly one mode: --dry-run, --apply, or --verify.");\n',
              '    throw new Error("Select exactly one mode: --dry-run, --apply, --verify, or --rollback.");\n',
            ),
            (
              '  const mode = selected[0] === "--apply"\n    ? "apply"\n    : selected[0] === "--verify"\n      ? "verify"\n      : "dry-run";\n',
              '  const mode = selected[0] === "--apply"\n    ? "apply"\n    : selected[0] === "--verify"\n      ? "verify"\n      : selected[0] === "--rollback"\n        ? "rollback"\n        : "dry-run";\n',
            ),
            (
              '  if (!backupPath) {\n    throw new Error("A frozen SQLite backup is required via --backup.");\n  }\n',
              '  if (mode !== "rollback" && !backupPath) {\n    throw new Error("A frozen SQLite backup is required via --backup.");\n  }\n',
            ),
            (
              '  if ((mode === "apply" || mode === "verify") && !idempotencyKey) {\n    throw new Error("--idempotency-key is required for apply and verify.");\n  }\n',
              '  if ((mode === "apply" || mode === "verify" || mode === "rollback")\n    && !idempotencyKey) {\n    throw new Error("--idempotency-key is required for apply, verify, and rollback.");\n  }\n',
            ),
            (
              '    const runtime = createSqlitePostgresMigrationRuntime(\n      new PostgresAdapter(pool),\n    );\n',
              '    const adapter = new PostgresAdapter(pool);\n'
              '    const runtime = createSqlitePostgresMigrationRuntime(adapter);\n'
              '    const rollbackRuntime = createSqlitePostgresRollbackRuntime(adapter);\n',
            ),
            (
              '    const report = await runtime.verify({\n',
              '    if (options.mode === "rollback") {\n'
              '      const snapshot = await runtime.getStatusByIdempotencyKey(options.idempotencyKey!);\n'
              '      const report = await rollbackRuntime.rollback({ runId: snapshot.run.id });\n'
              '      console.log(JSON.stringify(report, null, 2));\n'
              '      if (!report.complete) process.exitCode = 5;\n'
              '      return;\n'
              '    }\n'
              '    const report = await runtime.verify({\n',
            ),
          ]
          for needle, replacement in replacements:
              if text.count(needle) != 1:
                  raise SystemExit(f'CLI anchor changed: {needle!r}')
              text = text.replace(needle, replacement)
          cli_path.write_text(text)

          workflow_path = Path('.github/workflows/pg-sqlite-data-migration.yml')
          text = workflow_path.read_text()
          text = text.replace(
            '      - "backend/src/db/postgres/migrations/0023_sqlite_postgres_migration_runs.sql"\n',
            '      - "backend/src/db/postgres/migrations/0023_sqlite_postgres_migration_runs.sql"\n'
            '      - "backend/src/db/postgres/migrations/0024_sqlite_postgres_migration_rollback.sql"\n',
          )
          text = text.replace(
            '      - "backend/src/services/sqlite-postgres-migration-runtime.ts"\n',
            '      - "backend/src/services/sqlite-postgres-migration-runtime.ts"\n'
            '      - "backend/src/services/sqlite-postgres-rollback-runtime.ts"\n',
          )
          text = text.replace(
            '      - "backend/tests/sqlite-postgres-migration-runtime-pg.test.ts"\n',
            '      - "backend/tests/sqlite-postgres-migration-runtime-pg.test.ts"\n'
            '      - "backend/tests/sqlite-postgres-rollback-runtime-pg.test.ts"\n',
          )
          text = text.replace(
            '          tests/sqlite-postgres-migration-runtime-pg.test.ts\n',
            '          tests/sqlite-postgres-migration-runtime-pg.test.ts\n'
            '          tests/sqlite-postgres-rollback-runtime-pg.test.ts\n',
          )
          text = text.replace(
            '          test -f dist/postgres/migrations/0023_sqlite_postgres_migration_runs.sql\n',
            '          test -f dist/postgres/migrations/0023_sqlite_postgres_migration_runs.sql\n'
            '          test -f dist/postgres/migrations/0024_sqlite_postgres_migration_rollback.sql\n',
          )
          workflow_path.write_text(text)

          docs_path = Path('backend/docs/sqlite-to-postgres-migration.md')
          docs = docs_path.read_text()
          docs += '''\n\n## Empty-target rollback\n\nEach apply batch records the migrated row primary key in `sqlite_postgres_migration_row_changes` in the same PostgreSQL transaction as the business upsert and checkpoint. For targets that were empty at preflight, rollback deletes only those run-owned rows in reverse table dependency order.\n\n```bash\nnpm run migrate:sqlite-to-postgres -- \\\n  --rollback \\\n  --idempotency-key migration-2026-08-05\n```\n\nRollback is resumable and idempotent. A run created before ownership tracking, or a run planned against a non-empty target, is rejected rather than guessing a deletion range. Restoring overwritten pre-existing rows remains disabled until original-row snapshots and conflict policies are complete.\n'''
          docs_path.write_text(docs)
          PY

      - name: Install and validate rollback slice
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm run build:tsc -- --noEmit
          npm run audit:sqlite-boundaries
          npm run audit:pg-schema-parity
          node --import tsx --test --test-concurrency=1 \
            tests/postgres-migrations.test.ts \
            tests/sqlite-postgres-migration-runtime-pg.test.ts \
            tests/sqlite-postgres-rollback-runtime-pg.test.ts
          npm run migrate:sqlite-to-postgres -- --help
          npm run build
          test -f dist/postgres/migrations/0024_sqlite_postgres_migration_rollback.sql

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pg-sqlite-rollback-command.yml
          git add \
            .github/workflows/pg-sqlite-data-migration.yml \
            backend/docs/sqlite-to-postgres-migration.md \
            backend/scripts/migrate-sqlite-to-postgres.ts \
            backend/src/db/postgres/migrations/0024_sqlite_postgres_migration_rollback.sql \
            backend/src/services/sqlite-postgres-copy-runtime.ts \
            backend/src/services/sqlite-postgres-migration-runtime.ts \
            backend/src/services/sqlite-postgres-rollback-runtime.ts \
            backend/tests/sqlite-postgres-rollback-runtime-pg.test.ts
          git commit -m "feat(pg): add resumable empty-target migration rollback"
          git push origin HEAD:feat/pg-sqlite-rollback-20260805
