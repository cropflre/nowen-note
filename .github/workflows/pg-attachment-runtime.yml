name: PostgreSQL Attachment Runtime

on:
  push:
    branches: [pg-migration-unified]
    paths:
      - "backend/src/routes/attachments-runtime.ts"
      - "backend/src/services/attachment-capabilities-runtime.ts"
      - "backend/src/services/attachment-storage-runtime.ts"
      - "backend/src/lib/attachment-signed-url-core.ts"
      - "backend/src/lib/attachment-signed-url.ts"
      - "backend/src/lib/attachment-etag.ts"
      - "backend/src/index.postgres-runtime.ts"
      - "backend/tests/attachment-signed-url-core.test.ts"
      - "backend/tests/attachment-storage-http-runtime-pg.test.ts"
      - "backend/tests/attachments-runtime-pg.test.ts"
      - "backend/tests/note-transfer-attachment-staging-runtime-pg.test.ts"
      - ".github/workflows/pg-attachment-runtime.yml"
  pull_request:
    paths:
      - "backend/src/routes/attachments-runtime.ts"
      - "backend/src/services/attachment-capabilities-runtime.ts"
      - "backend/src/services/attachment-storage-runtime.ts"
      - "backend/src/lib/attachment-signed-url-core.ts"
      - "backend/src/lib/attachment-signed-url.ts"
      - "backend/src/lib/attachment-etag.ts"
      - "backend/src/index.postgres-runtime.ts"
      - "backend/tests/attachment-signed-url-core.test.ts"
      - "backend/tests/attachment-storage-http-runtime-pg.test.ts"
      - "backend/tests/attachments-runtime-pg.test.ts"
      - "backend/tests/note-transfer-attachment-staging-runtime-pg.test.ts"
      - ".github/workflows/pg-attachment-runtime.yml"
  workflow_dispatch:

jobs:
  attachments:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nowen
          POSTGRES_PASSWORD: nowen
          POSTGRES_DB: nowen_note_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nowen -d nowen_note_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_PG_DATABASE_URL: postgresql://nowen:nowen@127.0.0.1:5432/nowen_note_test
      DATABASE_URL: postgresql://nowen:nowen@127.0.0.1:5432/nowen_note_test
      DB_DRIVER: postgres
      JWT_SECRET: pg-attachment-ci-secret-please-change
      ATTACHMENT_SIGNING_SECRET: pg-attachment-ci-signing-secret-please-change
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npm run build:tsc -- --noEmit
      - name: Attachment signature envelope
        run: node --import tsx --test --test-concurrency=1 tests/attachment-signed-url-core.test.ts
      - name: Attachment storage primitives
        run: node --import tsx --test --test-concurrency=1 tests/attachment-storage-http-runtime-pg.test.ts
      - name: Attachment HTTP lifecycle
        run: node --import tsx --test --test-concurrency=1 tests/attachments-runtime-pg.test.ts
      - name: Note-transfer attachment staging regression
        run: node --import tsx --test --test-concurrency=1 tests/note-transfer-attachment-staging-runtime-pg.test.ts
      - name: Build production backend bundle
        run: npm run build
