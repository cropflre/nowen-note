name: Reconcile PostgreSQL Yjs Capability Advertisement

on:
  push:
    branches: [pg-migration-unified]
    paths:
      - ".github/workflows/pg-yjs-capability-advert-sync.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pg-migration-unified
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Reconcile capability contract
        shell: python
        run: |
          from pathlib import Path

          runtime = Path("backend/src/services/postgres-realtime-runtime.ts")
          text = runtime.read_text()
          old = '''            "yjs-update-write",
          ],
          pendingCapabilities: ["yjs-snapshot-compaction"],'''
          new = '''            "yjs-update-write",
            "yjs-snapshot-compaction",
          ],
          pendingCapabilities: ["yjs-subdocument-write"],'''
          if old not in text:
              raise SystemExit("missing realtime capability marker")
          runtime.write_text(text.replace(old, new, 1))

          test = Path("backend/tests/postgres-realtime-yjs-pg.test.ts")
          text = test.read_text()
          old = '''  assert.ok(connected.capabilities.includes("yjs-update-write"));
  assert.deepEqual(connected.pendingCapabilities, ["yjs-snapshot-compaction"]);'''
          new = '''  assert.ok(connected.capabilities.includes("yjs-update-write"));
  assert.ok(connected.capabilities.includes("yjs-snapshot-compaction"));
  assert.deepEqual(connected.pendingCapabilities, ["yjs-subdocument-write"]);'''
          if old not in text:
              raise SystemExit("missing realtime test capability marker")
          test.write_text(text.replace(old, new, 1))
      - name: Validate realtime capability contract
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm run build:tsc -- --noEmit
          node --import tsx --test --test-concurrency=1 tests/postgres-realtime-yjs-pg.test.ts
      - name: Commit reconciled capability contract
        run: |
          git rm .github/workflows/pg-yjs-capability-advert-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/services/postgres-realtime-runtime.ts backend/tests/postgres-realtime-yjs-pg.test.ts
          git commit -m "fix(db): advertise completed Yjs compaction capability"
          git push origin HEAD:pg-migration-unified
