name: Shortcut Branch Sync

on:
  push:
    branches:
      - agent/shortcut-help-center

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shortcut-help-center
          fetch-depth: 0
      - name: Merge latest main and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          rm -f .github/workflows/shortcut-sync-main.yml
          git add -A
          git commit -m "chore(shortcuts): remove branch sync helper"
          git push origin HEAD:agent/shortcut-help-center
