name: Sync complete offline workspace with main

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/sync-complete-offline-main.yml"

permissions:
  contents: write

jobs:
  sync-main:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Merge latest main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend offline sync tests
        working-directory: frontend
        run: npm run test:run -- src/lib/__tests__/offlineWorkspaceSync.test.ts src/hooks/__tests__/useNetworkStatus.test.tsx
      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc -b
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Backend offline sync tests
        working-directory: backend
        run: node --import tsx --import ./tests/setup-db-isolation.ts --test tests/offline-workspace-sync.test.ts tests/notes-content-view.test.ts
      - name: Backend typecheck
        working-directory: backend
        run: npm run build:tsc
      - name: Push merged branch
        run: git push origin HEAD:${{ github.head_ref }}
