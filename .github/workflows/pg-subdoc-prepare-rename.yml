name: Reconcile Subdocument Prepare Naming

on:
  push:
    branches: [pg-migration-unified]
    paths:
      - ".github/workflows/pg-subdoc-prepare-rename.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pg-migration-unified
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Rename domain prepare call
        shell: python
        run: |
          from pathlib import Path

          path = Path("backend/src/services/postgres-yjs-subdocuments-websocket-runtime.ts")
          text = path.read_text()
          old_factory = '  const subdocuments = createPostgresYjsSubdocumentRuntime(adapter);\n'
          new_factory = old_factory + '  const prepareManifest = subdocuments.prepare;\n'
          old_call = '    const manifest = await subdocuments.prepare(noteId);\n'
          new_call = '    const manifest = await prepareManifest(noteId);\n'
          if text.count(old_factory) != 1 or text.count(old_call) != 1:
              raise SystemExit("unexpected subdocument prepare markers")
          path.write_text(text.replace(old_factory, new_factory, 1).replace(old_call, new_call, 1))
      - name: Validate naming and direct access boundary
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm run build:tsc -- --noEmit
          npm run audit:sqlite-boundaries
      - name: Commit reconciled source
        run: |
          git rm .github/workflows/pg-subdoc-prepare-rename.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/services/postgres-yjs-subdocuments-websocket-runtime.ts
          git commit -m "refactor(pg): name subdocument manifest preparation explicitly"
          git push origin HEAD:pg-migration-unified
