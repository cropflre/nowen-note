name: Web Experience 762 CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/v1.5.0
    paths:
      - "frontend/src/components/KnowledgeTreePanel.tsx"
      - "frontend/src/components/MobileKnowledgeTreePanel.tsx"
      - "frontend/src/components/ResizableImageView.tsx"
      - "frontend/src/components/TiptapEditor.tsx"
      - "frontend/src/components/EditorImageTransformBridge.tsx"
      - "frontend/src/hooks/useAttachmentImageRenderSource.ts"
      - "frontend/src/hooks/__tests__/useAttachmentImageRenderSource.test.tsx"
      - "frontend/src/components/__tests__/MobileKnowledgeTreePanel.test.ts"
      - "frontend/src/components/__tests__/DesktopKnowledgeTreeMode.test.ts"
      - "frontend/src/components/__tests__/EditorImageTransformBridge.test.tsx"
      - "frontend/src/lib/mobileKnowledgeTree.ts"
      - "frontend/src/lib/knowledgeTreeExpansion.ts"
      - "frontend/src/lib/threeColumnFolderContents.ts"
      - "frontend/src/lib/editorImageTransformLayout.ts"
      - "frontend/src/lib/__tests__/mobileKnowledgeTree.test.ts"
      - "frontend/src/lib/__tests__/knowledgeTreeExpansionDepth.test.ts"
      - "frontend/src/lib/__tests__/threeColumnFolderContents.test.ts"
      - "frontend/src/lib/__tests__/knowledgeTreeSidebarContract.test.ts"
      - "frontend/src/lib/__tests__/editorImageTransformLayout.test.ts"
      - ".github/workflows/web-experience-762-ci.yml"
  pull_request:
    paths:
      - "frontend/src/components/KnowledgeTreePanel.tsx"
      - "frontend/src/components/MobileKnowledgeTreePanel.tsx"
      - "frontend/src/components/ResizableImageView.tsx"
      - "frontend/src/components/TiptapEditor.tsx"
      - "frontend/src/components/EditorImageTransformBridge.tsx"
      - "frontend/src/hooks/useAttachmentImageRenderSource.ts"
      - "frontend/src/hooks/__tests__/useAttachmentImageRenderSource.test.tsx"
      - "frontend/src/components/__tests__/MobileKnowledgeTreePanel.test.ts"
      - "frontend/src/components/__tests__/DesktopKnowledgeTreeMode.test.ts"
      - "frontend/src/components/__tests__/EditorImageTransformBridge.test.tsx"
      - "frontend/src/lib/mobileKnowledgeTree.ts"
      - "frontend/src/lib/knowledgeTreeExpansion.ts"
      - "frontend/src/lib/threeColumnFolderContents.ts"
      - "frontend/src/lib/editorImageTransformLayout.ts"
      - "frontend/src/lib/__tests__/mobileKnowledgeTree.test.ts"
      - "frontend/src/lib/__tests__/knowledgeTreeExpansionDepth.test.ts"
      - "frontend/src/lib/__tests__/threeColumnFolderContents.test.ts"
      - "frontend/src/lib/__tests__/knowledgeTreeSidebarContract.test.ts"
      - "frontend/src/lib/__tests__/editorImageTransformLayout.test.ts"
      - ".github/workflows/web-experience-762-ci.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Web navigation and image regression tests
        run: >-
          npm run test:run --
          src/lib/__tests__/mobileKnowledgeTree.test.ts
          src/lib/__tests__/knowledgeTreeExpansionDepth.test.ts
          src/lib/__tests__/threeColumnFolderContents.test.ts
          src/lib/__tests__/knowledgeTreeSidebarContract.test.ts
          src/components/__tests__/MobileKnowledgeTreePanel.test.ts
          src/components/__tests__/DesktopKnowledgeTreeMode.test.ts
          src/hooks/__tests__/useAttachmentImageRenderSource.test.tsx
          src/lib/__tests__/editorImageTransformLayout.test.ts
          src/components/__tests__/EditorImageTransformBridge.test.tsx
      - name: Frontend typecheck
        run: npx tsc -b
