name: PostgreSQL Note Transfer Cleanup

on:
  push:
    branches:
      - pg-migration-unified
    paths:
      - "backend/src/db/postgres/migrations/**"
      - "backend/src/repositories/noteTransferOperationRepository.ts"
      - "backend/src/repositories/noteTransferCommitRepository.ts"
      - "backend/src/services/attachment-storage-runtime.ts"
      - "backend/src/services/note-transfer-attachment-staging-runtime.ts"
      - "backend/src/services/note-transfer-cleanup-runtime.ts"
      - "backend/src/services/note-transfer-commit-runtime.ts"
      - "backend/src/routes/note-transfers-runtime.ts"
      - "backend/tests/note-transfer-cleanup-runtime-pg.test.ts"
      - "backend/tests/note-transfer-attachment-staging-runtime-pg.test.ts"
      - "backend/tests/note-transfer-commit-runtime-pg.test.ts"
      - "backend/tests/postgres-migrations.test.ts"
      - ".github/workflows/pg-note-transfer-cleanup.yml"
  pull_request:
    paths:
      - "backend/src/db/postgres/migrations/**"
      - "backend/src/repositories/noteTransferOperationRepository.ts"
      - "backend/src/repositories/noteTransferCommitRepository.ts"
      - "backend/src/services/attachment-storage-runtime.ts"
      - "backend/src/services/note-transfer-attachment-staging-runtime.ts"
      - "backend/src/services/note-transfer-cleanup-runtime.ts"
      - "backend/src/services/note-transfer-commit-runtime.ts"
      - "backend/src/routes/note-transfers-runtime.ts"
      - "backend/tests/note-transfer-cleanup-runtime-pg.test.ts"
      - "backend/tests/note-transfer-attachment-staging-runtime-pg.test.ts"
      - "backend/tests/note-transfer-commit-runtime-pg.test.ts"
      - "backend/tests/postgres-migrations.test.ts"
      - ".github/workflows/pg-note-transfer-cleanup.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nowen
          POSTGRES_PASSWORD: nowen_ci_password
          POSTGRES_DB: nowen_note_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nowen -d nowen_note_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    env:
      TEST_PG_DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test
      DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate TypeScript and database boundaries
        run: |
          npm run build:tsc -- --noEmit
          npm run audit:sqlite-boundaries
          npm run audit:pg-schema-parity

      - name: Validate staged object cleanup and prior phases
        run: >-
          node --import tsx --test --test-concurrency=1
          tests/postgres-migrations.test.ts
          tests/note-transfer-preview-runtime-pg.test.ts
          tests/note-transfer-attachment-staging-runtime-pg.test.ts
          tests/note-transfer-commit-runtime-pg.test.ts
          tests/note-transfer-cleanup-runtime-pg.test.ts

      - name: Validate production bundle
        run: npm run build
