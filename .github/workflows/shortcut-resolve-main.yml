name: Shortcut Resolve Latest Main

on:
  push:
    branches:
      - agent/shortcut-help-center
    paths:
      - .github/workflows/shortcut-resolve-main.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shortcut-help-center
          fetch-depth: 0
      - name: Merge latest main and resolve shortcut mount
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          conflict_file="frontend/src/components/MobileDrawerUxBridge.tsx"
          if [ "$merge_status" -ne 0 ]; then
            unexpected="$(git diff --name-only --diff-filter=U | grep -v "^${conflict_file}$" || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected conflicts:"
              echo "$unexpected"
              exit 1
            fi
            git checkout --theirs "$conflict_file"
          fi

          python3 <<'PY'
          from pathlib import Path

          path = Path("frontend/src/components/MobileDrawerUxBridge.tsx")
          text = path.read_text(encoding="utf-8")

          shortcut_import = 'import ShortcutHelpCenter from "@/components/ShortcutHelpCenter";\n'
          knowledge_import = 'import KnowledgeTreeDrawer from "@/components/KnowledgeTreeDrawer";\n'
          if shortcut_import not in text:
              if knowledge_import not in text:
                  raise SystemExit("KnowledgeTreeDrawer import point not found")
              text = text.replace(knowledge_import, knowledge_import + shortcut_import, 1)

          mount = "      <KnowledgeTreeDrawer />\n"
          shortcut_mount = "      <ShortcutHelpCenter />\n"
          if shortcut_mount not in text:
              if mount not in text:
                  raise SystemExit("KnowledgeTreeDrawer mount point not found")
              text = text.replace(mount, mount + shortcut_mount, 1)

          path.write_text(text, encoding="utf-8")
          PY

          rm -f .github/shortcut-merge-conflicts.txt
          rm -f .github/workflows/shortcut-resolve-main.yml
          git add -A
          git commit -m "merge: sync shortcut help with latest main"
          git push origin HEAD:agent/shortcut-help-center
