name: Validate PostgreSQL attachment HTTP storage primitives

on:
  push:
    branches: [pg-validation-runtime-batch]
    paths:
      - ".github/workflows/pg-attachment-storage-http-validate.yml"

permissions:
  contents: write

jobs:
  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nowen
          POSTGRES_PASSWORD: nowen_ci_password
          POSTGRES_DB: nowen_note_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nowen -d nowen_note_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_PG_DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test
      DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test
      DB_DRIVER: postgres
      JWT_SECRET: pg-attachment-storage-test-secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pg-migration-unified
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Add verified HTTP read/write primitives
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/src/services/attachment-storage-runtime.ts')
          text = path.read_text()

          old = '''async function signedRequest(
            method: "GET" | "PUT" | "DELETE" | "HEAD",
            relativePath: string,
            config: S3Config,
            fetchImpl: typeof fetch,
            extraHeaders: Record<string, string> = {},
          ): Promise<Response> {'''
          new = '''async function signedRequest(
            method: "GET" | "PUT" | "DELETE" | "HEAD",
            relativePath: string,
            config: S3Config,
            fetchImpl: typeof fetch,
            extraHeaders: Record<string, string> = {},
            body?: Buffer,
            contentType?: string,
          ): Promise<Response> {'''
          if old not in text:
              raise SystemExit('signedRequest signature marker missing')
          text = text.replace(old, new, 1)

          old = '''  const payloadHash = crypto.createHash("sha256").update("").digest("hex");
            const headers: Record<string, string> = {
              host: url.host,
              "x-amz-content-sha256": payloadHash,
              "x-amz-date": amzDate(now),
            };
            for (const [key, value] of Object.entries(extraHeaders)) {'''
          new = '''  const payloadHash = crypto.createHash("sha256").update(body || "").digest("hex");
            const headers: Record<string, string> = {
              host: url.host,
              "x-amz-content-sha256": payloadHash,
              "x-amz-date": amzDate(now),
            };
            if (contentType) headers["content-type"] = contentType;
            for (const [key, value] of Object.entries(extraHeaders)) {'''
          if old not in text:
              raise SystemExit('payload hash marker missing')
          text = text.replace(old, new, 1)

          old = '''    headers: {
                  ...headers,
                  Authorization:
                    `AWS4-HMAC-SHA256 Credential=${config.accessKeyId}/${scope}, `
                    + `SignedHeaders=${signedHeaders}, Signature=${signature}`,
                },
              });'''
          new = '''    headers: {
                  ...headers,
                  Authorization:
                    `AWS4-HMAC-SHA256 Credential=${config.accessKeyId}/${scope}, `
                    + `SignedHeaders=${signedHeaders}, Signature=${signature}`,
                },
                body: body as BodyInit | undefined,
              });'''
          if old not in text:
              raise SystemExit('fetch body marker missing')
          text = text.replace(old, new, 1)

          marker = '''    async copyAndVerify(input: {
              sourcePath: string;
              stagedPath: string;
              expectedSize: number;
              expectedHash: string | null;
            }): Promise<AttachmentStageCopyResult> {'''
          addition = '''    async readObject(relativePath: string): Promise<Buffer | null> {
              const normalized = normalizeRelativePath(relativePath);
              const config = await runtimeS3Config(db);
              if (!config) {
                const filePath = localPath(root, normalized);
                try {
                  const stat = await fs.promises.lstat(filePath);
                  if (!stat.isFile() || stat.isSymbolicLink()) return null;
                  return await fs.promises.readFile(filePath);
                } catch (error: any) {
                  if (error?.code === "ENOENT") return null;
                  throw error;
                }
              }

              const response = await signedRequest("GET", normalized, config, fetchImpl);
              if (response.status === 404) {
                // Keep the legacy migration fallback: an object may still exist locally
                // while S3 migration is incomplete.
                const fallback = localPath(root, normalized);
                try {
                  const stat = await fs.promises.lstat(fallback);
                  if (stat.isFile() && !stat.isSymbolicLink()) return await fs.promises.readFile(fallback);
                } catch {
                  // no local fallback
                }
                return null;
              }
              if (!response.ok) throw await responseFailure("S3 GET failed", response);
              return Buffer.from(await response.arrayBuffer());
            },

            async writeObject(
              relativePath: string,
              buffer: Buffer,
              contentType?: string,
            ): Promise<void> {
              const normalized = normalizeRelativePath(relativePath);
              const config = await runtimeS3Config(db);
              if (!config) {
                const filePath = localPath(root, normalized);
                await fs.promises.mkdir(path.dirname(filePath), { recursive: true });
                await fs.promises.writeFile(filePath, buffer);
                return;
              }

              const response = await signedRequest(
                "PUT",
                normalized,
                config,
                fetchImpl,
                {},
                buffer,
                contentType,
              );
              if (!response.ok) throw await responseFailure("S3 PUT failed", response);
            },

          ''' + marker
          if marker not in text:
              raise SystemExit('copyAndVerify marker missing')
          text = text.replace(marker, addition, 1)
          path.write_text(text)
          PY

          cat > backend/tests/attachment-storage-http-runtime-pg.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import os from "node:os";
          import path from "node:path";
          import test from "node:test";

          import { PostgresAdapter } from "../src/db/postgresAdapter";
          import { createAttachmentStorageRuntime } from "../src/services/attachment-storage-runtime";
          import { closePgPool, getPgPool, hasPg, initPgSchema } from "./helpers/pg-test-db";

          test("PostgreSQL attachment storage runtime writes and reads local HTTP objects safely", { skip: !hasPg }, async () => {
            const pool = await getPgPool();
            assert.ok(pool);
            const dataDir = await fs.promises.mkdtemp(path.join(os.tmpdir(), "nowen-pg-att-http-"));
            try {
              await initPgSchema(pool);
              await pool.query(`DELETE FROM system_settings WHERE key = 'attachmentStorage:config'`);
              const storage = createAttachmentStorageRuntime(new PostgresAdapter(pool), { dataDir });
              const body = Buffer.from("nowen-pg-attachment-body");

              await storage.writeObject("2026/08/test.bin", body, "application/octet-stream");
              assert.deepEqual(await storage.readObject("2026/08/test.bin"), body);
              assert.equal((await storage.checkExists("2026/08/test.bin")).exists, true);

              await storage.deleteObject("2026/08/test.bin");
              assert.equal(await storage.readObject("2026/08/test.bin"), null);
              assert.equal((await storage.checkExists("2026/08/test.bin")).exists, false);

              await assert.rejects(
                () => storage.writeObject("../escape.bin", body),
                /安全|越过|path/i,
              );
            } finally {
              await fs.promises.rm(dataDir, { recursive: true, force: true });
              await closePgPool(pool);
            }
          });
          EOF
      - name: TypeScript
        working-directory: backend
        run: npm run build:tsc -- --noEmit
      - name: Real PostgreSQL attachment storage read/write
        working-directory: backend
        run: node --import tsx --test --test-concurrency=1 tests/attachment-storage-http-runtime-pg.test.ts
      - name: Existing note transfer attachment staging regression
        working-directory: backend
        run: node --import tsx --test --test-concurrency=1 tests/note-transfer-attachment-staging-runtime-pg.test.ts
      - name: Build production bundle
        working-directory: backend
        run: npm run build
      - name: Commit verified storage primitives
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/services/attachment-storage-runtime.ts backend/tests/attachment-storage-http-runtime-pg.test.ts
          git commit -m "feat(pg): add attachment HTTP storage primitives"
          git push origin HEAD:pg-migration-unified
