name: Issue 175 Offline Tasks CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/src/lib/api.ts"
      - "frontend/src/lib/taskOfflineApi.ts"
      - "frontend/src/lib/taskOfflineRuntime.ts"
      - "frontend/src/lib/__tests__/taskOfflineApi.test.ts"
      - ".github/workflows/issue-175-offline-tasks-ci.yml"
  pull_request:
    paths:
      - "frontend/src/lib/api.ts"
      - "frontend/src/lib/taskOfflineApi.ts"
      - "frontend/src/lib/taskOfflineRuntime.ts"
      - "frontend/src/lib/__tests__/taskOfflineApi.test.ts"
      - ".github/workflows/issue-175-offline-tasks-ci.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Offline task and habit regressions
        run: npm run test:run -- src/lib/__tests__/taskOfflineApi.test.ts
      - name: Frontend typecheck
        if: always()
        run: npx tsc -b
