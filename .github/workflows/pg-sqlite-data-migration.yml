name: PostgreSQL SQLite Data Migration

on:
  pull_request:
    paths:
      - "backend/src/db/migration/sqliteMigrationSource.ts"
      - "backend/src/db/migration/sqliteMigrationReader.ts"
      - "backend/src/db/postgres/migrations/0023_sqlite_postgres_migration_runs.sql"
      - "backend/src/repositories/sqlitePostgresMigrationRepository.ts"
      - "backend/src/services/sqlite-postgres-copy-runtime.ts"
      - "backend/src/services/sqlite-postgres-migration-runtime.ts"
      - "backend/scripts/migrate-sqlite-to-postgres.ts"
      - "backend/tests/sqlite-postgres-migration-runtime-pg.test.ts"
      - "backend/tests/postgres-migrations.test.ts"
      - "backend/package.json"
      - "backend/docs/sqlite-to-postgres-migration.md"
      - ".github/workflows/pg-sqlite-data-migration.yml"
  push:
    branches: [pg-migration-unified]
    paths:
      - "backend/src/db/migration/sqliteMigrationSource.ts"
      - "backend/src/db/migration/sqliteMigrationReader.ts"
      - "backend/src/db/postgres/migrations/0023_sqlite_postgres_migration_runs.sql"
      - "backend/src/repositories/sqlitePostgresMigrationRepository.ts"
      - "backend/src/services/sqlite-postgres-copy-runtime.ts"
      - "backend/src/services/sqlite-postgres-migration-runtime.ts"
      - "backend/scripts/migrate-sqlite-to-postgres.ts"
      - "backend/tests/sqlite-postgres-migration-runtime-pg.test.ts"
      - "backend/tests/postgres-migrations.test.ts"
      - "backend/package.json"
      - "backend/docs/sqlite-to-postgres-migration.md"
      - ".github/workflows/pg-sqlite-data-migration.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  executor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nowen
          POSTGRES_PASSWORD: nowen_ci_password
          POSTGRES_DB: nowen_note_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nowen -d nowen_note_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_PG_DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test
      DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: TypeScript and database boundaries
        working-directory: backend
        run: |
          npm run build:tsc -- --noEmit
          npm run audit:sqlite-boundaries
          npm run audit:pg-schema-parity
      - name: Migration executor regressions
        working-directory: backend
        run: >-
          node --import tsx --test --test-concurrency=1
          tests/postgres-migrations.test.ts
          tests/sqlite-postgres-migration-runtime-pg.test.ts
      - name: CLI help contract
        working-directory: backend
        run: npm run migrate:sqlite-to-postgres -- --help
      - name: Production bundle
        working-directory: backend
        run: |
          npm run build
          test -f dist/postgres/migrations/0023_sqlite_postgres_migration_runs.sql
