name: Apply renderer clean-exit recovery fix

on:
  push:
    branches:
      - fix/v1.4.6-renderer-clean-exit-recovery

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.4.6-renderer-clean-exit-recovery
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply recovery implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8-sig")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one target in {path}, found {count}: {old[:140]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          main = "electron/main.js"
          replace_once(
              main,
              'const { initLogger, getLogDir } = require("./logger");',
              'const { initLogger, getLogDir } = require("./logger");\nconst { createRendererRecoveryGate } = require("./renderer-recovery");',
          )
          replace_once(
              main,
              'let localAuthCache = null;  // { token: string, user: object } | null',
              'let localAuthCache = null;  // { token: string, user: object } | null\n\nconst MAIN_WINDOW_RELOAD_URL = "nowen-reload://main";',
          )
          replace_once(
              main,
              '<button onclick="window.location.reload()">重新加载</button>',
              '<button onclick="window.location.href=\'${MAIN_WINDOW_RELOAD_URL}\'">重新加载应用</button>',
          )
          replace_once(
              main,
              '''  let hasShownMainWindow = false;
            let loadingErrorPage = false;
            const revealMainWindow = (reason) => {''',
              '''  let hasShownMainWindow = false;
            let loadingErrorPage = false;
            let recoveringRenderer = false;
            const rendererRecoveryGate = createRendererRecoveryGate({
              maxAttempts: 2,
              windowMs: 60_000,
            });
            const revealMainWindow = (reason) => {''',
          )
          replace_once(
              main,
              '''  const handleInitialLoadError = (err) => {''',
              '''  const loadApplicationSurface = () => {
                if (!mainWindow || mainWindow.isDestroyed()) {
                  return Promise.reject(new Error("MAIN_WINDOW_DESTROYED"));
                }
                if (frontendIndexExists) {
                  return mainWindow.loadFile(frontendIndex, { query: { serverUrl: targetUrl } });
                }
                if (!app.isPackaged && currentMode !== "lite") {
                  return mainWindow.loadURL(targetUrl);
                }
                return Promise.reject(new Error("MAIN_WINDOW_FRONTEND_MISSING"));
              };
              const handleInitialLoadError = (err) => {''',
          )
          replace_once(
              main,
              '''  };
            if (frontendIndexExists) {
              // 桌面客户端始终加载本地 UI，远程地址作为 API base 通过 query 参数传入''',
              '''  };
            const reloadMainApplication = (reason) => {
              if (!mainWindow || mainWindow.isDestroyed() || recoveringRenderer) return;
              recoveringRenderer = true;
              loadingErrorPage = false;
              console.warn(`[main-window] renderer recovery start reason=${reason}`);
              loadApplicationSurface()
                .then(() => {
                  console.log(`[main-window] renderer recovery succeeded reason=${reason}`);
                })
                .catch((error) => {
                  console.error(
                    `[main-window] renderer recovery failed reason=${reason}:`,
                    error?.stack || error?.message || error
                  );
                  handleInitialLoadError(error);
                })
                .finally(() => {
                  recoveringRenderer = false;
                });
            };
            if (frontendIndexExists) {
              // 桌面客户端始终加载本地 UI，远程地址作为 API base 通过 query 参数传入''',
          )
          replace_once(
              main,
              '''      if (!isMainFrame || loadingErrorPage) {
                revealMainWindow("did-fail-load");
                return;
              }''',
              '''      if (recoveringRenderer) {
                console.warn(
                  `[main-window] did-fail-load during renderer recovery code=${errorCode} ` +
                    `desc=${errorDescription} url=${validatedURL}`
                );
                return;
              }
              if (!isMainFrame || loadingErrorPage) {
                revealMainWindow("did-fail-load");
                return;
              }''',
          )
          replace_once(
              main,
              '''  mainWindow.webContents.on("render-process-gone", (_event, details) => {
                console.error("[main-window] render-process-gone:", details);
                if (!loadingErrorPage) {
                  loadingErrorPage = true;
                  loadMainWindowErrorPage(mainWindow, {
                    title: "Nowen Note 渲染进程异常",
                    message: "主窗口渲染进程已退出。应用已打开诊断页，避免只剩后台进程。",
                    details: [
                      { label: "reason", value: details?.reason },
                      { label: "exitCode", value: details?.exitCode },
                      { label: "currentURL", value: mainWindow.webContents.getURL() },
                      { label: "logs", value: getLogDir() },
                      { label: "data", value: getUserDataPath() },
                    ],
                  });
                }
                revealMainWindow("render-process-gone");
              });''',
              '''  mainWindow.webContents.on("render-process-gone", (_event, details) => {
                const currentURL = mainWindow?.webContents?.getURL?.() || "";
                console.error("[main-window] render-process-gone:", details);
                const recovery = loadingErrorPage
                  ? { recover: false, reason: "error-page-active", attempt: 0 }
                  : rendererRecoveryGate.consume(details);

                if (recovery.recover) {
                  console.warn(
                    `[main-window] auto-recover renderer attempt=${recovery.attempt} ` +
                      `reason=${details?.reason || "unknown"} exitCode=${details?.exitCode ?? ""}`
                  );
                  reloadMainApplication(`render-process-gone:${details?.reason || "unknown"}`);
                  revealMainWindow("render-process-recovery");
                  return;
                }

                if (!loadingErrorPage) {
                  loadingErrorPage = true;
                  loadMainWindowErrorPage(mainWindow, {
                    title: "Nowen Note 渲染进程异常",
                    message: "主窗口渲染进程连续退出或无法安全恢复。请点击“重新加载应用”；若仍失败，请重启客户端并提供日志。",
                    details: [
                      { label: "reason", value: details?.reason },
                      { label: "exitCode", value: details?.exitCode },
                      { label: "recovery", value: recovery.reason },
                      { label: "currentURL", value: currentURL },
                      { label: "logs", value: getLogDir() },
                      { label: "data", value: getUserDataPath() },
                    ],
                  });
                }
                revealMainWindow("render-process-gone");
              });''',
          )
          replace_once(
              main,
              '''  mainWindow.webContents.on("will-navigate", (event, navigationUrl) => {
                const currentUrl = mainWindow.webContents.getURL();''',
              '''  mainWindow.webContents.on("will-navigate", (event, navigationUrl) => {
                if (navigationUrl === MAIN_WINDOW_RELOAD_URL && loadingErrorPage) {
                  event.preventDefault();
                  reloadMainApplication("diagnostic-page-button");
                  return;
                }
                const currentUrl = mainWindow.webContents.getURL();''',
          )

          package = "package.json"
          replace_once(
              package,
              '    "test:loading-ux": "node --test scripts/tests/unified-loading-experience.test.mjs",',
              '    "test:loading-ux": "node --test scripts/tests/unified-loading-experience.test.mjs",\n    "test:renderer-recovery": "node --test scripts/tests/renderer-recovery.test.cjs",',
          )
          PY

          cat > electron/renderer-recovery.js <<'EOF'
          "use strict";

          const NON_RECOVERABLE_REASONS = new Set([
            "launch-failed",
            "integrity-failure",
          ]);

          function isRendererExitRecoverable(details = {}) {
            const reason = typeof details.reason === "string" ? details.reason : "";
            return !NON_RECOVERABLE_REASONS.has(reason);
          }

          function createRendererRecoveryGate(options = {}) {
            const maxAttempts = options.maxAttempts ?? 2;
            const windowMs = options.windowMs ?? 60_000;
            const now = options.now ?? Date.now;

            if (!Number.isInteger(maxAttempts) || maxAttempts < 1) {
              throw new TypeError("maxAttempts must be a positive integer");
            }
            if (!Number.isFinite(windowMs) || windowMs <= 0) {
              throw new TypeError("windowMs must be a positive number");
            }
            if (typeof now !== "function") {
              throw new TypeError("now must be a function");
            }

            let attempts = [];

            return {
              consume(details = {}) {
                if (!isRendererExitRecoverable(details)) {
                  return { recover: false, reason: "non-recoverable", attempt: 0 };
                }

                const timestamp = Number(now());
                attempts = attempts.filter((attemptAt) => timestamp - attemptAt < windowMs);
                if (attempts.length >= maxAttempts) {
                  return {
                    recover: false,
                    reason: "rate-limited",
                    attempt: attempts.length,
                  };
                }

                attempts.push(timestamp);
                return {
                  recover: true,
                  reason: "allowed",
                  attempt: attempts.length,
                };
              },
              reset() {
                attempts = [];
              },
            };
          }

          module.exports = {
            createRendererRecoveryGate,
            isRendererExitRecoverable,
          };
          EOF

          cat > scripts/tests/renderer-recovery.test.cjs <<'EOF'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const path = require("node:path");
          const test = require("node:test");

          const {
            createRendererRecoveryGate,
            isRendererExitRecoverable,
          } = require("../../electron/renderer-recovery");

          test("clean renderer exits and transient failures are recoverable", () => {
            assert.equal(isRendererExitRecoverable({ reason: "clean-exit", exitCode: 0 }), true);
            assert.equal(isRendererExitRecoverable({ reason: "memory-eviction" }), true);
            assert.equal(isRendererExitRecoverable({ reason: "crashed" }), true);
            assert.equal(isRendererExitRecoverable({ reason: "launch-failed" }), false);
            assert.equal(isRendererExitRecoverable({ reason: "integrity-failure" }), false);
          });

          test("renderer recovery is rate limited to prevent an infinite reload loop", () => {
            let now = 10_000;
            const gate = createRendererRecoveryGate({
              maxAttempts: 2,
              windowMs: 60_000,
              now: () => now,
            });

            assert.deepEqual(gate.consume({ reason: "clean-exit" }), {
              recover: true,
              reason: "allowed",
              attempt: 1,
            });
            now += 500;
            assert.deepEqual(gate.consume({ reason: "crashed" }), {
              recover: true,
              reason: "allowed",
              attempt: 2,
            });
            now += 500;
            assert.deepEqual(gate.consume({ reason: "clean-exit" }), {
              recover: false,
              reason: "rate-limited",
              attempt: 2,
            });

            now += 60_000;
            assert.deepEqual(gate.consume({ reason: "clean-exit" }), {
              recover: true,
              reason: "allowed",
              attempt: 1,
            });
          });

          test("diagnostic reload button returns to the application instead of reloading itself", () => {
            const mainPath = path.resolve(__dirname, "../../electron/main.js");
            const mainSource = fs.readFileSync(mainPath, "utf8");

            assert.match(mainSource, /MAIN_WINDOW_RELOAD_URL = "nowen-reload:\/\/main"/);
            assert.match(mainSource, /reloadMainApplication\("diagnostic-page-button"\)/);
            assert.match(mainSource, /rendererRecoveryGate\.consume\(details\)/);
            assert.doesNotMatch(mainSource, /window\.location\.reload\(\)/);
          });
          EOF

      - name: Verify renderer recovery
        shell: bash
        run: |
          node --check electron/main.js
          node --check electron/renderer-recovery.js
          node --test scripts/tests/renderer-recovery.test.cjs scripts/tests/unified-loading-experience.test.mjs
          git diff --check

      - name: Commit verified implementation
        shell: bash
        run: |
          git rm .github/workflows/tmp-renderer-clean-exit-recovery.yml
          git config user.name "Drug"
          git config user.email "cropflre2333@gmail.com"
          git add electron/main.js electron/renderer-recovery.js scripts/tests/renderer-recovery.test.cjs package.json
          git commit -m "fix: recover desktop renderer after clean exit"
          git push origin HEAD:fix/v1.4.6-renderer-clean-exit-recovery
