name: Align file manager video insertion

on:
  push:
    branches:
      - fix/v1.4.6-file-manager-video-inline

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.4.6-file-manager-video-inline
          fetch-depth: 0
      - name: Align inserted block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/components/TiptapEditor.tsx')
          lines = path.read_text().splitlines(keepends=True)
          start = next(i for i, line in enumerate(lines) if line.strip() == 'const inlineVideo = !inlineImage && isInlineVideoAttachment(item);')
          end = next(i for i in range(start, len(lines)) if 'tiptap.attachmentLinkInserted' in lines[i])
          for i in range(start, end + 1):
              if lines[i].strip():
                  lines[i] = '  ' + lines[i]
          path.write_text(''.join(lines))
          PY
          grep -q '^    const inlineVideo' frontend/src/components/TiptapEditor.tsx
      - name: Commit formatting
        shell: bash
        run: |
          git rm .github/workflows/tmp-file-manager-video-indent.yml
          git config user.name "Drug"
          git config user.email "cropflre2333@gmail.com"
          git add frontend/src/components/TiptapEditor.tsx
          git commit -m "style(editor): align inline video insertion"
          git push origin HEAD:fix/v1.4.6-file-manager-video-inline
