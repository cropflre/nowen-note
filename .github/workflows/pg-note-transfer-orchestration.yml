name: PostgreSQL Note Transfer Orchestration

on:
  pull_request:
    paths:
      - "backend/src/db/postgres/migrations/0022_note_transfer_orchestration.sql"
      - "backend/src/repositories/noteTransferOrchestrationRepository.ts"
      - "backend/src/routes/note-transfers-runtime.ts"
      - "backend/src/services/note-transfer-orchestration-runtime.ts"
      - "backend/src/index.postgres-runtime.ts"
      - "backend/tests/note-transfer-orchestration-runtime-pg.test.ts"
      - "backend/tests/postgres-migrations.test.ts"
      - ".github/workflows/pg-note-transfer-orchestration.yml"
  push:
    branches: [pg-migration-unified]
    paths:
      - "backend/src/db/postgres/migrations/0022_note_transfer_orchestration.sql"
      - "backend/src/repositories/noteTransferOrchestrationRepository.ts"
      - "backend/src/routes/note-transfers-runtime.ts"
      - "backend/src/services/note-transfer-orchestration-runtime.ts"
      - "backend/src/index.postgres-runtime.ts"
      - "backend/tests/note-transfer-orchestration-runtime-pg.test.ts"
      - "backend/tests/postgres-migrations.test.ts"
      - ".github/workflows/pg-note-transfer-orchestration.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orchestration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nowen
          POSTGRES_PASSWORD: nowen_ci_password
          POSTGRES_DB: nowen_note_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nowen -d nowen_note_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_PG_DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test
      DATABASE_URL: postgres://nowen:nowen_ci_password@127.0.0.1:5432/nowen_note_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: TypeScript and database boundaries
        working-directory: backend
        run: |
          npm run build:tsc -- --noEmit
          npm run audit:sqlite-boundaries
          npm run audit:pg-schema-parity
      - name: PostgreSQL orchestration regression
        working-directory: backend
        run: >-
          node --import tsx --test --test-concurrency=1
          tests/postgres-migrations.test.ts
          tests/note-transfer-preview-runtime-pg.test.ts
          tests/note-transfer-attachment-staging-runtime-pg.test.ts
          tests/note-transfer-commit-runtime-pg.test.ts
          tests/note-transfer-cleanup-runtime-pg.test.ts
          tests/note-transfer-effects-runtime-pg.test.ts
          tests/note-transfer-move-deletion-runtime-pg.test.ts
          tests/note-transfer-orchestration-runtime-pg.test.ts
      - name: Production bundle
        working-directory: backend
        run: npm run build
