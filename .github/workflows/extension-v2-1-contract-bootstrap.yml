name: Extension V2.1 Contract Bootstrap

on:
  push:
    branches:
      - release/v1.5.0
    paths:
      - "scripts/generate-plugin-host-api.mjs"
      - "packages/nowen-plugin-sdk/*-contract.json"
      - ".github/workflows/extension-v2-1-contract-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Repair bootstrap-only generator escaping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/generate-plugin-host-api.mjs")
          text = path.read_text()
          before = text
          text = text.replace(
              'throw new Error(`Mock Host API 方法不存在: ${"${method}"}`);',
              'throw new Error("Mock Host API 方法不存在: " + method);',
          )
          text = text.replace(
              'throw new Error(`Mock Host API 未配置处理器: ${"${method}"}`);',
              'throw new Error("Mock Host API 未配置处理器: " + method);',
          )
          if text == before:
              raise SystemExit("bootstrap repair did not match generator source")
          path.write_text(text)
          PY
      - name: Generate unified capability artifacts
        run: node scripts/generate-plugin-host-api.mjs
      - name: Verify generated artifacts
        run: node scripts/generate-plugin-host-api.mjs --check
      - name: Commit synchronized artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/generate-plugin-host-api.mjs \
            backend/src/plugins/hostApiContract.generated.ts \
            backend/src/plugins/capabilityCatalog.generated.ts \
            packages/nowen-plugin-sdk/src/hostApi.generated.ts \
            packages/nowen-plugin-sdk/src/contributions.generated.ts \
            packages/nowen-plugin-sdk/src/errors.generated.ts \
            packages/nowen-plugin-sdk/src/mock.generated.ts \
            packages/nowen-plugin-sdk/capability-catalog.json \
            docs/plugin-platform/host-api.generated.md \
            docs/plugin-platform/contributions.generated.md
          if git diff --cached --quiet; then
            echo "No generated drift"
            exit 0
          fi
          git commit -m "feat(extensions): generate unified capability catalog"
          git push origin HEAD:release/v1.5.0
