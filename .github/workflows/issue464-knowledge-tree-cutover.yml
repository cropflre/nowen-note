name: Issue 464 Knowledge Tree Cutover

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/patch_issue464_knowledge_tree_only.py'
      - '.github/workflows/issue464-knowledge-tree-cutover.yml'

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cutover branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply exclusive knowledge-tree patch
        run: python3 scripts/patch_issue464_knowledge_tree_only.py
      - name: Keep workflow files out of the bot commit
        run: rm -f .github/workflows/knowledge-tree-only-ci.yml
      - name: Commit source cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/src/components/Sidebar.tsx \
            frontend/src/components/KnowledgeTreePanel.tsx \
            frontend/src/lib/__tests__/knowledgeTreeSidebarContract.test.ts
          git add -u \
            frontend/src/components/SharedNotebookTree.tsx \
            frontend/src/lib/sidebarTreeMode.ts \
            frontend/src/lib/__tests__/sharedNotebookTree.test.ts \
            frontend/src/lib/__tests__/sidebarTreeMode.test.ts
          git commit -m "feat(knowledge-tree): remove legacy Sidebar hierarchy"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
