name: Issue 464 Knowledge Tree Cutover

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/patch_issue464_knowledge_tree_only.py'
      - '.github/workflows/issue464-knowledge-tree-cutover.yml'

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cutover branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply exclusive knowledge-tree patch
        run: python3 scripts/patch_issue464_knowledge_tree_only.py
      - name: Remove one-time cutover files
        run: |
          rm scripts/patch_issue464_knowledge_tree_only.py
          rm .github/workflows/issue464-knowledge-tree-cutover.yml
      - name: Commit cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(knowledge-tree): remove legacy Sidebar hierarchy"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
