name: Shortcut Typecheck Diagnostic

on:
  push:
    branches:
      - agent/shortcut-help-center
  pull_request:
    branches:
      - main

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Clone and compact frontend typecheck
        shell: bash
        run: |
          git clone --quiet --depth 1 --branch agent/shortcut-help-center \
            https://github.com/cropflre/nowen-note.git source
          cd source/frontend
          npm ci --silent >/dev/null 2>&1
          set +e
          output="$(npx tsc -b --pretty false 2>&1)"
          status=$?
          printf '%s\n' "$output" | grep -E 'error TS|error:' | head -40 || true
          exit "$status"
