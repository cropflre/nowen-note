name: Temporary Imported Markdown PR Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'fix/imported-markdown-blank-and-format-selection'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply targeted regression fix
        run: python3 scripts/apply-imported-markdown-fix.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Run targeted regressions
        working-directory: frontend
        run: >-
          npm run test:run --
          src/components/__tests__/EditorPaneNativeMarkdownCollab.test.ts
          src/components/__tests__/DataManagerImportFormatSelection.test.ts
          src/lib/__tests__/importServiceSiyuanMarkdown.test.ts

      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc -b --pretty false

      - name: Commit validated source fix
        shell: bash
        run: |
          git checkout -- .github/workflows/import-format-ci.yml
          git checkout -- .github/workflows/issue-612-data-protection-ci.yml
          rm scripts/apply-imported-markdown-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/hooks/useYDoc.ts
          git add frontend/src/components/DataManager.tsx
          git add frontend/src/components/__tests__/EditorPaneNativeMarkdownCollab.test.ts
          git add frontend/src/components/__tests__/DataManagerImportFormatSelection.test.ts
          git add scripts/apply-imported-markdown-fix.py
          git commit -m "fix(import): preserve imported Markdown content and format choice"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
