name: Mobile Knowledge Tree CI

on:
  pull_request:
    paths:
      - "frontend/src/components/MobileKnowledgeTreePanel.tsx"
      - "frontend/src/components/Sidebar.tsx"
      - "frontend/src/components/__tests__/MobileKnowledgeTreePanel.test.ts"
      - "frontend/src/lib/mobileKnowledgeTree.ts"
      - "frontend/src/lib/__tests__/mobileKnowledgeTree.test.ts"
      - ".github/workflows/mobile-knowledge-tree-ci.yml"
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Mobile navigation regressions
        run: >-
          npm run test:run --
          src/lib/__tests__/mobileKnowledgeTree.test.ts
          src/components/__tests__/MobileKnowledgeTreePanel.test.ts
      - name: Frontend typecheck
        id: typecheck
        shell: bash
        run: |
          set +e
          npx tsc -b > mobile-tree-typecheck.log 2>&1
          code=$?
          cat mobile-tree-typecheck.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-knowledge-tree-typecheck
          path: frontend/mobile-tree-typecheck.log
          if-no-files-found: error
      - name: Require frontend typecheck
        if: steps.typecheck.outputs.exit_code != '0'
        run: exit 1
      - name: Frontend production build
        run: npm run build
