name: Shortcut Listener Migration

on:
  push:
    branches:
      - agent/shortcut-help-center

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shortcut-help-center
          fetch-depth: 0
      - name: Migrate listeners to shortcut registry
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"{label} pattern not found")
              return text.replace(old, new, 1)

          palette = Path("frontend/src/components/common/CommandPalette.tsx")
          text = palette.read_text(encoding="utf-8")
          text = replace_once(
              text,
              'import {\n  EDITOR_LAYOUT_TOGGLE_SHORTCUT_LABEL,\n  isEditorLayoutToggleShortcut,\n} from "@/lib/editorWorkspaceLayout";',
              'import {\n  detectShortcutPlatform,\n  detectShortcutSurface,\n  formatShortcutForCommand,\n  isShortcutAllowedInTarget,\n  shortcutMatchesEvent,\n} from "@/lib/shortcutRegistry";',
              "CommandPalette import",
          )
          text = replace_once(
              text,
              'function isEditableTarget(target: EventTarget | null): boolean {\n  if (!(target instanceof HTMLElement)) return false;\n  const tagName = target.tagName.toLowerCase();\n  return tagName === "input" || tagName === "textarea" || target.isContentEditable;\n}\n\n',
              '',
              "CommandPalette editable helper",
          )
          text = replace_once(
              text,
              '  const actions = useAppActions();\n  const [query, setQuery] = useState("");',
              '  const actions = useAppActions();\n  const shortcutPlatform = detectShortcutPlatform();\n  const shortcutSurface = detectShortcutSurface();\n  const [query, setQuery] = useState("");',
              "CommandPalette platform state",
          )
          text = replace_once(
              text,
              '        keywords: ["布局", "笔记列表", "创作模式", "管理模式", "sidebar", "list"],\n        shortcut: EDITOR_LAYOUT_TOGGLE_SHORTCUT_LABEL,\n        icon:',
              '        keywords: ["布局", "笔记列表", "创作模式", "管理模式", "sidebar", "list"],\n        icon:',
              "CommandPalette legacy shortcut label",
          )
          text = replace_once(
              text,
              '    return commands;\n  }, [',
              '    return commands.map((command) => {\n      const shortcut = formatShortcutForCommand(command.id, shortcutPlatform, shortcutSurface);\n      return shortcut ? { ...command, shortcut } : command;\n    });\n  }, [',
              "CommandPalette command mapping",
          )
          text = replace_once(
              text,
              '    state.noteListCollapsed,\n  ]);',
              '    state.noteListCollapsed,\n    shortcutPlatform,\n    shortcutSurface,\n  ]);',
              "CommandPalette dependencies",
          )
          text = replace_once(
              text,
              '      if (isEditorLayoutToggleShortcut(event) && !isEditableTarget(event.target)) {\n        event.preventDefault();\n        actions.toggleNoteListCollapsed();\n        return;\n      }\n      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {\n        event.preventDefault();\n        if (!open) window.dispatchEvent(new CustomEvent("nowen:open-command-palette"));\n      } else if (open && event.key === "Escape") {',
              '      if (\n        shortcutMatchesEvent("toggle-note-list", event, shortcutPlatform, shortcutSurface)\n        && isShortcutAllowedInTarget("toggle-note-list", event.target)\n      ) {\n        event.preventDefault();\n        actions.toggleNoteListCollapsed();\n        return;\n      }\n      if (\n        shortcutMatchesEvent("command-palette", event, shortcutPlatform, shortcutSurface)\n        && isShortcutAllowedInTarget("command-palette", event.target)\n      ) {\n        event.preventDefault();\n        if (!open) window.dispatchEvent(new CustomEvent("nowen:open-command-palette"));\n      } else if (open && event.key === "Escape") {',
              "CommandPalette keyboard listener",
          )
          text = replace_once(
              text,
              '  }, [actions, onClose, open]);',
              '  }, [actions, onClose, open, shortcutPlatform, shortcutSurface]);',
              "CommandPalette listener dependencies",
          )
          palette.write_text(text, encoding="utf-8")

          app = Path("frontend/src/App.tsx")
          text = app.read_text(encoding="utf-8")
          text = replace_once(
              text,
              'import { useDesktopMenuBridge } from "@/hooks/useDesktopMenuBridge";\n',
              'import { useDesktopMenuBridge } from "@/hooks/useDesktopMenuBridge";\nimport {\n  detectShortcutPlatform,\n  detectShortcutSurface,\n  isShortcutAllowedInTarget,\n  shortcutMatchesEvent,\n} from "@/lib/shortcutRegistry";\n',
              "App shortcut import",
          )
          text = replace_once(
              text,
              '  // Alt+N 全局快捷键：快速新建笔记\n  useEffect(() => {\n    const handleKeyDown = (e: KeyboardEvent) => {\n      if (e.altKey && e.key.toLowerCase() === "n") {\n        e.preventDefault();\n        void quickCreateNote();\n      }\n    };\n    window.addEventListener("keydown", handleKeyDown);\n    return () => window.removeEventListener("keydown", handleKeyDown);\n  }, [quickCreateNote]);',
              '  // 快速新建笔记：键位由统一注册表按 Web / Electron 运行端解析。\n  useEffect(() => {\n    const platform = detectShortcutPlatform();\n    const surface = detectShortcutSurface();\n    const handleKeyDown = (event: KeyboardEvent) => {\n      if (\n        shortcutMatchesEvent("new-note", event, platform, surface)\n        && isShortcutAllowedInTarget("new-note", event.target)\n      ) {\n        event.preventDefault();\n        void quickCreateNote();\n      }\n    };\n    window.addEventListener("keydown", handleKeyDown);\n    return () => window.removeEventListener("keydown", handleKeyDown);\n  }, [quickCreateNote]);',
              "App quick-create listener",
          )
          app.write_text(text, encoding="utf-8")

          Path(".github/workflows/shortcut-listener-migration.yml").unlink()
      - name: Commit listener migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.tsx frontend/src/components/common/CommandPalette.tsx .github/workflows
          git commit -m "refactor(shortcuts): consume registry in global listeners"
          git push origin HEAD:agent/shortcut-help-center
