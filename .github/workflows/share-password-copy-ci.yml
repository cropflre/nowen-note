name: Share Password Copy CI

on:
  pull_request:
    paths:
      - "frontend/src/components/ShareModal.tsx"
      - "frontend/src/lib/shareCopySession.ts"
      - "frontend/src/lib/__tests__/shareCopySession.test.ts"
      - "frontend/src/lib/__tests__/shareModalPasswordCopy.test.tsx"
      - "frontend/src/i18n/coverageTranslations.ts"
      - "frontend/src/types/index.ts"
      - ".github/workflows/share-password-copy-ci.yml"

jobs:
  share-password-copy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Clipboard credential lifecycle and ShareModal UI
        run: npm run test:run -- src/lib/__tests__/shareCopySession.test.ts src/lib/__tests__/shareModalPasswordCopy.test.tsx
      - name: TypeScript
        run: npx tsc -b
