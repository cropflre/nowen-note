name: Desktop Note Manual Sort CI

on:
  push:
    branches: ["release/v1.5.2"]
    paths:
      - "frontend/src/components/NoteList.tsx"
      - "frontend/src/components/__tests__/NoteListPresentation.test.tsx"
      - "frontend/src/lib/noteManualSort.ts"
      - "frontend/src/lib/__tests__/noteManualSort.test.ts"
      - ".github/workflows/issue-814-manual-drag-ci.yml"
  pull_request:
    paths:
      - "frontend/src/components/NoteList.tsx"
      - "frontend/src/components/__tests__/NoteListPresentation.test.tsx"
      - "frontend/src/lib/noteManualSort.ts"
      - "frontend/src/lib/__tests__/noteManualSort.test.ts"
      - ".github/workflows/issue-814-manual-drag-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  note-drag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --silent
      - name: Note list HTML5 drag and manual sort regressions
        run: npx vitest run src/components/__tests__/NoteListPresentation.test.tsx src/lib/__tests__/noteManualSort.test.ts --reporter=verbose
      - name: TypeScript
        run: npx tsc -b --pretty false
