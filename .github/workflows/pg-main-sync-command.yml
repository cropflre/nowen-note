name: PostgreSQL Main Sync Command

on:
  pull_request:
    paths:
      - ".github/workflows/pg-main-sync-command.yml"

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pg-migration-unified
          fetch-depth: 0
      - name: Merge latest main and preserve PostgreSQL boundaries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          expected=$'backend/src/services/realtime.ts\nbackend/tests/knowledge-tree.test.ts'
          if [ "${merge_status}" -ne 0 ] && [ "${conflicts}" != "${expected}" ]; then
            echo "Unexpected merge conflicts:"
            printf '%s\n' "${conflicts}"
            exit 1
          fi

          git checkout --theirs backend/src/services/realtime.ts
          git checkout --ours backend/tests/knowledge-tree.test.ts
          python3 backend/scripts/reconcile-pg-main-20260804.py
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"

          cd backend
          npm ci
          npm run build:tsc
          npm run audit:sqlite-boundaries
          node --import tsx --import ./tests/setup-db-isolation.ts --test \
            tests/knowledge-tree.test.ts \
            tests/yjs-durability.test.ts
          cd ..

          git rm -f \
            .github/workflows/pg-main-sync-command.yml \
            backend/scripts/reconcile-pg-main-20260804.py
          git add -A
          git commit -m "chore(pg): merge latest main and preserve runtime boundaries"
          git push origin HEAD:pg-migration-unified
