name: Attachment Markdown Math CI

on:
  workflow_dispatch:
  push:
    branches: [main, "release/**"]
    paths:
      - "frontend/src/components/attachmentPreview/AttachmentTextPreview.tsx"
      - "frontend/src/components/attachmentPreview/AttachmentPreview.tsx"
      - "frontend/src/components/MarkdownPreview.tsx"
      - "frontend/src/components/MathView.tsx"
      - "frontend/src/lib/katexRenderer.ts"
      - "frontend/src/components/__tests__/AttachmentTextPreview.math.test.tsx"
      - ".github/workflows/attachment-markdown-math-ci.yml"
  pull_request:
    paths:
      - "frontend/src/components/attachmentPreview/AttachmentTextPreview.tsx"
      - "frontend/src/components/attachmentPreview/AttachmentPreview.tsx"
      - "frontend/src/components/MarkdownPreview.tsx"
      - "frontend/src/components/MathView.tsx"
      - "frontend/src/lib/katexRenderer.ts"
      - "frontend/src/components/__tests__/AttachmentTextPreview.math.test.tsx"
      - ".github/workflows/attachment-markdown-math-ci.yml"

permissions:
  contents: read

jobs:
  attachment-markdown-math:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run attachment math and shared Markdown regression tests
        run: npx vitest run src/components/__tests__/AttachmentTextPreview.math.test.tsx src/components/__tests__/MarkdownPreview.test.tsx src/components/__tests__/AttachmentPdfPreview.test.tsx --reporter=verbose
      - name: Build production frontend
        run: npm run build
