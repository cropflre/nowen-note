name: Resource Routing CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/v1.5.0
    paths:
      - "frontend/src/App.tsx"
      - "frontend/src/components/NoteDeepLinkBridge.tsx"
      - "frontend/src/components/NoteTabsBar.tsx"
      - "frontend/src/components/__tests__/NoteDeepLinkBridge.test.tsx"
      - "frontend/src/components/__tests__/NoteTabsBar.test.tsx"
      - "frontend/src/lib/appPathNavigation.ts"
      - "frontend/src/lib/noteDeepLink.ts"
      - "frontend/src/lib/mindMapDeepLink.ts"
      - "frontend/src/lib/sheetDeepLink.ts"
      - "frontend/src/lib/__tests__/appPathNavigation.test.ts"
      - "frontend/src/lib/__tests__/noteDeepLink.test.ts"
      - "frontend/src/i18n/locales/zh-CN.json"
      - "frontend/src/i18n/locales/en.json"
      - ".github/workflows/resource-routing-ci.yml"
  pull_request:
    paths:
      - "frontend/src/App.tsx"
      - "frontend/src/components/NoteDeepLinkBridge.tsx"
      - "frontend/src/components/NoteTabsBar.tsx"
      - "frontend/src/components/__tests__/NoteDeepLinkBridge.test.tsx"
      - "frontend/src/components/__tests__/NoteTabsBar.test.tsx"
      - "frontend/src/lib/appPathNavigation.ts"
      - "frontend/src/lib/noteDeepLink.ts"
      - "frontend/src/lib/mindMapDeepLink.ts"
      - "frontend/src/lib/sheetDeepLink.ts"
      - "frontend/src/lib/__tests__/appPathNavigation.test.ts"
      - "frontend/src/lib/__tests__/noteDeepLink.test.ts"
      - "frontend/src/i18n/locales/zh-CN.json"
      - "frontend/src/i18n/locales/en.json"
      - ".github/workflows/resource-routing-ci.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Resource route regression tests
        run: >-
          npm run test:run --
          src/lib/__tests__/appPathNavigation.test.ts
          src/lib/__tests__/noteDeepLink.test.ts
          src/components/__tests__/NoteDeepLinkBridge.test.tsx
          src/components/__tests__/NoteTabsBar.test.tsx
      - name: Frontend typecheck
        run: npx tsc -b
